apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: ai-stack
  labels:
    app: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: OLLAMA_BASE_URLS
              value: "http://ollama-5090:11434;http://ollama:11434"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: "http://localai:8080/v1"
            - name: OPENAI_API_KEY
              value: "localai"
            # Image generation runs on ComfyUI (rke2-node-50 / RTX 5090). This
            # replaces the localai-image-proxy backend, which pointed at a Service
            # that does not exist and a localai Deployment scaled to 0.
            #
            # InvokeAI is the default front door for humans, but it cannot be the
            # backend here: Open WebUI only implements openai, gemini, comfyui and
            # automatic1111 engines, and InvokeAI exposes neither an A1111- nor an
            # OpenAI-images-compatible API. Pointing this at InvokeAI would need a
            # translation shim. ComfyUI stays wired so chat-driven image generation
            # keeps working.
            #
            # These env vars seed Open WebUI's defaults on a fresh DB only — an
            # existing install also needs Admin Settings -> Images switched over.
            - name: ENABLE_IMAGE_GENERATION
              value: "true"
            - name: IMAGE_GENERATION_ENGINE
              value: "comfyui"
            - name: COMFYUI_BASE_URL
              value: "http://comfyui.comfyui.svc.cluster.local:8188"
            - name: WEBUI_AUTH
              value: "false"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: openwebui-data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: openwebui-data
          persistentVolumeClaim:
            claimName: openwebui-pvc
