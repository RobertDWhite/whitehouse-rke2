apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-router-config
  namespace: ai-stack
data:
  nginx.conf: |
    events {}
    http {
      log_format ollama '$remote_addr [$time_local] "$request" $status $request_time';

      # The Mac mini (M4 Pro 48GB, MiniTheertWhite, brew ollama via launchd
      # fm.white.ollama) is primary: qwen3.8:27b responds reliably there. The
      # 5090 is backup while node-50's disk pressure and model latency are
      # investigated. The Spark's Ollama was retired 2026-10-14; the GB10 now
      # runs Qwen3.8-Flash-Next (apps/ai/qwen-flash).
      # max_fails=0 on the backup: never eject it. Otherwise a cold-model load
      # (briefly not accepting connections) trips the default max_fails=1 and,
      # with the primary down, every queued request gets an instant
      # "no live upstreams" 502 for the fail_timeout window.
      upstream ollama_backends {
        server 10.100.0.70:11434 max_fails=0;
        server ollama-5090.ai-stack.svc.cluster.local:11434 backup max_fails=0;
      }

      server {
        listen 11434;
        client_body_buffer_size      1m;
        client_body_in_single_buffer on;
        client_max_body_size         100m;

        location / {
          access_log /dev/stdout ollama;
          proxy_pass         http://ollama_backends;
          # http_500 + non_idempotent: a backend that can't load the model
          # (e.g. 5090 CUDA OOM when another pod holds the VRAM) answers the
          # POST with a 500; without these nginx never retries a POST on a
          # backup and every LLM consumer fails.
          proxy_next_upstream error timeout http_500 http_502 http_503 http_504 non_idempotent;
          proxy_next_upstream_tries 3;
          proxy_connect_timeout  5s;
          # Keep the long cold-load window because requests can fall back to
          # the 5090, whose model files are on network-backed storage.
          proxy_read_timeout    900s;
          proxy_send_timeout    900s;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_buffering    off;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
        }
      }
    }
