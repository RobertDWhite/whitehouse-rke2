# Mirrors a GitHub repo into a folder of the Forgejo brain repo (script:
# repo-mirror/mirror.sh). Source, destination and label live in the SOPS secret.
# Reads GitHub with a read-only deploy key on that one repo; writes as the
# brain-sync bot.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: repo-mirror
  namespace: brain
spec:
  schedule: "*/15 * * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: repo-mirror
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            # alpine's "nobody": ssh refuses to run for a uid with no passwd entry.
            runAsUser: 65534
            runAsGroup: 65534
            # Lets the non-root container read the deploy key (mode 0440).
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image: alpine/git
              command: [sh, /config/mirror.sh]
              env:
                - name: FORGEJO_TOKEN
                  valueFrom:
                    secretKeyRef: {name: repo-mirror, key: FORGEJO_TOKEN}
                - name: SRC_REPO
                  valueFrom:
                    secretKeyRef: {name: repo-mirror, key: SRC_REPO}
                - name: DEST_DIR
                  valueFrom:
                    secretKeyRef: {name: repo-mirror, key: DEST_DIR}
                - name: MIRROR_LABEL
                  valueFrom:
                    secretKeyRef: {name: repo-mirror, key: MIRROR_LABEL}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: secrets, mountPath: /secrets, readOnly: true}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: config
              configMap:
                name: repo-mirror
            - name: secrets
              secret:
                secretName: repo-mirror
                defaultMode: 0440
                items:
                  - {key: deploy-key, path: deploy-key}
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
