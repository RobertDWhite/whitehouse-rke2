apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 14-pv-nas.yaml
  - 20-sync-deployment.yaml
  - 21-mcp-deployment.yaml
  - 30-service.yaml
  - 31-mcp-service.yaml
  - 40-repo-mirror-cronjob.yaml
  - 45-nas-sync-cronjob.yaml
  - 54-httproute-mcp.yaml
  - 50-briefing-cronjob.yaml
  - 55-messages-cronjob.yaml
  - 60-networkpolicy.yaml

generators:
  - ksops.yaml

configMapGenerator:
  - name: brain-sync-script
    namespace: brain
    files:
      - sync/brain_sync.py
  - name: brain-mcp-script
    namespace: brain
    files:
      - mcp/brain_mcp.py
      - mcp/git-sync.sh
  - name: brain-briefing-script
    namespace: brain
    files:
      - briefing/briefing.py
  - name: brain-messages-script
    namespace: brain
    files:
      - messages/messages_sync.py
  - name: repo-mirror
    namespace: brain
    options:
      disableNameSuffixHash: true
    files:
      - mirror.sh=repo-mirror/mirror.sh
      - known_hosts=repo-mirror/known_hosts

images:
  - name: python
    newTag: "3.15-slim"
  - name: alpine/git
    newTag: "v2.54.0"
