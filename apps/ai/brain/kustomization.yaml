apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 20-sync-deployment.yaml
  - 30-service.yaml
  - 40-ww-mirror-cronjob.yaml
  - 60-networkpolicy.yaml

generators:
  - ksops.yaml

configMapGenerator:
  - name: brain-sync-script
    namespace: brain
    files:
      - sync/brain_sync.py
  - name: ww-mirror
    namespace: brain
    options:
      disableNameSuffixHash: true
    files:
      - mirror.sh=ww-mirror/mirror.sh
      - known_hosts=ww-mirror/known_hosts

images:
  - name: python
    newTag: "3.15-slim"
  - name: alpine/git
    newTag: "v2.54.0"
