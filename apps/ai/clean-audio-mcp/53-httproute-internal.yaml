apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clean-audio-mcp-internal
  namespace: clean-audio-mcp
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - clean-audio-mcp.internal.white.fm
  rules:
    - backendRefs:
        - name: clean-audio-mcp
          port: 8080
