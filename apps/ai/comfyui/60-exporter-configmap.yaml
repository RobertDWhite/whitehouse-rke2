apiVersion: v1
kind: ConfigMap
metadata:
  name: comfyui-exporter-script
  namespace: comfyui
data:
  exporter.py: |
    #!/usr/bin/env python3
    """Prometheus exporter for ComfyUI — polls /system_stats, /prompt, /queue."""
    import json
    import logging
    import os
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from threading import Lock, Thread

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger(__name__)

    POLL_INTERVAL = int(os.getenv("POLL_INTERVAL", "15"))
    LISTEN_PORT = int(os.getenv("LISTEN_PORT", "9402"))
    COMFY_URL = os.getenv("COMFYUI_URL", "http://comfyui.comfyui.svc.cluster.local:8188")

    _lock = Lock()
    _state: dict = {}


    def _fetch(path: str, timeout: int = 5):
        """Return (data_or_none, latency_seconds)."""
        t0 = time.monotonic()
        try:
            with urllib.request.urlopen(f"{COMFY_URL}{path}", timeout=timeout) as r:
                return json.loads(r.read()), time.monotonic() - t0
        except Exception:
            return None, time.monotonic() - t0


    def collect():
        stats, lat = _fetch("/system_stats")
        if stats is None:
            return {"up": 0, "lat": lat}

        prompt, _ = _fetch("/prompt")
        queue, _ = _fetch("/queue")

        return {
            "up": 1,
            "lat": lat,
            "devices": stats.get("devices", []),
            "system": stats.get("system", {}),
            "queue_remaining": (prompt or {}).get("exec_info", {}).get("queue_remaining", 0),
            "queue_running": len((queue or {}).get("queue_running", [])),
            "queue_pending": len((queue or {}).get("queue_pending", [])),
        }


    def poll_loop():
        global _state
        while True:
            try:
                fresh = collect()
            except Exception:
                log.exception("collection failed")
                fresh = {"up": 0, "lat": 0.0}
            with _lock:
                _state = fresh
            time.sleep(POLL_INTERVAL)


    def _esc(v: str) -> str:
        return str(v).replace("\\", "\\\\").replace('"', '\\"')


    def render() -> str:
        with _lock:
            s = dict(_state)
        if not s:
            return "# no data yet\n"

        out = [
            "# HELP comfyui_up ComfyUI API reachable (1) or not (0).",
            "# TYPE comfyui_up gauge",
            f'comfyui_up {s.get("up", 0)}',
            "# HELP comfyui_scrape_latency_seconds Latency of the /system_stats call.",
            "# TYPE comfyui_scrape_latency_seconds gauge",
            f'comfyui_scrape_latency_seconds {s.get("lat", 0.0):.6f}',
        ]

        if not s.get("up"):
            return "\n".join(out) + "\n"

        sysinfo = s.get("system", {})
        out += [
            "# HELP comfyui_info Static build info.",
            "# TYPE comfyui_info gauge",
            'comfyui_info{{version="{}",python="{}",pytorch="{}"}} 1'.format(
                _esc(sysinfo.get("comfyui_version", "unknown")),
                _esc(sysinfo.get("python_version", "unknown").split()[0]),
                _esc(sysinfo.get("pytorch_version", "unknown")),
            ),
            "# HELP comfyui_queue_remaining Prompts left in the execution queue.",
            "# TYPE comfyui_queue_remaining gauge",
            f'comfyui_queue_remaining {s.get("queue_remaining", 0)}',
            "# HELP comfyui_queue_running Prompts currently executing.",
            "# TYPE comfyui_queue_running gauge",
            f'comfyui_queue_running {s.get("queue_running", 0)}',
            "# HELP comfyui_queue_pending Prompts waiting to execute.",
            "# TYPE comfyui_queue_pending gauge",
            f'comfyui_queue_pending {s.get("queue_pending", 0)}',
            "# HELP comfyui_device_vram_total_bytes Total VRAM per torch device.",
            "# TYPE comfyui_device_vram_total_bytes gauge",
            "# HELP comfyui_device_vram_free_bytes Free VRAM per torch device.",
            "# TYPE comfyui_device_vram_free_bytes gauge",
            "# HELP comfyui_device_torch_vram_total_bytes VRAM torch has reserved.",
            "# TYPE comfyui_device_torch_vram_total_bytes gauge",
            "# HELP comfyui_device_torch_vram_free_bytes Free VRAM inside torch's reservation.",
            "# TYPE comfyui_device_torch_vram_free_bytes gauge",
        ]

        for dev in s.get("devices", []):
            labels = 'device="{}",type="{}"'.format(
                _esc(dev.get("name", "unknown")), _esc(dev.get("type", "unknown"))
            )
            for metric, key in (
                ("comfyui_device_vram_total_bytes", "vram_total"),
                ("comfyui_device_vram_free_bytes", "vram_free"),
                ("comfyui_device_torch_vram_total_bytes", "torch_vram_total"),
                ("comfyui_device_torch_vram_free_bytes", "torch_vram_free"),
            ):
                out.append(f'{metric}{{{labels}}} {dev.get(key, 0)}')

        return "\n".join(out) + "\n"


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404)
                self.end_headers()
                return
            body = render().encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    if __name__ == "__main__":
        Thread(target=poll_loop, daemon=True).start()
        log.info("serving metrics on :%d for %s", LISTEN_PORT, COMFY_URL)
        HTTPServer(("0.0.0.0", LISTEN_PORT), Handler).serve_forever()
