apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-exporter
  namespace: comfyui
spec:
  replicas: 1
  selector:
    # Full label set for the same reason as 10-deployment.yaml: selectors are now
    # hand-written and immutable once created.
    matchLabels:
      app: comfyui-exporter
      app.kubernetes.io/part-of: comfyui
      managed-by: argocd
  template:
    metadata:
      labels:
        # Must carry every key the immutable selector above matches on.
        app: comfyui-exporter
        app.kubernetes.io/part-of: comfyui
        managed-by: argocd
    spec:
      containers:
        - name: exporter
          image: python
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/exporter.py"]
          ports:
            - containerPort: 9402
          env:
            - name: POLL_INTERVAL
              value: "15"
            - name: LISTEN_PORT
              value: "9402"
            - name: COMFYUI_URL
              value: "http://comfyui.comfyui.svc.cluster.local:8188"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9402
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9402
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: comfyui-exporter-script
