apiVersion: v1
kind: ConfigMap
metadata:
  name: comfyui-model-seed
  namespace: comfyui
data:
  # One model per line: "<subdir> <filename> <url>". Blank lines and # are ignored.
  # <subdir> is relative to /basedir/models (ComfyUI's standard model tree).
  # Add a line here and re-sync to pull a new model; existing files are skipped.
  models.txt: |
    # --- SDXL 1.0: solid, fast baseline, CreativeML Open RAIL++-M ---
    checkpoints  sd_xl_base_1.0.safetensors  https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0/resolve/main/sd_xl_base_1.0.safetensors
    vae          sdxl.vae.safetensors        https://huggingface.co/madebyollin/sdxl-vae-fp16-fix/resolve/main/sdxl.vae.safetensors

    # --- FLUX.1-schnell fp8, all-in-one checkpoint: Apache 2.0, 4-step, ~17GB ---
    checkpoints  flux1-schnell-fp8.safetensors  https://huggingface.co/Comfy-Org/flux1-schnell/resolve/main/flux1-schnell-fp8.safetensors

    # --- Upscaler, BSD-3 ---
    upscale_models  RealESRGAN_x4plus.pth  https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth

  seed.py: |
    #!/usr/bin/env python3
    """Seed ComfyUI's model tree. Idempotent: skips files that already exist.

    Every fetch goes through the VPN proxy (HTTPS_PROXY), because the comfyui
    namespace has no other egress path. One bad entry does not fail the job —
    each result is reported and a non-zero exit only happens if every entry failed.
    """
    import os
    import shutil
    import sys
    import tempfile
    import urllib.request

    MODELS_DIR = os.getenv("MODELS_DIR", "/basedir/models")
    LIST_FILE = os.getenv("LIST_FILE", "/config/models.txt")
    UID = int(os.getenv("WANTED_UID", "1024"))
    GID = int(os.getenv("WANTED_GID", "1024"))


    def parse(path):
        entries = []
        with open(path) as fh:
            for lineno, raw in enumerate(fh, 1):
                line = raw.strip()
                if not line or line.startswith("#"):
                    continue
                parts = line.split()
                if len(parts) != 3:
                    print(f"!! {LIST_FILE}:{lineno}: expected 3 fields, got {len(parts)} — skipping")
                    continue
                entries.append(tuple(parts))
        return entries


    def download(url, dest):
        tmp_fd, tmp_path = tempfile.mkstemp(dir=os.path.dirname(dest), suffix=".part")
        os.close(tmp_fd)
        try:
            req = urllib.request.Request(url, headers={"User-Agent": "comfyui-model-seed/1"})
            with urllib.request.urlopen(req, timeout=120) as r, open(tmp_path, "wb") as out:
                total = int(r.headers.get("Content-Length") or 0)
                done = 0
                next_mark = 0
                while True:
                    chunk = r.read(8 * 1024 * 1024)
                    if not chunk:
                        break
                    out.write(chunk)
                    done += len(chunk)
                    if total and done >= next_mark:
                        print(f"   {done / 1e9:.2f}/{total / 1e9:.2f} GB", flush=True)
                        next_mark += max(total // 10, 1)
            os.chmod(tmp_path, 0o644)
            try:
                os.chown(tmp_path, UID, GID)
            except PermissionError:
                pass
            os.replace(tmp_path, dest)
        except BaseException:
            if os.path.exists(tmp_path):
                os.remove(tmp_path)
            raise


    def main():
        entries = parse(LIST_FILE)
        if not entries:
            print("nothing to do — model list is empty")
            return 0

        print(f"proxy: {os.getenv('HTTPS_PROXY', '<none>')}")
        ok, skipped, failed = 0, 0, []

        for subdir, filename, url in entries:
            target_dir = os.path.join(MODELS_DIR, subdir)
            dest = os.path.join(target_dir, filename)
            if os.path.exists(dest):
                print(f"== skip {subdir}/{filename} (already present)")
                skipped += 1
                continue

            os.makedirs(target_dir, exist_ok=True)
            free = shutil.disk_usage(target_dir).free
            print(f"== fetch {subdir}/{filename} ({free / 1e9:.0f} GB free)")
            print(f"   {url}")
            try:
                download(url, dest)
            except Exception as exc:
                print(f"!! FAILED {subdir}/{filename}: {exc}")
                failed.append(f"{subdir}/{filename}")
                continue
            print(f"== done {subdir}/{filename}")
            ok += 1

        print(f"\nsummary: {ok} downloaded, {skipped} skipped, {len(failed)} failed")
        for f in failed:
            print(f"  failed: {f}")
        # Only hard-fail when nothing at all succeeded and nothing was already there,
        # so one dead URL doesn't block the rest of the sync.
        return 1 if failed and not ok and not skipped else 0


    if __name__ == "__main__":
        sys.exit(main())
