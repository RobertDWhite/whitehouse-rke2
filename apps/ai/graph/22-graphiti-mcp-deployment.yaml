# Graphiti MCP server (getzep/graphiti mcp_server, standalone image) over
# streamable HTTP on :8000/mcp. It has no auth of its own: the gateway enforces
# the bearer token (53-httproute.yaml) and the NetworkPolicy only admits the
# gateway. LLM/embedder endpoints are set by the graphiti-models ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphiti-mcp
  namespace: graph
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: graphiti-mcp
  template:
    metadata:
      labels:
        app: graphiti-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: graphiti-mcp
          image: docker.io/zepai/knowledge-graph-mcp:1.1.3-graphiti-0.31.2-standalone@sha256:76b835abad42b6c47aea78860014850e300b6a237c0ce3de314b1e0b174c11a2
          workingDir: /app/mcp
          command: ["/app/mcp/.venv/bin/python", "main.py", "--config", "/config/graphiti.yaml"]
          envFrom:
            - configMapRef:
                name: graphiti-models
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: {name: neo4j-auth, key: NEO4J_PASSWORD}
            # Concurrent LLM calls per episode; local models serve one or two at a time.
            - {name: SEMAPHORE_LIMIT, value: "2"}
            - {name: GRAPHITI_TELEMETRY_ENABLED, value: "false"}
            - {name: HOME, value: /tmp}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: graphiti-config
        - name: tmp
          emptyDir: {}
