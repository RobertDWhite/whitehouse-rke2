apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: graph
spec:
  selector:
    app: neo4j
  ports:
    - {name: http, port: 7474, targetPort: http}
    - {name: bolt, port: 7687, targetPort: bolt}
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: graph
spec:
  selector:
    app: embeddings
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: graphiti-mcp
  namespace: graph
spec:
  selector:
    app: graphiti-mcp
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: graphiti-ingest
  namespace: graph
  labels:
    app: graphiti-ingest
spec:
  selector:
    app: graphiti-ingest
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
