# InvokeAI on rke2-node-50 (RTX 5090) — the default front door for image
# generation. Unlike ComfyUI's image, this one ships its venv baked in, so there
# is no install-on-first-boot step and no separate runtime volume.
#
# Egress is default-deny except the media/vpn-proxy (see 50-networkpolicy.yaml),
# so the *_PROXY vars are load-bearing: the built-in model manager downloads
# weights from HuggingFace/CivitAI through them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invokeai
  namespace: invokeai
  labels:
    app: invokeai
spec:
  replicas: 1
  strategy:
    # RWO volumes on one node — the old pod must release them before the new one binds.
    type: Recreate
  selector:
    # Spelled out in full: the `labels` transformer no longer writes selectors, and a
    # Deployment selector is immutable — this must keep matching the live object.
    matchLabels:
      app: invokeai
      app.kubernetes.io/part-of: invokeai
      managed-by: argocd
  template:
    metadata:
      labels:
        # Must carry every key the immutable selector above matches on.
        app: invokeai
        app.kubernetes.io/part-of: invokeai
        managed-by: argocd
      annotations:
        # Weights are re-downloadable via the model manager; only the root volume
        # (outputs, sqlite DBs, configs) is worth a kopia backup.
        backup.velero.io/backup-volumes-excludes: models
    spec:
      priorityClassName: high-priority
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: rke2-node-50
      tolerations:
        # node-50 is a transient dual-boot host — survive it going away rather than
        # getting evicted into a Pending loop the nodeSelector can never satisfy.
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
        - key: dedicated
          operator: Equal
          value: gpu
          effect: PreferNoSchedule
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        # local-path is hostPath-backed so fsGroup is a no-op today, but this keeps
        # a 500Gi recursive chown off the startup path if these ever move to Longhorn.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: invokeai
          image: ghcr.io/invoke-ai/invokeai
          ports:
            - name: http
              containerPort: 9090
          # No allowPrivilegeEscalation:false / drop:ALL here — the entrypoint starts
          # as root and drops to the container uid (lessons L013/L014).
          env:
            - name: CONTAINER_UID
              value: "1000"
            - name: INVOKEAI_ROOT
              value: /invokeai
            # Default bind is 127.0.0.1, which would make the Service a black hole.
            - name: INVOKEAI_HOST
              value: "0.0.0.0"
            - name: INVOKEAI_PORT
              value: "9090"
            - name: HTTP_PROXY
              value: http://vpn-proxy.media.svc.cluster.local:8888
            - name: HTTPS_PROXY
              value: http://vpn-proxy.media.svc.cluster.local:8888
            - name: http_proxy
              value: http://vpn-proxy.media.svc.cluster.local:8888
            - name: https_proxy
              value: http://vpn-proxy.media.svc.cluster.local:8888
            - name: NO_PROXY
              value: .svc.cluster.local,.cluster.local,localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16
            - name: no_proxy
              value: .svc.cluster.local,.cluster.local,localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16
          resources:
            requests:
              cpu: "1"
              memory: "8Gi"
            limits:
              cpu: "12"
              memory: "48Gi"
              nvidia.com/gpu: 1
          startupProbe:
            # No pip install on boot, but the first start builds the sqlite DBs and
            # scans the model dir. 10 minutes is generous.
            httpGet:
              path: /api/v1/app/version
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/app/version
              port: 9090
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/app/version
              port: 9090
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /invokeai
            - name: models
              mountPath: /invokeai/models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: invokeai-data
        - name: models
          persistentVolumeClaim:
            claimName: invokeai-models
        - name: dshm
          # Torch dataloader workers need more than the default 64Mi.
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
