apiVersion: v1
kind: ConfigMap
metadata:
  name: invokeai-exporter-script
  namespace: invokeai
data:
  exporter.py: |
    #!/usr/bin/env python3
    """Prometheus exporter for InvokeAI — polls /api/v1/app/version and the queue status."""
    import json
    import logging
    import os
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from threading import Lock, Thread

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger(__name__)

    POLL_INTERVAL = int(os.getenv("POLL_INTERVAL", "15"))
    LISTEN_PORT = int(os.getenv("LISTEN_PORT", "9403"))
    INVOKE_URL = os.getenv("INVOKEAI_URL", "http://invokeai.invokeai.svc.cluster.local:9090")
    QUEUE_ID = os.getenv("INVOKEAI_QUEUE_ID", "default")

    # Fields on InvokeAI's SessionQueueStatus that map 1:1 onto gauges.
    QUEUE_FIELDS = ("pending", "in_progress", "waiting", "completed", "failed", "canceled", "total")

    _lock = Lock()
    _state: dict = {}


    def _fetch(path: str, timeout: int = 5):
        """Return (data_or_none, latency_seconds)."""
        t0 = time.monotonic()
        try:
            with urllib.request.urlopen(f"{INVOKE_URL}{path}", timeout=timeout) as r:
                return json.loads(r.read()), time.monotonic() - t0
        except Exception:
            return None, time.monotonic() - t0


    def collect():
        ver, lat = _fetch("/api/v1/app/version")
        if ver is None:
            return {"up": 0, "lat": lat}

        queue, _ = _fetch(f"/api/v1/queue/{QUEUE_ID}/status")
        # The queue payload nests the counts under "queue"; tolerate both shapes.
        counts = (queue or {}).get("queue", queue or {})

        return {
            "up": 1,
            "lat": lat,
            "version": ver.get("version", "unknown"),
            "queue": {f: counts.get(f, 0) for f in QUEUE_FIELDS},
        }


    def poll_loop():
        global _state
        while True:
            try:
                fresh = collect()
            except Exception:
                log.exception("collection failed")
                fresh = {"up": 0, "lat": 0.0}
            with _lock:
                _state = fresh
            time.sleep(POLL_INTERVAL)


    def _esc(v: str) -> str:
        return str(v).replace("\\", "\\\\").replace('"', '\\"')


    def render() -> str:
        with _lock:
            s = dict(_state)
        if not s:
            return "# no data yet\n"

        out = [
            "# HELP invokeai_up InvokeAI API reachable (1) or not (0).",
            "# TYPE invokeai_up gauge",
            f'invokeai_up {s.get("up", 0)}',
            "# HELP invokeai_scrape_latency_seconds Latency of the version call.",
            "# TYPE invokeai_scrape_latency_seconds gauge",
            f'invokeai_scrape_latency_seconds {s.get("lat", 0.0):.6f}',
        ]

        if not s.get("up"):
            return "\n".join(out) + "\n"

        out += [
            "# HELP invokeai_info Static build info.",
            "# TYPE invokeai_info gauge",
            'invokeai_info{{version="{}"}} 1'.format(_esc(s.get("version", "unknown"))),
        ]

        queue = s.get("queue", {})
        for field in QUEUE_FIELDS:
            metric = f"invokeai_queue_{field}"
            out += [
                f"# HELP {metric} Queue items in state '{field}'.",
                f"# TYPE {metric} gauge",
                f'{metric}{{queue_id="{_esc(QUEUE_ID)}"}} {queue.get(field, 0)}',
            ]

        return "\n".join(out) + "\n"


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404)
                self.end_headers()
                return
            body = render().encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    if __name__ == "__main__":
        Thread(target=poll_loop, daemon=True).start()
        log.info("serving metrics on :%d for %s", LISTEN_PORT, INVOKE_URL)
        HTTPServer(("0.0.0.0", LISTEN_PORT), Handler).serve_forever()
