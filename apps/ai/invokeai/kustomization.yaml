apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: invokeai

resources:
  - 00-namespace.yaml
  - 10-deployment.yaml
  - 20-service.yaml
  - 30-httproute-internal.yaml
  - 50-networkpolicy.yaml
  - 60-exporter-configmap.yaml
  - 61-exporter-deployment.yaml
  - 62-exporter-service.yaml

# NOT commonLabels. That transformer also rewrites NetworkPolicy *peer* selectors,
# so it silently appended these two labels to the kube-dns and vpn-proxy podSelectors
# in 50-networkpolicy.yaml. Nothing in kube-system or media carries them, so every
# DNS and proxy egress rule matched zero pods and fell through to default-deny —
# InvokeAI came up but every outbound call died on "Temporary failure in name
# resolution". With includeSelectors:false the transformer only stamps
# metadata.labels, so selectors and pod-template labels are written by hand below.
labels:
  - pairs:
      managed-by: argocd
      app.kubernetes.io/part-of: invokeai
    includeSelectors: false

images:
  # -cuda variant; the 5090 needs a cu128+ torch, which the 6.x images ship.
  - name: ghcr.io/invoke-ai/invokeai
    newTag: "6.14.0-cuda"

  - name: python
    newTag: "3.14-alpine"
