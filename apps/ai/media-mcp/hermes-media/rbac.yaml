apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-media-observer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-media-observer
  namespace: media
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: hermes-media-observer}
subjects:
  - {kind: ServiceAccount, name: hermes-media-context, namespace: media-mcp}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-media-observer
  namespace: media-mcp
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: hermes-media-observer}
subjects:
  - {kind: ServiceAccount, name: hermes-media-context, namespace: media-mcp}
---
