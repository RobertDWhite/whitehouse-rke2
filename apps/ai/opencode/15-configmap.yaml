apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  # Loaded via OPENCODE_CONFIG — sits above the PVC's global config, so
  # providers added later with /connect (stored in auth.json) still merge in.
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "autoupdate": false,
      "share": "disabled",
      "model": "ollama/qwen3.8:27b",
      "small_model": "ollama/llama3.1:8b",
      "provider": {
        "ollama": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Ollama (Spark)",
          "options": {
            "baseURL": "http://ollama.ai-stack.svc.cluster.local:11434/v1"
          },
          "models": {
            "qwen3.8:27b": { "name": "Qwen3.8 27B" },
            "llama3.1:8b": { "name": "Llama 3.1 8B" },
            "llama3.2:3b": { "name": "Llama 3.2 3B" },
            "hf.co/mradermacher/Qwen3-4B-OBLITERATED-GGUF:Q8_0": { "name": "Qwen3 4B Obliterated" }
          }
        }
      }
    }
