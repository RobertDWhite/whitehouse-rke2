apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  # Loaded via OPENCODE_CONFIG — sits above the PVC's global config, so
  # providers added later with /connect (stored in auth.json) still merge in.
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "autoupdate": false,
      "share": "disabled",
      "model": "qwen-flash/qwen3.8-flash-next",
      "small_model": "qwen-flash/qwen3.8-flash-next",
      "provider": {
        "qwen-flash": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3.8 Flash Next (vLLM)",
          "options": {
            "baseURL": "http://qwen-flash.qwen-flash.svc.cluster.local:8000/v1"
          },
          "models": {
            "qwen3.8-flash-next": { "name": "Qwen3.8 Flash Next" }
          }
        },
        "ollama": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Ollama (Mac mini primary, RTX 5090 fallback)",
          "options": {
            "baseURL": "http://ollama.ai-stack.svc.cluster.local:11434/v1"
          },
          "models": {
            "qwen3.8:27b": { "name": "Qwen3.8 27B" },
            "qwen3:0.6b": { "name": "Qwen3 0.6B" }
          }
        }
      },
      "mcp": {
        "meerkat": {
          "type": "remote",
          "url": "https://meerkat-mcp.internal.white.fm/mcp",
          "headers": {
            "Authorization": "Bearer {env:MEERKAT_MCP_TOKEN}"
          },
          "enabled": true
        },
        "clean-audio": {
          "type": "remote",
          "url": "https://clean-audio-mcp.internal.white.fm/mcp",
          "headers": {
            "Authorization": "Bearer {env:CLEAN_AUDIO_MCP_TOKEN}"
          },
          "enabled": true
        }
      }
    }
