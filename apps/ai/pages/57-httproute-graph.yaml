# The graph site is a static viewer whose data, /graph.json, is built and served
# by brain-sync (namespace brain) rather than deployed with the site, so it stays
# current and never lands in the pages-sites git mirror. Same origin, so no CORS.
# An exact hostname wins over the *.pages wildcard route, so this route has to
# serve the rest of the site too. Cross-namespace backend: ReferenceGrant in
# apps/ai/brain/62-referencegrant-pages.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pages-graph
  namespace: pages
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-pages-internal
  hostnames:
    - graph.pages.internal.white.fm
  rules:
    - matches:
        - path: {type: Exact, value: /graph.json}
      backendRefs:
        - name: brain-sync
          namespace: brain
          port: 8080
    - backendRefs:
        - name: pages
          port: 8080
