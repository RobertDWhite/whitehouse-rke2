# Qwen3.6-35B-A3B-NVFP4 on GB10, using the measured NVIDIA Spark recipe.
# See benchmarks/2026-10-30/RESULTS.md. Keep the 2200 MHz host clock cap.
# The existing local vLLM image supports both models; preserve the larger
# checkpoint for rollback. CUDA shares host memory, so retain the host watchdog.
# A 0.4 GPU budget and 64 GiB startup gate leave room for cluster services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-flash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen-flash
  template:
    metadata:
      labels:
        app: qwen-flash
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: rke2-node-10
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: llm
          effect: PreferNoSchedule
      terminationGracePeriodSeconds: 60
      shareProcessNamespace: true
      initContainers:
        - name: mem-check
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
          args:
            - |
              while :; do
                avail=$(awk '/^MemAvailable:/{print int($2/1048576)}' /proc/meminfo)
                [ "$avail" -ge "$MIN_GIB" ] && { echo "MemAvailable ${avail} GiB >= ${MIN_GIB} GiB"; exit 0; }
                echo "MemAvailable ${avail} GiB < ${MIN_GIB} GiB; waiting"; sleep 30
              done
          env:
            - name: MIN_GIB
              value: '64'
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
        - name: fetch-weights
          image: registry.internal.white.fm/qwen38-flash-dgx:v0.31-1139abf
          imagePullPolicy: Never
          command:
            - hf
            - download
            - nvidia/Qwen3.6-35B-A3B-NVFP4
            - --revision
            - 1355db6a052410cfd62085d94b58866fd0f2c3c5
            - --max-workers
            - '4'
          env:
            - name: HF_HOME
              value: /hf/benchmark
            - name: HF_HUB_DISABLE_XET
              value: '0'
            - name: HF_XET_HIGH_PERFORMANCE
              value: '1'
          resources:
            requests:
              cpu: '2'
              memory: 2Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: models
              mountPath: /hf
      containers:
        - name: vllm
          image: registry.internal.white.fm/qwen38-flash-dgx:v0.31-1139abf
          imagePullPolicy: Never
          args:
            - /hf/benchmark/hub/models--nvidia--Qwen3.6-35B-A3B-NVFP4/snapshots/1355db6a052410cfd62085d94b58866fd0f2c3c5
            - --served-model-name
            - qwen3.6-35b-a3b
            - --host
            - 0.0.0.0
            - --port
            - '8000'
            - --kv-cache-dtype
            - fp8
            - --attention-backend
            - flashinfer
            - --moe-backend
            - marlin
            - --gpu-memory-utilization
            - '0.4'
            - --max-model-len
            - '131072'
            - --max-num-seqs
            - '4'
            - --max-num-batched-tokens
            - '8192'
            - --enable-chunked-prefill
            - --async-scheduling
            - --enable-prefix-caching
            - --reasoning-parser
            - qwen3
            - --tool-call-parser
            - qwen3_xml
            - --enable-auto-tool-choice
            - --speculative-config
            - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
          env:
            - name: HF_HOME
              value: /hf/benchmark
            - name: HF_HUB_OFFLINE
              value: '1'
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: '4'
              memory: 48Gi
              nvidia.com/gpu: 1
            limits:
              memory: 64Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /hf
            - name: models
              mountPath: /root/.cache/vllm
              subPath: benchmark/compile-cache/vllm
            - name: models
              mountPath: /root/.cache/flashinfer
              subPath: benchmark/compile-cache/flashinfer
            - name: models
              mountPath: /root/.triton
              subPath: benchmark/compile-cache/.triton
            - name: dshm
              mountPath: /dev/shm
        - name: mem-watchdog
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
          args:
            - |
              echo "watching MemAvailable, kill below ${MIN_GIB} GiB"
              while :; do
                avail=$(awk '/^MemAvailable:/{print int($2/1048576)}' /proc/meminfo)
                if [ "$avail" -lt "$MIN_GIB" ]; then
                  echo "$(date) MemAvailable ${avail} GiB < ${MIN_GIB} GiB: killing vLLM"
                  me=$(readlink /proc/self/ns/mnt)
                  for d in /proc/[0-9]*; do
                    pid=${d#/proc/}
                    [ "$pid" = 1 ] && continue
                    ns=$(readlink "$d/ns/mnt" 2>/dev/null)
                    [ "$ns" != "$me" ] && kill -9 "$pid" 2>/dev/null
                  done
                  sleep 10
                fi
                sleep 1
              done
          env:
            - name: MIN_GIB
              value: '8'
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen-flash-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
