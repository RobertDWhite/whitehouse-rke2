# Permanent storage on the Synology. Same export Gramps uses; Riffado only sees
# its own subPaths (Riffado/audio, Riffado/storage, Riffado/db-backups).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-riffado-nas
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.100.1.20
    path: /volume1/Personal
  claimRef:
    name: riffado-nas
    namespace: riffado
