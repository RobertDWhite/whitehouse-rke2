apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: riffado-internal
  namespace: riffado
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - riffado.internal.white.fm
  rules:
    - backendRefs:
        - name: riffado
          port: 3000
      # Envoy Gateway applies a 15s default when omitted; manual sync and
      # transcription requests from the UI run longer than that.
      timeouts:
        request: "0s"
