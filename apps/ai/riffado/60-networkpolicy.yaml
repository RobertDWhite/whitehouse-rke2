apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: riffado
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-envoy-gateway
  namespace: riffado
spec:
  podSelector:
    matchLabels:
      app: riffado
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-postgres
  namespace: riffado
spec:
  podSelector:
    matchLabels:
      app: riffado-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: riffado
        - podSelector:
            matchLabels:
              app: riffado-postgres-backup
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-speaches
  namespace: riffado
spec:
  podSelector:
    matchLabels:
      app: speaches
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: riffado
        # clean-audio-mcp transcribes movie dialogue for its clean tracks.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clean-audio-mcp
          podSelector:
            matchLabels:
              app: clean-audio-mcp
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-nemotron-transcribe
  namespace: riffado
spec:
  podSelector:
    matchLabels:
      app: nemotron-transcribe
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: riffado
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sdr-research
          podSelector:
            matchLabels:
              app: voice-decoder
      ports:
        - port: 8765
          protocol: TCP
---
# brain-sync reads recordings over the v1 API (read-only API key) and
# mirrors them into the Forgejo brain repo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-brain-sync
  namespace: riffado
spec:
  podSelector:
    matchLabels:
      app: riffado
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: brain
          podSelector:
            matchLabels:
              app: brain-sync
      ports:
        - port: 3000
          protocol: TCP
