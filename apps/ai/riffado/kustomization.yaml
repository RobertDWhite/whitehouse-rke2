apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 12-postgres-statefulset.yaml
  - 15-postgres-backup-cronjob.yaml
  - 20-deployment.yaml
  - 30-service.yaml
  - 40-pv-nas.yaml
  - 41-pvc-nas.yaml
  - 42-pvc-speaches-models.yaml
  - 43-pvc-nemotron.yaml
  - 50-speaches-deployment.yaml
  - 51-speaches-service.yaml
  - 54-nemotron-deployment.yaml
  - 55-nemotron-service.yaml
  - 53-httproute-internal.yaml
  - 60-networkpolicy.yaml

configMapGenerator:
  # Adapter + venv setup for nemotron-transcribe; the hash suffix rolls the pod
  # when either changes.
  - name: nemotron-transcribe
    namespace: riffado
    files:
      - nemotron/adapter.py
      - nemotron/setup.sh

generators:
  - ksops.yaml

images:
  # Riffado publishes multi-arch tags; the index digest keeps Kyverno's
  # require-image-digest happy. Renovate bumps the tag; refresh the digest with it.
  # TEMPORARY: upstream main + PR riffado/riffado#328 (Plaud 4.0 accounts), built
  # in-cluster from 1402ad3 and pushed to the internal registry, amd64 only.
  # 0.6.4 reads Plaud's "Account migrated to 4.0" reply as an empty file list,
  # so nothing imported after 2026-10-27. Revert to ghcr.io/riffado/riffado
  # once a release includes #328 (main's migrations 0036-0038 run on start).
  - name: ghcr.io/riffado/riffado
    newName: registry.internal.white.fm/riffado
    newTag: "0.6.4-plaud4-1402ad3@sha256:b7fce77c56c9839e6dac3dc7a27a30cd78977a9d1989141f7241fc9f1512c44e"
  - name: ghcr.io/speaches-ai/speaches
    newTag: "0.8.3-cuda@sha256:9abc6968a883e77ead9286c38a6ccf3139dcad518b783deeebb7be2ced50e972"
  - name: postgres
    newTag: "16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663"
  # trixie (not bookworm): buildpack-deps bookworm carried ~170 critical CVEs.
  - name: ghcr.io/astral-sh/uv
    newTag: "python3.13-trixie@sha256:8d8ba6bf376cc972df1422f302dbe22c24865add109c43c47a994e5f485a4545"
  - name: busybox
    newTag: "1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4"
