apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 12-postgres-statefulset.yaml
  - 15-postgres-backup-cronjob.yaml
  - 20-deployment.yaml
  - 30-service.yaml
  - 40-pv-nas.yaml
  - 41-pvc-nas.yaml
  - 42-pvc-speaches-models.yaml
  - 50-speaches-deployment.yaml
  - 51-speaches-service.yaml
  - 53-httproute-internal.yaml
  - 60-networkpolicy.yaml

generators:
  - ksops.yaml

images:
  # Riffado publishes multi-arch tags; the index digest keeps Kyverno's
  # require-image-digest happy. Renovate bumps the tag; refresh the digest with it.
  - name: ghcr.io/riffado/riffado
    newTag: "0.6.4"
    digest: sha256:c8d6b1727b154ef3df412e7be58d86b6bd53ba20102e6dde1530637eba767d49
  - name: ghcr.io/speaches-ai/speaches
    newTag: 0.8.3-cuda
    digest: sha256:9abc6968a883e77ead9286c38a6ccf3139dcad518b783deeebb7be2ced50e972
  - name: postgres
    newTag: 16-alpine
    digest: sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
  - name: busybox
    newTag: "1.37"
    digest: sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
