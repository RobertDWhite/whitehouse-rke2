load_module modules/ngx_http_js_module.so;

pid /tmp/nginx.pid;
events {}
http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  log_format main '$remote_addr [$time_local] "$request" $status $request_time';
  access_log /dev/stdout main;

  js_import thinking from /etc/nginx/summary-llm/thinking.js;
  js_set $chat_body thinking.body;

  server {
    listen 8000;

    # Whole body in one memory buffer so thinking.js can rewrite it; a long
    # transcript runs to a few hundred KB.
    client_body_buffer_size      16m;
    client_body_in_single_buffer on;
    client_max_body_size         16m;

    location = /healthz {
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://qwen-flash.qwen-flash.svc.cluster.local:8000;
      proxy_set_body $chat_body;
      proxy_set_header Host qwen-flash.qwen-flash.svc.cluster.local;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      # A 100K-token transcript prefill plus 2000 output tokens is minutes,
      # not hours; Riffado itself waits up to six.
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
  }
}
