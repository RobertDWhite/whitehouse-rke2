apiVersion: apps/v1
kind: Deployment
metadata:
  name: x-mcp
  namespace: x-mcp
  annotations:
    renovatebot/update-container-image: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: x-mcp
  template:
    metadata:
      labels:
        app: x-mcp
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: x-mcp
          image: registry.internal.white.fm/x-mcp
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Drafts are in-memory and expire, so a stale confirm token can
            # never outlive the process that showed the preview.
            - name: X_DRAFT_TTL
              value: "600"
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: x-mcp-env
                  key: MCP_TOKEN
            # OAuth 1.0a user context - required to post AS the account.
            # These start empty; the server returns a clear "not configured"
            # error until they are filled in.
            - name: X_API_KEY
              valueFrom:
                secretKeyRef:
                  name: x-mcp-env
                  key: X_API_KEY
            - name: X_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: x-mcp-env
                  key: X_API_SECRET
            - name: X_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: x-mcp-env
                  key: X_ACCESS_TOKEN
            - name: X_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: x-mcp-env
                  key: X_ACCESS_TOKEN_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
