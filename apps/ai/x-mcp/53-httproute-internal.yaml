# MCP endpoint, bearer-token gated (MCP_TOKEN). Internal (tailnet) only; the
# server serves /mcp + /healthz and 404s everything else. Uses the shared
# wildcard internal listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: x-mcp-internal
  namespace: x-mcp
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - x-mcp.internal.white.fm
  rules:
    - backendRefs:
        - name: x-mcp
          port: 8080
