apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sola-coffee
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: sola-postgres
  template:
    metadata:
      labels:
        app: sola-postgres
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: postgres
        image: postgres
        env:
        - name: POSTGRES_USER
          value: sola
        - name: POSTGRES_DB
          value: sola
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sola-env
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - sola
            - -d
            - sola
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - sola
            - -d
            - sola
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: longhorn-retain
      resources:
        requests:
          storage: 10Gi
