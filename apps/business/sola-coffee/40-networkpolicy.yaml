apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sola-ingress
  namespace: sola-coffee
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflared
    ports:
    - port: 3001
      protocol: TCP
