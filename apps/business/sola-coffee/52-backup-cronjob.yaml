apiVersion: batch/v1
kind: CronJob
metadata:
  name: sola-postgres-backup
  namespace: sola-coffee
spec:
  schedule: 25 6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: sola-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
          - name: backup
            image: postgres
            command:
            - sh
            - -ec
            args:
            - 'umask 077

              mkdir -p /backups

              stamp=$(date -u +%Y%m%dT%H%M%SZ)

              pg_dump -Fc --no-owner --no-privileges --file="/backups/sola-${stamp}.dump"

              pg_restore --list "/backups/sola-${stamp}.dump" > /dev/null

              find /backups -type f -name "sola-*.dump" -mtime +14 -delete

              echo "Backup archive created and validated."'
            env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: sola
            - name: PGDATABASE
              value: sola
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sola-env
                  key: POSTGRES_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: backups
              mountPath: /backups
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: sola-db-backups
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - rke2-node-11
                    - rke2-node-50
