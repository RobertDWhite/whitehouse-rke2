apiVersion: v1
kind: ConfigMap
metadata:
  name: appstore-config
  namespace: appstore-reviews
data:
  config.yaml: |
    ai:
      # vLLM Qwen3.8 Flash Next is the shared fast OpenAI-compatible endpoint.
      base_url: "http://qwen-flash.qwen-flash.svc.cluster.local:8000/v1"
      model: "qwen3.8-flash-next"
      temperature: 0.4
      request_timeout: 120.0
