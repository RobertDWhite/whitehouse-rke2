apiVersion: v1
kind: ConfigMap
metadata:
  name: appstore-config
  namespace: appstore-reviews
data:
  config.yaml: |
    ai:
      # ollama-router routes to the responsive Mac mini Ollama, with the 5090 as backup.
      base_url: "http://ollama-router.ai-stack.svc.cluster.local:11434/v1"
      model: "qwen3.8:27b"
      temperature: 0.4
      request_timeout: 120.0
