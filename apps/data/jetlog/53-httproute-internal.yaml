apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jetlog-internal
  namespace: jetlog
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - jetlog.internal.white.fm
  rules:
    # Nothing in front of jetlog sets X-Authentik-Username, so never let a client supply it.
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Authentik-Username
      backendRefs:
        - name: jetlog
          port: 3000
