# Self-hosted LiveSync settings, mounted as local.d/obsidian.ini. The image's
# entrypoint still writes local.d/docker.ini (admin + chttpd_auth secret from
# the couchdb-admin Secret), so only this one file is mounted, not the dir.
apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-config
  namespace: obsidian
data:
  obsidian.ini: |
    [couchdb]
    single_node = true
    max_document_size = 50000000
    ; Fixed server uuid so it survives container restarts (docker.ini is ephemeral)
    uuid = d43f0b3a54da8039e34caf2bb364633b

    [chttpd]
    require_valid_user = true
    max_http_request_size = 4294967296
    enable_cors = true

    [chttpd_auth]
    require_valid_user = true
    authentication_redirect = /_utils/session.html

    [httpd]
    WWW-Authenticate = Basic realm="couchdb"
    enable_cors = true

    [cors]
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    credentials = true
    headers = accept, authorization, content-type, origin, referer
    methods = GET, PUT, POST, HEAD, DELETE
    max_age = 3600
