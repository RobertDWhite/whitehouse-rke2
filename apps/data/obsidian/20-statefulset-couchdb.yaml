apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: couchdb
  namespace: obsidian
  labels:
    app: couchdb
spec:
  serviceName: couchdb
  replicas: 1
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
      annotations:
        # Roll the pod when the ini changes (subPath mounts don't hot-update).
        obsidian.white.fm/config-rev: "2"
    spec:
      # Pinned to node-11 while node-14 is wiped (2026-10-19).
      nodeSelector:
        kubernetes.io/hostname: rke2-node-11
      securityContext:
        runAsNonRoot: true
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: couchdb
          image: couchdb
          ports:
            - name: http
              containerPort: 5984
          envFrom:
            - secretRef:
                name: couchdb-admin
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: config
              mountPath: /opt/couchdb/etc/local.d/obsidian.ini
              subPath: obsidian.ini
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: couchdb-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
