apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: obsidian
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-couchdb
  namespace: obsidian
spec:
  podSelector:
    matchLabels:
      app: couchdb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        # init/backup jobs in this namespace
        - podSelector: {}
      ports:
        - port: 5984
          protocol: TCP
