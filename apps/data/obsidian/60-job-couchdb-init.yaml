# Idempotent single-node setup: system DBs plus the LiveSync database, and a
# non-admin user for the MCP server that is the database's only member.
# PUT returns 201/202 when created and 412 when it already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: couchdb-init
  namespace: obsidian
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 5984
        runAsGroup: 5984
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: registry.gitlab.com/gitlab-ci-utils/curl-jq
          envFrom:
            - secretRef:
                name: couchdb-admin
          env:
            - name: MCP_USER
              valueFrom:
                secretKeyRef:
                  name: obsidian-mcp
                  key: COUCHDB_USER
            - name: MCP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obsidian-mcp
                  key: COUCHDB_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              URL=http://couchdb.obsidian.svc:5984
              for i in $(seq 1 60); do
                curl -sf "$URL/_up" >/dev/null && break
                echo "waiting for couchdb ($i)"; sleep 5
              done
              for db in _users _replicator obsidian; do
                code=$(curl -s -o /dev/null -w '%{http_code}' -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT "$URL/$db")
                case "$code" in
                  201|202) echo "$db: created" ;;
                  412)     echo "$db: already exists" ;;
                  *)       echo "$db: unexpected HTTP $code"; exit 1 ;;
                esac
              done
              # MCP user: create it, or reset its password to the Secret's value.
              AUTH="$COUCHDB_USER:$COUCHDB_PASSWORD"
              uid="org.couchdb.user:$MCP_USER"
              rev=$(curl -s -u "$AUTH" "$URL/_users/$uid" | jq -r '._rev // empty')
              jq -n --arg n "$MCP_USER" --arg p "$MCP_PASSWORD" --arg r "$rev" \
                '{_id: ("org.couchdb.user:" + $n), name: $n, password: $p, roles: [], type: "user"}
                 + (if $r == "" then {} else {_rev: $r} end)' |
                curl -sf -u "$AUTH" -X PUT -H 'Content-Type: application/json' --data-binary @- "$URL/_users/$uid" >/dev/null
              echo "user $MCP_USER: ok"
              # The MCP user is the only member; server admins (LiveSync devices) always have access.
              jq -n --arg n "$MCP_USER" '{admins: {names: [], roles: []}, members: {names: [$n], roles: []}}' |
                curl -sf -u "$AUTH" -X PUT -H 'Content-Type: application/json' --data-binary @- "$URL/obsidian/_security" >/dev/null
              echo "obsidian/_security: ok"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
