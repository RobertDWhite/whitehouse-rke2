apiVersion: batch/v1
kind: CronJob
metadata:
  name: politics-matrix-daily-digest
  namespace: politics
spec:
  schedule: "0 8 * * *"
  timeZone: "America/New_York"
  startingDeadlineSeconds: 1800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: politics-matrix-digest
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: registry.internal.white.fm/politics-api:2.0.0
              imagePullPolicy: IfNotPresent
              command: ["python", "-c"]
              args:
                - |
                  import json
                  import os
                  import urllib.parse
                  import urllib.request

                  API = "http://politics-api.politics.svc.cluster.local:8000"
                  MATRIX = "http://synapse.matrix.svc.cluster.local:8008"

                  def request(method, url, body=None, token=None):
                      headers = {"Content-Type": "application/json"}
                      if token:
                          headers["Authorization"] = f"Bearer {token}"
                      data = None if body is None else json.dumps(body).encode()
                      req = urllib.request.Request(url, method=method, headers=headers, data=data)
                      with urllib.request.urlopen(req, timeout=600) as response:
                          return json.loads(response.read() or b"{}")

                  digest = request("POST", f"{API}/accounts/digest/refresh")
                  text = str(digest.get("text") or "")
                  if not text:
                      text = str(request("GET", f"{API}/accounts/digest").get("text") or "")
                  if not text:
                      raise RuntimeError("Politics API returned an empty AI digest")

                  login = request("POST", f"{MATRIX}/_matrix/client/v3/login", {
                      "type": "m.login.password",
                      "identifier": {"type": "m.id.user", "user": os.environ["MATRIX_USER"]},
                      "password": os.environ["MATRIX_PASSWORD"],
                  })
                  room = urllib.parse.quote(os.environ["MATRIX_ROOM_ID"], safe="")
                  txn = urllib.parse.quote(f"politics-digest-{digest.get('updated_at', 'daily')}", safe="")
                  request(
                      "PUT",
                      f"{MATRIX}/_matrix/client/v3/rooms/{room}/send/m.room.message/{txn}",
                      {"msgtype": "m.text", "body": "Politics daily AI summary\n\n" + text},
                      login["access_token"],
                  )
              env:
                - name: MATRIX_USER
                  valueFrom:
                    secretKeyRef:
                      name: politics-secret
                      key: matrix-user
                - name: MATRIX_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: politics-secret
                      key: matrix-password
                - name: MATRIX_ROOM_ID
                  valueFrom:
                    secretKeyRef:
                      name: politics-secret
                      key: matrix-room-id
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
