apiVersion: batch/v1
kind: CronJob
metadata:
  name: politics-matrix-daily-digest
  namespace: politics
spec:
  schedule: "0 8 * * *"
  timeZone: "America/New_York"
  startingDeadlineSeconds: 1800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: politics-matrix-digest
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: ghcr.io/robertdwhite/politics-api:sha-2b4cd29
              imagePullPolicy: IfNotPresent
              command: ["python", "-c"]
              args:
                - |
                  import json
                  import os
                  import urllib.request

                  API = "http://politics-api.politics.svc.cluster.local:8000"
                  HOOKSHOT = "http://matrix-hookshot.matrix.svc.cluster.local:9000/webhook/" + os.environ["MATRIX_WEBHOOK_UUID"]

                  def request(method, url, body=None):
                      headers = {"Content-Type": "application/json"}
                      data = None if body is None else json.dumps(body).encode()
                      req = urllib.request.Request(url, method=method, headers=headers, data=data)
                      with urllib.request.urlopen(req, timeout=600) as response:
                          return json.loads(response.read() or b"{}")

                  digest = request("POST", f"{API}/accounts/digest/refresh")
                  text = str(digest.get("text") or "")
                  if not text:
                      text = str(request("GET", f"{API}/accounts/digest").get("text") or "")
                  if not text:
                      raise RuntimeError("Politics API returned an empty AI digest")

                  request(
                      "POST",
                      HOOKSHOT,
                      {"text": "Politics daily AI summary\n\n" + text},
                  )
              env:
                - name: MATRIX_WEBHOOK_UUID
                  valueFrom:
                    secretKeyRef:
                      name: politics-secret
                      key: matrix-webhook-uuid
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
