apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weather-public
  namespace: weather
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-white-fm
  hostnames:
    - weather.white.fm
    - meteorology.white.fm
  rules:
    # AI context gathering and inference can exceed the gateway's 15s default.
    - matches:
        - path:
            type: PathPrefix
            value: /api/briefing
      timeouts:
        request: 120s
        backendRequest: 120s
      backendRefs:
        - name: weather-ui
          port: 80
    - backendRefs:
        - name: weather-ui
          port: 80
