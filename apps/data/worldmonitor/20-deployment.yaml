apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worldmonitor
  template:
    metadata:
      labels:
        app: worldmonitor
    spec:
      containers:
        - name: worldmonitor
          image: registry.internal.white.fm/worldmonitor
          env:
            - name: OLLAMA_API_URL
              value: "http://ollama-router.ai-stack.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: "llama3.1:8b"
            # The ollama provider is restricted to a localhost-only host
            # allowlist unless the app considers itself a local deployment.
            # "desktop-sidecar" is the value the app already defaults to, so
            # this only lifts the allowlist and changes nothing else.
            - name: LOCAL_API_MODE
              value: "desktop-sidecar"
            # Reasoning stream tries openrouter first unless told otherwise.
            - name: LLM_REASONING_PROVIDER
              value: "ollama"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
