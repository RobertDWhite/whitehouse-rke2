# Postgres for condo. Hosts two databases: `condo` and `address_service`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: condo
data:
  10-address-service-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE DATABASE address_service OWNER $POSTGRES_USER;
    EOSQL

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: condo
spec:
  ports:
    - port: 5432
  selector:
    app: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: condo
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: "postgres"
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rke2-node-13, rke2-node-14, rke2-node-50]
      containers:
        - name: postgres
          image: postgres
          args:
            - -c
            - shared_buffers=256MB
            - -c
            - max_connections=200
          env:
            - name: POSTGRES_DB
              value: "condo"
            - name: POSTGRES_USER
              value: "condo"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "condo"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "condo"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Real tenant data, not a reconstructable cache — keep it on Longhorn.
        # longhorn-single avoids the replication scheduling pressure that the
        # default longhorn class currently can't satisfy.
        storageClassName: longhorn-single
        resources:
          requests:
            storage: 20Gi
