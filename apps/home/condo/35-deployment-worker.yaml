# Condo background worker — bull queues for exports, notifications and imports.
# Migrations are owned by the web pod's initContainer, so the worker just starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: condo-worker
  namespace: condo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: condo-worker
  template:
    metadata:
      labels:
        app: condo-worker
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rke2-node-13, rke2-node-14, rke2-node-50]
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: worker
          image: ghcr.io/robertdwhite/condo
          imagePullPolicy: IfNotPresent
          command: ["yarn", "workspace", "@app/condo", "worker"]
          envFrom:
            - configMapRef:
                name: condo-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: condo-database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: condo-cookie-secret
          # The worker runs with DISABLE_NEXT_APP=true, so the health server is
          # the only thing listening here.
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /server-health?checks=postgres,redis
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: condo-media
