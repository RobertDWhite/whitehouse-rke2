# address-service backs condo's address suggestion / property creation flows.
# Same image, its own Keystone app and its own database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: address-service
  namespace: condo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: address-service
  template:
    metadata:
      labels:
        app: address-service
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rke2-node-13, rke2-node-14, rke2-node-50]
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: migrate
          image: ghcr.io/robertdwhite/condo
          imagePullPolicy: IfNotPresent
          command: ["yarn", "workspace", "@app/address-service", "migrate"]
          envFrom:
            - configMapRef:
                name: condo-config
          env:
            - name: SERVER_URL
              value: "http://address-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: address-database-url
            - name: REDIS_URL
              value: "redis://redis:6379/1"
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: address-cookie-secret
            - name: DATA_ENCRYPTION_CONFIG
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: address-data-encryption-config
            - name: DATA_ENCRYPTION_VERSION_ID
              value: "address-service_1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: address-service
          image: ghcr.io/robertdwhite/condo
          imagePullPolicy: IfNotPresent
          command: ["yarn", "workspace", "@app/address-service", "start"]
          envFrom:
            - configMapRef:
                name: condo-config
          env:
            # Overrides the shared condo.white.fm origin — this app is cluster-internal.
            - name: SERVER_URL
              value: "http://address-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: address-database-url
            - name: REDIS_URL
              value: "redis://redis:6379/1"
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: address-cookie-secret
            - name: DATA_ENCRYPTION_CONFIG
              valueFrom:
                secretKeyRef:
                  name: condo-secrets
                  key: address-data-encryption-config
            - name: DATA_ENCRYPTION_VERSION_ID
              value: "address-service_1"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /server-health?checks=postgres,redis
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
