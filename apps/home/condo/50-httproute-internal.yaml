apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: condo-internal
  namespace: condo
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-condo-internal
  hostnames:
    - condo.internal.white.fm
  rules:
    - backendRefs:
        - name: condo
          port: 80
