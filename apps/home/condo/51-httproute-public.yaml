# Public route goes straight to condo — no Authentik outpost in front. Condo owns
# its own multi-tenant auth, and fronting it with SSO would break resident logins
# and every mobile/GraphQL API client.
#
# external-dns picks this hostname up off the HTTPRoute and creates the Cloudflare
# CNAME to the tunnel automatically; cloudflared's own ingress list still needs the
# matching entry (platform/networking/cloudflared/cloudflared-config.sops.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: condo-public
  namespace: condo
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-condo-public
  hostnames:
    - condo.white.fm
  rules:
    - backendRefs:
        - name: condo
          port: 80
