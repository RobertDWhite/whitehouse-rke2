# CompreFace keep-warm heartbeat.
#
# History: the doorbell pipeline once saw ~13s "cold" recognitions after idle,
# which was blamed on CompreFace unloading its model. A controlled test on
# 2026-09-15 (warmer paused, requests after 2/30/45/60/90s idle) showed NO
# idle penalty at all: every call took ~1.5s. The 13s was almost certainly
# the 2 GB Home Assistant VM being too slow to serve the snapshot to Double
# Take (VM has since been upsized). Warming every 20s cost ~0.3 CPU core for
# nothing, so this now runs every 120s as a cheap hedge against any longer
# idle effect and as a health heartbeat (warm=200 in the logs).
#
# It hits CompreFace DIRECTLY (not Double Take) so it never writes to DT's match
# history. The recognition API key is read at runtime from the same sops secret
# Double Take uses (/secrets/secrets.yml -> compreface_key); the warm face is a
# 360px copy of the hosted test portrait.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compreface-warmer
  namespace: face-recognition
  labels:
    app: compreface-warmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compreface-warmer
  template:
    metadata:
      labels:
        app: compreface-warmer
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: kube-vip
          operator: Equal
          value: disabled
          effect: NoSchedule
      containers:
        - name: warmer
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              KEY=$(grep -m1 "^compreface_key:" /secrets/secrets.yml | sed 's/.*compreface_key:[[:space:]]*//' | tr -d '"\r' | tr -d '[:space:]')
              if [ -n "$KEY" ]; then echo "warmer up: compreface_key parsed (len ${#KEY})"; else echo "warmer up: FAILED to parse compreface_key from /secrets/secrets.yml"; fi
              CF=http://compreface.face-recognition.svc.cluster.local
              IMG=https://doorbell-greetings.pages.internal.white.fm/test/portrait-small.jpg  # 360px: same face, ~1/10 the detector work of the 1600px original
              while true; do
                [ -s /tmp/warm.jpg ] || curl -sf --max-time 15 "$IMG" -o /tmp/warm.jpg 2>/dev/null || echo "$(date +%H:%M:%S) warm image fetch failed"
                if [ -s /tmp/warm.jpg ]; then
                  code=$(curl -s --max-time 25 -o /dev/null -w '%{http_code}' -F "file=@/tmp/warm.jpg" -H "x-api-key: $KEY" "$CF/api/v1/recognition/recognize?limit=1&det_prob_threshold=0.8")
                  echo "$(date +%H:%M:%S) warm=$code"
                fi
                sleep 120
              done
          volumeMounts:
            - name: secrets
              mountPath: /secrets/secrets.yml
              subPath: secrets.yml
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: secrets
          secret:
            secretName: double-take-secrets
