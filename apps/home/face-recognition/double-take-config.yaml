apiVersion: v1
kind: ConfigMap
metadata:
  name: double-take-config
  namespace: face-recognition
data:
  config.yml: |
    # Double Take — https://github.com/jakowenko/double-take#configuration
    # "!secret compreface_key" is expanded from secrets.yml (sops secret double-take-secrets).
    time:
      timezone: America/New_York

    detectors:
      compreface:
        url: http://compreface.face-recognition.svc.cluster.local
        key: "!secret compreface_key"
        det_prob_threshold: 0.55  # was 0.8: off-angle doorbell faces were dropped before recognition ran (Glenn, 2026-09-14)
        timeout: 15

    detect:
      match:
        save: true
        base64: false
        confidence: 60   # doorbell faces are ~100px; correct matches score ~0.6-0.7
        purge: 168
        min_area: 3000
      unknown:
        save: true
        base64: false
        confidence: 40
        purge: 24
        min_area: 3000

    ui:
      pagination:
        limit: 50
      thumbnails:
        quality: 90
        width: 500
