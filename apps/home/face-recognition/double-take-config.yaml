apiVersion: v1
kind: ConfigMap
metadata:
  name: double-take-config
  namespace: face-recognition
data:
  config.yml: |
    # Double Take — https://github.com/jakowenko/double-take#configuration
    # "!secret compreface_key" is expanded from secrets.yml (sops secret double-take-secrets);
    # face-api uses the same key.
    time:
      timezone: America/New_York

    detectors:
      # face-api (our CompreFace-compatible service, face-api/); Double Take's
      # "compreface" detector speaks its API unchanged.
      compreface:
        url: http://face-api.face-recognition.svc.cluster.local
        key: "!secret compreface_key"
        # SCRFD scores faces lower than CompreFace's RetinaFace did: on the
        # doorbell history 0.55 here drops the same faces CompreFace's 0.7 did.
        det_prob_threshold: 0.55
        timeout: 15

    detect:
      match:
        save: true
        base64: false
        confidence: 60   # doorbell faces are ~100px; correct matches score ~0.6-0.7
        purge: 168
        min_area: 3000
      unknown:
        save: true
        base64: false
        confidence: 40
        purge: 24
        min_area: 3000

    ui:
      pagination:
        limit: 50
      thumbnails:
        quality: 90
        width: 500
