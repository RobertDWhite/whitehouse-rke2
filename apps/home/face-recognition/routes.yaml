apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: double-take-internal
  namespace: face-recognition
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - double-take.internal.white.fm
  rules:
    - backendRefs:
        - name: double-take
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: compreface-internal
  namespace: face-recognition
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - compreface.internal.white.fm
  rules:
    - backendRefs:
        - name: compreface
          port: 80
