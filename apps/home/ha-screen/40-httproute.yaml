apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha-screen-internal
  namespace: ha-screen
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - screen.internal.white.fm
  rules:
    - backendRefs:
        - name: ha-screen
          port: 80
