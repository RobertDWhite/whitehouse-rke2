server {
  listen 8080;
  root /usr/share/nginx/html;

  location = / {
    try_files /index.html =404;
  }
  location ^~ /cameras/ {
    proxy_pass http://ha-screen-cameras.ha-screen.svc.cluster.local/;
    proxy_buffering off;
  }
  location ^~ /summary/ {
    proxy_pass http://ha-screen-summary.ha-screen.svc.cluster.local/;
    proxy_buffering off;
  }
  location ^~ /weather/ {
    proxy_pass http://ha-screen-weather.ha-screen.svc.cluster.local/;
    proxy_buffering off;
  }
  location ^~ /severe/ {
    proxy_pass http://ha-screen-severe.ha-screen.svc.cluster.local/;
    proxy_buffering off;
  }
  location = /severe-tv.html { add_header Cache-Control "no-cache"; }
  location = /weather-tv.html {
    add_header Cache-Control "no-cache";
  }
  location /weather-api/ {
    limit_except GET { deny all; }
    proxy_pass http://weather-ui.weather.svc.cluster.local/api/;
    proxy_read_timeout 125s;
  }
  # Playlist must never be cached; segments are immutable.
  location ~ \.m3u8$ {
    root /usr/share/nginx/html/hls;
    types { application/vnd.apple.mpegurl m3u8; }
    add_header Cache-Control "no-cache, no-store";
    add_header Access-Control-Allow-Origin "*";
  }
  location ~ \.ts$ {
    root /usr/share/nginx/html/hls;
    types { video/mp2t ts; }
    add_header Cache-Control "max-age=60";
    add_header Access-Control-Allow-Origin "*";
  }
}
