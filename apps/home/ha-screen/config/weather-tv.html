<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Feed</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080e19;color:#f1f5ff;font:24px system-ui,sans-serif;height:100vh;overflow:hidden;padding:24px 34px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #29384f;padding-bottom:12px}h1{font-size:34px;margin:0}h2{font-size:28px;margin:0 0 12px}.muted,small{color:#acbcd2}main{height:calc(100vh - 124px);padding:20px 0;overflow:hidden}.grid{display:grid;gap:14px;height:100%;grid-template-columns:repeat(var(--cols,3),1fr)}article{background:#142034;border:1px solid #293d59;border-radius:14px;padding:18px;overflow:hidden}.big{font-size:70px;font-weight:650}.value{font-size:38px;color:#8ed9ff}.icon{font-size:48px}p{margin:10px 0}.warn{color:#ffc778}.danger{border-color:#ff7b79}.line{display:flex;justify-content:space-between;margin:10px 0;gap:14px}footer{position:absolute;bottom:16px;left:34px;right:34px;display:flex;justify-content:space-between;font-size:17px;color:#acbcd2}img{width:100%;height:100%;object-fit:contain}pre{white-space:pre-wrap;font:25px/1.45 system-ui;margin:0}.error{font-size:34px;padding:70px 20px;color:#ffc778}</style>
<header><h1 id="title">Weather</h1><span id="clock"></span></header><main id="content">Loading current weather data…</main><footer><span>weather.white.fm · Local weather services</span><span id="status"></span></footer>
<script>
'use strict';
const page=new URLSearchParams(location.search).get('page')||'current',root=document.querySelector('#content'),status=document.querySelector('#status');
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>Number.isFinite(v)?v.toFixed(d):'—';
const time=v=>new Date(v).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'});
const day=v=>new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('en-US',{weekday:'short',timeZone:'America/New_York'});
const titles={current:'Local conditions',hourly:'Next 12 hours',daily:'Seven-day forecast',alerts:'Nearby alerts · 75 miles',outlook1:'Severe weather outlook · Today',outlook2:'Severe weather outlook · Tomorrow',outlook3:'Severe weather outlook · Day 3',rivers:'Nearby Ohio river gauges',hwo:'Wilmington · Hazardous weather outlook'};
document.querySelector('#title').textContent=titles[page]||'Weather';
const clock=()=>document.querySelector('#clock').textContent=time(Date.now());clock();setInterval(clock,10000);
async function api(path){const r=await fetch('/weather-api/'+path,{signal:AbortSignal.timeout(25000),cache:'no-store'});if(!r.ok)throw Error('Weather source returned '+r.status);const d=await r.json();if(d.error||d.source_error||d.stale||d.incomplete)throw Error('Source unavailable, incomplete, or stale');return d;}
const grid=(cards,cols=3)=>'<div class="grid" style="--cols:'+cols+'">'+cards.join('')+'</div>';
const card=(title,body)=>'<article><h2>'+esc(title)+'</h2>'+body+'</article>';
let pageTimer;
function paginate(items,render,count,secs=12){clearInterval(pageTimer);let offset=0;const draw=()=>{root.innerHTML=render(items.slice(offset,offset+count));offset=(offset+count)%items.length;};draw();if(items.length>count)pageTimer=setInterval(draw,secs*1000);}
async function refresh(){try{
 if(page==='current'){const d=await api('openmeteo/current');root.innerHTML=grid([card(d.condition,'<div class="big">'+num(d.temperature)+'°F</div><p>Feels like '+num(d.feelsLike)+'°</p><div class="icon">'+esc(d.icon)+'</div>'),card('Wind','<div class="value">'+num(d.windSpeed)+' mph</div><p>Gusts '+num(d.windGusts)+' mph</p><p>Direction '+num(d.windDirection)+'°</p>'),card('Air & sky','<p>Humidity '+num(d.humidity)+'%</p><p>Dew point '+num(d.dewPoint)+'°F</p><p>Cloud cover '+num(d.cloudCover)+'%</p><p>Pressure '+num(d.pressure)+' hPa</p>')]);status.textContent='Observation '+esc(d.time.replace('T',' '));}
 else if(page==='hourly'||page==='daily'){const d=await api('openmeteo/forecast');if(page==='hourly'){const rows=d.hourly.filter(x=>Date.parse(x.time)>=Date.now()-3600000).slice(0,12);if(!rows.length)throw Error('No current forecast periods');paginate(rows,rs=>grid(rs.map(x=>card(time(x.time),'<div class="icon">'+esc(x.icon)+'</div><div class="value">'+num(x.temperature)+'°</div><p>'+esc(x.condition)+'</p><p>Rain '+num(x.precipProbability)+'%</p><p>Wind '+num(x.windSpeed)+' mph</p>')),6),6);}else {const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date());const rows=d.daily.filter(x=>x.date>=today).slice(0,7);if(!rows.length)throw Error('No current forecast days');root.innerHTML=grid(rows.map(x=>card(day(x.date),'<div class="icon">'+esc(x.icon)+'</div><div class="value">'+num(x.tempMax)+'°</div><p>'+num(x.tempMin)+'° low</p><p>Rain '+num(x.precipProbability)+'%</p><p>'+num(x.precipSum,2)+' in</p><small>Gusts '+num(x.windGusts)+' mph</small>')),7);}status.textContent='Forecast refreshed '+time(Date.now());}
 else if(page==='alerts'){const d=await api('nws/alerts?local=true');const rows=d.features.filter(a=>Date.parse(a.properties.expires)>Date.now());if(!rows.length)root.innerHTML=card('No active nearby alerts','<p>National Weather Service · within 75 miles</p><p class="muted">Radar and outlooks follow in this rotation.</p>');else paginate(rows,rs=>grid(rs.map(a=>{const p=a.properties;return card(p.event,'<p class="warn">'+esc(p.headline)+'</p><p>'+esc(p.areaDesc)+'</p><small>Expires '+time(p.expires)+'</small>')}),2),2);status.textContent='NWS update '+time(d.updated);}
 else if(page.startsWith('outlook')){const img=new Image();img.alt=titles[page];img.onload=()=>{root.replaceChildren(img);status.textContent='SPC product · issue and valid times printed on map';};img.onerror=()=>{root.innerHTML='<div class="error">SPC image unavailable</div>';status.textContent='No current image received';};img.src='/weather-api/spc/outlook-image/day'+page.slice(-1)+'?t='+Math.floor(Date.now()/300000);}
 else if(page==='hwo'){const d=await api('text/hwo');let text=d.text;const start=text.indexOf('.DAY ONE');if(start>=0)text=text.slice(start);text=text.replace(/\$\$[\s\S]*/,'').trim();const chunks=text.match(/[\s\S]{1,650}(?:\s|$)/g)||[text];paginate(chunks,rs=>'<pre>'+esc(rs[0])+'</pre>',1,15);status.textContent='NWS '+d.wfo+' · issued '+day(d.issued)+' '+time(d.issued);}
 else throw Error('Unknown weather page');
}catch(e){clearInterval(pageTimer);root.innerHTML='<div class="error">Content temporarily unavailable<p>'+esc(e.message)+'</p></div>';status.textContent='Retrying automatically';}}
refresh();setInterval(refresh,60000);
</script></html>
