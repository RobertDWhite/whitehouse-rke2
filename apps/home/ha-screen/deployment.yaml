# Renders the Home Assistant "screen" dashboard in Chromium and publishes it as a live HLS stream
# (https://screen.internal.white.fm/stream.m3u8) for a Roku, which can play video but cannot open a
# web page. HA starts and stops playback on the TV; this just keeps the stream running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-screen
  namespace: ha-screen
  labels:
    app: ha-screen
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ha-screen
  template:
    metadata:
      labels:
        app: ha-screen
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: stream
          image: registry.internal.white.fm/ha-screen-stream
          env:
            # Direct to HA (not through the reverse proxy) so the frontend websocket never
            # depends on the gateway.
            - name: HA_URL
              value: http://10.100.1.30:8123
            - name: DASHBOARD_PATH
              value: /ha-screen/main
            # Each minute: the normal layout, its mirror image, then the kids' cameras. Moving
            # things around (and the few-pixel shift) keeps static elements from burning in.
            - name: ROTATION
              value: /ha-screen/main:25,/ha-screen/flip:25,/ha-screen/cams:10
            - name: JITTER_PX
              value: "8"
            # The master bath Samsung overscans: keep everything inside a 5% safe area.
            - name: SAFE_PCT
              value: "5"
            - name: PAGE_BG
              value: "#000000"
            - name: CARD_BG
              value: "#141414"
            - name: CLIENT_ID
              value: https://screen.internal.white.fm/
            - name: HLS_DIR
              value: /hls
          envFrom:
            - secretRef:
                name: ha-screen-login
          volumeMounts:
            - name: hls
              mountPath: /hls
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            # The playlist is rewritten every 2 s while ffmpeg runs.
            exec:
              command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /hls/stream.m3u8) )) -lt 60"]
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
        - name: web
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: hls
              mountPath: /usr/share/nginx/html/hls
              readOnly: true
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet:
              path: /stream.m3u8
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: hls
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: nginx
          configMap:
            name: ha-screen-nginx
