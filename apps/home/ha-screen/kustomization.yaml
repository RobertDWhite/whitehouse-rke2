apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ha-screen

resources:
  - 00-namespace.yaml
  - deployment.yaml
  - service.yaml
  - feeds.yaml
  - 40-httproute.yaml

generators:
  - ksops-secret.yaml

configMapGenerator:
  - name: ha-screen-nginx
    files:
      - default.conf=config/default.conf
      - index.html=config/index.html
      - weather-tv.html=config/weather-tv.html
      - severe-tv.html=config/severe-tv.html
      - severe-counties.json=config/severe-counties.json

images:
  - name: registry.internal.white.fm/ha-screen-stream
    newTag: 0.4.1
    digest: sha256:50b21fcae6c7c056539cf4e6f3b63f9b0f7e1f44cf05b437b939cb9e7680adaf
