apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-pvc.yaml
  - 20-deployment-postgres.yaml
  - 25-service-postgres.yaml
  - 30-deployment-redis.yaml
  - 35-service-redis.yaml
  - 40-deployment-web.yaml
  - 45-service-web.yaml
  - 50-deployment-celery.yaml
  - 21-postgres-exporter.yaml
  - 31-redis-exporter.yaml
  - 70-metallb.yaml

generators:
  - ksops.yaml

images:
  - name: postgres
    newTag: "14@sha256:980b7cb415aa0f812f65bdec8f6f599be408d8ed9c83ffcaa12650eac397b264"
  - name: redis
    newTag: "8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53"
  - name: ghcr.io/dispatcharr/dispatcharr
    # 0.18.1 (February) -> 0.33.0: clears 9 fixable critical CVEs including a
    # PyJWT auth bypass. Rehearsed against a restored copy of the database on
    # 2026-11-11 (52 -> 184 migrations on Postgres 14).
    newTag: "0.33.0@sha256:96bc548978c68e684677da7895692eeeefb7f0b2edfa38311dac2b702c61d236"
  - name: quay.io/prometheuscommunity/postgres-exporter
    newTag: "v0.20.1"
  - name: oliver006/redis_exporter
    newTag: "v1.97.0"
