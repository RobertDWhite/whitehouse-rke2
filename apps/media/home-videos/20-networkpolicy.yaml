# The indexer Job calls two GPU services:
#   riffado/nemotron-transcribe  speech -> speaker-labelled transcript (riffado is default-deny)
#   qwen-flash                   captions + classification; already open to 10.0.0.0/8
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-home-videos-indexer
  namespace: riffado
spec:
  podSelector:
    matchLabels:
      app: nemotron-transcribe
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-videos
          podSelector:
            matchLabels:
              app: home-videos-indexer
      ports:
        - {port: 8765, protocol: TCP}
