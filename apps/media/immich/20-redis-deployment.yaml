apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
spec:
  replicas: 1
  # Single replica, persistence disabled: nothing to keep alive across a roll.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      # Co-located with immich-server / microservices. Not node-10 or node-50:
      # both go away (power / reboots) and a pinned Redis takes Immich with it.
      nodeSelector:
        kubernetes.io/hostname: rke2-node-14
      tolerations:
        - key: kube-vip
          operator: Equal
          value: disabled
          effect: NoSchedule
      containers:
        - name: redis
          image: redis
          # --maxmemory sits below the container limit on purpose: Redis then
          # refuses new writes instead of being OOMKilled. noeviction matters
          # because these are job queues - evicting keys silently drops work.
          args:
            - "--save"
            - ""
            - "--maxmemory"
            - "3gb"
            - "--maxmemory-policy"
            - "noeviction"
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            # 256Mi was OOMKilling Redis 62 times: Immich's job queues live
            # here, and ~1.6M queued ML jobs blow far past it. Each kill wiped
            # the entire queue, which is why 578k assets sat unprocessed while
            # the GPU idled at 0%.
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 4Gi
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 2
            periodSeconds: 5
