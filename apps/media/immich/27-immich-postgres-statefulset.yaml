apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: immich
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      # Pin to the node that currently holds the only healthy Longhorn replica.
      # After the 2026-09-17 instance-manager restart on node-14, local replicas
      # for this volume stay stopped (instanceManagerName empty), so the engine
      # on node-14 was serving all reads over the network from node-11 and Immich
      # bootstrap (vchordrq_prewarm + advisory lock) never finished. node-11 is
      # Ready again and keeps Immich DB I/O local.
      nodeSelector:
        kubernetes.io/hostname: rke2-node-11
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          # Pin the image supplied by Immich for the v3.1.0 database format.
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          # Command-line -c settings override the image's postgresql.conf.
          # The library is 714k+ assets and the DB ~8.5 GB, but the image's
          # HDD profile gives it shared_buffers=512MB: the cache hit ratio was
          # 67% and a single timeline query read ~115 MB from the 20 TB HDD
          # (~0.5 s). Size the buffer cache to hold the whole database so the
          # mobile app's timeline/sync reads never touch the spinning disk, and
          # cost random reads as cheap because they are served from RAM.
          # pg_prewarm's autoprewarm reloads the cache after a restart.
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - shared_preload_libraries=vchord.so,vectors.so,pg_prewarm,pg_stat_statements
            - -c
            - shared_buffers=16GB
            - -c
            - effective_cache_size=40GB
            - -c
            - work_mem=64MB
            - -c
            - maintenance_work_mem=2GB
            - -c
            - random_page_cost=1.1
            - -c
            - jit=off
            - -c
            - pg_prewarm.autoprewarm=on
            - -c
            - pg_stat_statements.track=top
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_USERNAME}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_DATABASE_NAME}
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            # The new capacity is HDD-backed; Immich supplies matching tuning.
            - name: DB_STORAGE_TYPE
              value: HDD
            # CRITICAL: the image declares VOLUME /var/lib/postgresql/data, so
            # containerd mounts an anonymous node-local volume there that
            # SHADOWS the PVC mounted one level above. With the default PGDATA
            # the database lived on node-10's local disk and was destroyed by
            # every pod restart, while the PVC stayed empty (28K used) and its
            # Longhorn snapshots held nothing. Point PGDATA at a sibling path on
            # the PVC itself, which the image's VOLUME cannot shadow and which
            # avoids the filesystem's lost+found at the PVC root.
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          volumeMounts:
            - name: data
              # The Immich image owns /var/lib/postgresql/data. Mounting the
              # PVC one level higher leaves that empty data directory below the
              # filesystem's lost+found entry.
              mountPath: /var/lib/postgresql
            - name: dshm
              mountPath: /dev/shm
          # After an unclean node or container restart PostgreSQL may need to
          # replay a substantial WAL segment before it accepts connections.
          # A startup probe suppresses liveness restarts during that recovery;
          # without it the 30-second liveness delay can repeatedly interrupt
          # recovery and leave all Immich API pods unable to reach the DB.
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              # node-11 is at ~99% of CPU requests and this pod is pinned there;
              # it has no CPU limit, so it can still burst to all 16 cores.
              cpu: 500m
              # 16 GB shared_buffers + per-query work_mem + /dev/shm.
              memory: 20Gi
            limits:
              # Headroom for VectorChord index builds during a restore.
              memory: 28Gi
      volumes:
        # Kubernetes gives a container a 64 MB /dev/shm by default, which is
        # where Postgres puts parallel-query shared memory. On a 765k-row asset
        # table that runs out: queries fail with "could not resize shared memory
        # segment ... No space left on device".
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-immich-db
        resources:
          requests:
            storage: 100Gi
