apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: immich
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          # Pin the image supplied by Immich for the v3.1.0 database format.
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_USERNAME}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_DATABASE_NAME}
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            # The new capacity is HDD-backed; Immich supplies matching tuning.
            - name: DB_STORAGE_TYPE
              value: HDD
            # CRITICAL: the image declares VOLUME /var/lib/postgresql/data, so
            # containerd mounts an anonymous node-local volume there that
            # SHADOWS the PVC mounted one level above. With the default PGDATA
            # the database lived on node-10's local disk and was destroyed by
            # every pod restart, while the PVC stayed empty (28K used) and its
            # Longhorn snapshots held nothing. Point PGDATA at a sibling path on
            # the PVC itself, which the image's VOLUME cannot shadow and which
            # avoids the filesystem's lost+found at the PVC root.
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          volumeMounts:
            - name: data
              # The Immich image owns /var/lib/postgresql/data. Mounting the
              # PVC one level higher leaves that empty data directory below the
              # filesystem's lost+found entry.
              mountPath: /var/lib/postgresql
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # VectorChord needs temporary working memory while it builds
              # Immich's large vector indexes during a restore.
              memory: 8Gi
      volumes:
        # Kubernetes gives a container a 64 MB /dev/shm by default, which is
        # where Postgres puts parallel-query shared memory. On a 765k-row asset
        # table that runs out: queries fail with "could not resize shared memory
        # segment ... No space left on device".
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-immich-db
        resources:
          requests:
            storage: 100Gi
