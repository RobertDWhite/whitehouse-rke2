apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: immich
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          # Pin the image supplied by Immich for the v3.1.0 database format.
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_USERNAME}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_DATABASE_NAME}
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            # A newly formatted ext4 volume has lost+found at its root. PostgreSQL
            # requires an empty PGDATA directory, not the mount point itself.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # The new capacity is HDD-backed; Immich supplies matching tuning.
            - name: DB_STORAGE_TYPE
              value: HDD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-immich-db
        resources:
          requests:
            storage: 100Gi
