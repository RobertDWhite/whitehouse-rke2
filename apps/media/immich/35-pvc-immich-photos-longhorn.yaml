apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-photos-longhorn
  namespace: immich
  annotations:
    # Never let a prune or a resync destroy the originals volume.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn-immich-photos
  resources:
    requests:
      storage: 10Ti
