apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  # Keep an API endpoint available while a peer is recovering from a slow
  # storage read or is being rolled out.
  replicas: 2
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # node-10 runs at its 110-pod cap, so the pod could not be rescheduled
      # once it lost its slot. node-13 and node-15 both report Longhorn
      # Multipathd=False / KernelModulesLoaded=False - the fault that made RWX
      # writes fail with "Remote I/O error" - so they are not safe for the
      # Longhorn upload volume. node-14 is Longhorn-clean, has capacity, and
      # already runs immich-microservices; it needs the kube-vip toleration.
      nodeSelector:
        kubernetes.io/hostname: rke2-node-14
      tolerations:
        - key: kube-vip
          operator: Equal
          value: disabled
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v2.5.6
          ports:
            - containerPort: 2283
          env:
            - name: DB_HOSTNAME
              valueFrom:
                configMapKeyRef: { name: immich-config, key: DB_HOSTNAME }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: immich-config, key: DB_PORT }
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: immich-db, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: immich-db, key: DB_PASSWORD }
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef: { name: immich-db, key: DB_DATABASE_NAME }

            - name: REDIS_HOSTNAME
              valueFrom:
                configMapKeyRef: { name: immich-config, key: REDIS_HOSTNAME }
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef: { name: immich-config, key: REDIS_PORT }


            - name: MACHINE_LEARNING_URL
              value: "http://immich-machine-learning.immich.svc.cluster.local:3003"

            - name: UPLOAD_LOCATION
              valueFrom:
                configMapKeyRef: { name: immich-config, key: UPLOAD_LOCATION }

            - name: IMMICH_WORKERS_INCLUDE
              value: "api"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 3Gi
          volumeMounts:
            - name: upload
              mountPath: /usr/src/app/upload
              subPath: library
            - name: photos
              mountPath: /photos
          startupProbe:
            tcpSocket: { port: 2283 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 43200
          readinessProbe:
            # TCP and /api/server/ping stay healthy when sync streams exhaust
            # the database pool (immich-app/immich#31415). Config reads the DB.
            httpGet:
              path: /api/server/config
              port: 2283
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            # Remove a slow instance from the service before its client
            # requests begin timing out, without restarting it.
            failureThreshold: 6
          livenessProbe:
            # The config endpoint reads PostgreSQL and can block behind a
            # large upload or recovery I/O. The ping endpoint verifies the
            # API process itself without turning temporary DB contention into
            # a full API restart and public 504.
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            # A genuine API process failure still restarts, but allow five
            # minutes for a transient storage stall to clear first.
            failureThreshold: 10
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: immich-upload-longhorn
        - name: photos
          persistentVolumeClaim:
            claimName: immich-photos-longhorn
