apiVersion: batch/v1
kind: Job
metadata:
  name: immich-media-initial-sync-20260907
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-media-migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      # The RWX share manager for the new media claim runs on node 14. Keeping
      # this bulk copy beside it avoids an unnecessary CNI hop for every write.
      nodeSelector:
        kubernetes.io/hostname: rke2-node-14
      tolerations:
        - key: kube-vip
          operator: Equal
          value: disabled
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rsync
          # Installed at runtime so the operational job is portable across
          # the cluster's ARM nodes. This is intentionally not GitOps-managed.
          image: alpine:3.22
          command: [sh, -ec]
          args:
            - |
              apk add --no-cache rsync
              # These are independent Immich trees. Four bounded workers make
              # better use of the NFS and Longhorn RWX connections while the
              # final, quiesced rsync remains the authoritative reconciliation.
              sync_tree() {
                tree="$1"
                mkdir -p "/destination/$tree"
                rsync --archive --hard-links --numeric-ids --partial \
                  --human-readable "/source/$tree/" "/destination/$tree/"
              }
              for tree in library/encoded-video library/library library/thumbs library/upload; do
                sync_tree "$tree" &
              done
              wait
              for tree in \
                library/backups library/profile immich-ml-cache/clip \
                immich-ml-cache/facial-recognition
              do
                sync_tree "$tree" &
              done
              wait
              for tree in immich-ml-cache/hf immich-ml-cache/matplotlib immich-ml-cache/ocr; do
                sync_tree "$tree" &
              done
              wait
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: immich-upload
        - name: destination
          persistentVolumeClaim:
            claimName: immich-upload-longhorn
