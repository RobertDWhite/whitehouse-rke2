apiVersion: batch/v1
kind: Job
metadata:
  name: immich-photos-initial-sync-20260907
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-photos-migration
    app.kubernetes.io/component: initial-sync
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      # node-15 reports Longhorn condition MultipathdIsRunning (multipathd
      # claims Longhorn devices) and every RWX write there failed with
      # "Remote I/O error (121)". node-14 is clean and carries the replica's
      # engine; it needs the kube-vip toleration.
      nodeSelector:
        kubernetes.io/hostname: rke2-node-14
      tolerations:
        - key: kube-vip
          operator: Equal
          value: disabled
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rsync
          image: registry.internal.white.fm/soc-maintenance:2026-11-11@sha256:9b793ee9a67904ea40a07d3c6f4a1cd2b7b0a4c7788a98209b9fe4a0f25f650c
          command: [sh, -ec]
          args:
            - |
              # Synology internals must never be copied into Longhorn.
              EXCL="--exclude=@eaDir --exclude=#recycle --exclude=.DS_Store --exclude=@tmp"
              # Four bounded workers over the top-level album directories;
              # 8.2 TB single-stream off the NAS is needlessly slow.
              # `wait` with no arguments always returns 0, so a previous run
              # reported success after 17 rsync failures. Wait on each PID and
              # propagate the status instead.
              fail=0
              N=0
              PIDS=""
              reap() { for p in $PIDS; do wait "$p" || fail=1; done; PIDS=""; }
              for d in /source/*/; do
                name=$(basename "$d")
                # --exclude filters WITHIN a transfer, not the transfer root,
                # so Synology's own directories must be skipped by the loop
                # itself or they get copied wholesale.
                case "$name" in
                  '@eaDir'|'#recycle'|'@tmp'|'lost+found') continue ;;
                  # PhotoMaster/Immich is Immich's OWN upload tree (~1.47 TiB).
                  # It is copied separately to immich-upload-longhorn, and every
                  # external library excludes it via **/Immich/**, so copying it
                  # here would duplicate 1.47 TB for nothing.
                  'Immich') continue ;;
                esac
                rsync --archive --hard-links --numeric-ids --partial --update \
                  $EXCL "$d" "/destination/$name/" &
                PIDS="$PIDS $!"
                N=$((N+1))
                [ $((N % 4)) -eq 0 ] && reap
              done
              reap
              # Loose files sitting at the top level.
              rsync --archive --numeric-ids --partial --update $EXCL \
                --exclude='*/' /source/ /destination/ || fail=1
              if [ "$fail" -ne 0 ]; then
                echo "ERROR: one or more rsync workers failed - copy is INCOMPLETE"
                exit 1
              fi
              echo "initial photo sync complete"
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: immich-photos
        - name: destination
          persistentVolumeClaim:
            claimName: immich-photos-longhorn
