apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: calibre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shelfmark
  template:
    metadata:
      labels:
        app: shelfmark
    spec:
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          # Shelfmark starts headless Chrome (Xvfb + seleniumbase) for downloads;
          # at 256Mi the gunicorn worker was OOM-killed ~40 s after every start.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: FLASK_RUN_HOST
              value: "0.0.0.0"
            - name: FLASK_PORT
              value: "8084"
            - name: CWA_URL
              value: "http://calibre-web-automated.calibre.svc.cluster.local"
            - name: CWA_PUBLIC_URL
              value: "https://books.white.fm"
            - name: INGEST_DIR
              value: "/books"
            - name: HTTP_PROXY
              value: "http://vpn-proxy.media.svc.cluster.local:8888"
            - name: HTTPS_PROXY
              value: "http://vpn-proxy.media.svc.cluster.local:8888"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.cluster.local,.svc,.local,.white.fm"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config
        - name: books
          persistentVolumeClaim:
            claimName: shelfmark-books
