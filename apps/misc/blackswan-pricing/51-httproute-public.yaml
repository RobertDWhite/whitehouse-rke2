# Public route, no Authentik in front: the page is a static calculator and every
# edit lives in the visitor's own browser (localStorage / share links), so the
# server holds nothing private. Add an Authentik SecurityPolicy if that changes.
#
# external-dns creates the Cloudflare CNAME to the tunnel from this hostname;
# cloudflared's ingress list carries the matching entry
# (platform/networking/cloudflared/cloudflared-config.sops.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blackswan-public
  namespace: blackswan
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-white-fm
  hostnames:
    - blackswan.white.fm
  rules:
    - backendRefs:
        - name: blackswan-pricing
          port: 80
