apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blackswan
resources:
  - 00-namespace.yaml
  - 10-deployment.yaml
  - 20-service.yaml
  - 51-httproute-public.yaml
  - 53-httproute-internal.yaml

# Black Swan Coffee event pricing calculator (blackswan.white.fm), served from
# ConfigMaps. The names are content-hashed, so editing any file below rolls
# the pod.
#
# Team-wide default pricing: in the app, go to Pricing model -> Export JSON,
# paste the result into web/defaults.json, then commit. An empty {} falls back
# to the built-in model, which uses the original LocalEyes constants.
configMapGenerator:
  - name: blackswan-pricing-web
    files:
      - web/index.html
      - web/defaults.json
  - name: blackswan-pricing-nginx
    files:
      - default.conf=nginx.conf

images:
  - name: nginxinc/nginx-unprivileged
    newTag: 1.31-alpine
    digest: sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
