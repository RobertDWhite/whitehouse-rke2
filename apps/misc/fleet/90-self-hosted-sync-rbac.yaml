apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-self-hosted-sync
  namespace: fleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-self-hosted-sync
  namespace: fleet
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["fleet"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-self-hosted-sync
  namespace: fleet
subjects:
  - kind: ServiceAccount
    name: fleet-self-hosted-sync
    namespace: fleet
roleRef:
  kind: Role
  name: fleet-self-hosted-sync
  apiGroup: rbac.authorization.k8s.io
