apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-self-hosted-sync
  namespace: fleet
  labels:
    app: fleet-self-hosted-sync
spec:
  # Pull the latest image published by the private Fleet repository hourly.
  schedule: "43 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: fleet-self-hosted-sync
        spec:
          serviceAccountName: fleet-self-hosted-sync
          restartPolicy: OnFailure
          containers:
            - name: refresh
              image: alpine/k8s:1.31.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  echo "[$(date -u +%FT%TZ)] refreshing self-hosted Fleet image"
                  kubectl -n fleet rollout restart deployment/fleet
                  kubectl -n fleet rollout status deployment/fleet --timeout=10m
                  echo "[$(date -u +%FT%TZ)] Fleet rollout completed"
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
