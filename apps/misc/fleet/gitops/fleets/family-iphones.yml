name: "Family - iPhones"
settings:
  features:
    historical_data:
      uptime: true
      vulnerabilities: false
    enable_host_users: true
    enable_software_inventory: true
  secrets:
  - secret: $FLEET_ENROLL_SECRET_FAMILY_IPHONES
agent_options:
  config:
    options:
      pack_delimiter: /
      logger_tls_period: 10
      distributed_plugin: tls
      disable_distributed: false
      logger_tls_endpoint: /api/osquery/log
      distributed_interval: 10
      distributed_tls_max_attempts: 3
    decorators:
      load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
  overrides: {}
controls:
  apple_settings:
    configuration_profiles:
    - path: ../lib/apple/profiles/encrypted-dns.mobileconfig
    - path: ../lib/apple/profiles/lock-screen-message.mobileconfig
    - path: ../lib/apple/profiles/managed-wi-fi.mobileconfig
    - path: ../lib/apple/profiles/stamper-wifi.mobileconfig
    - path: ../lib/apple/profiles/the-old-whitehouse.mobileconfig
    - path: ../lib/apple/declarations/watchos-enrollment.json
policies: []
reports: []
