name: "Servers - RKE2 Nodes"
settings:
  features:
    historical_data:
      uptime: true
      vulnerabilities: false
    enable_host_users: true
    enable_software_inventory: true
agent_options:
  config:
    options:
      pack_delimiter: /
      logger_tls_period: 10
      distributed_plugin: tls
      disable_distributed: false
      logger_tls_endpoint: /api/osquery/log
      distributed_interval: 10
      distributed_tls_max_attempts: 3
    decorators:
      load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
  overrides: {}
controls: {}
policies: []
reports:
- name: soc_heartbeat
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT hostname, uuid FROM system_info;
  interval: 60
  observer_can_run: true
  automations_enabled: true
  logging: snapshot
  platform: linux
- name: soc_listening_ports
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT l.address,l.port,l.protocol,p.name,p.path FROM listening_ports l LEFT
    JOIN processes p ON p.pid=l.pid WHERE l.port > 0;
  interval: 120
  observer_can_run: true
  automations_enabled: true
  logging: differential
  platform: linux
- name: soc_local_users
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT uid,gid,username,directory,shell FROM users;
  interval: 300
  observer_can_run: true
  automations_enabled: true
  logging: differential
  platform: linux
- name: soc_uid_zero
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT uid,username,directory,shell FROM users WHERE uid=0 AND username !=
    'root';
  interval: 60
  observer_can_run: true
  automations_enabled: true
  logging: snapshot
  platform: linux
- name: soc_cron
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT event,minute,hour,day_of_month,month,day_of_week,path FROM crontab;
  interval: 300
  observer_can_run: true
  automations_enabled: true
  logging: differential
  platform: linux
software:
  packages: []
