name: "Windows - Fixed-purpose"
settings:
  features:
    historical_data:
      uptime: true
      vulnerabilities: false
    enable_host_users: true
    enable_software_inventory: true
agent_options:
  config:
    options:
      pack_delimiter: /
      logger_tls_period: 10
      distributed_plugin: tls
      disable_distributed: false
      logger_tls_endpoint: /api/osquery/log
      distributed_interval: 10
      distributed_tls_max_attempts: 3
    decorators:
      load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
  overrides: {}
controls:
  enable_disk_encryption: true
  windows_updates:
    deadline_days: 5
    grace_period_days: 0
  # The OS-updates profile is generated by Fleet from windows_updates above;
  # declaring it here as well is rejected as a duplicate.
  windows_settings:
    configuration_profiles: []
policies:
  - name: '[Install software] 1Password'
    query: SELECT 1 FROM programs WHERE name = '1Password' AND publisher = 'Agilebits Inc.';
    description: Policy triggers automatic install of 1Password on each host that's missing this software.
    platform: windows
    install_software:
      fleet_maintained_app_slug: 1password/windows
  - name: '[Install software] 1Password 2'
    query: SELECT 1 FROM apps WHERE bundle_identifier = 'com.1password.1password';
    description: Policy triggers automatic install of 1Password on each host that's missing this software.
    platform: darwin
    install_software:
      fleet_maintained_app_slug: 1password/darwin
  - name: '[Install software] Signal'
    query: SELECT 1 FROM apps WHERE bundle_identifier = 'org.whispersystems.signal-desktop';
    description: Policy triggers automatic install of Signal on each host that's missing this software.
    platform: darwin
    install_software:
      fleet_maintained_app_slug: signal/darwin
  - name: '[Install software] Signal 2'
    query: SELECT 1 FROM programs WHERE name = 'Signal' AND publisher = 'Signal Messenger, LLC';
    description: Policy triggers automatic install of Signal on each host that's missing this software.
    platform: windows
    install_software:
      fleet_maintained_app_slug: signal/windows
  - name: '[Install software] WhatsApp'
    query: SELECT 1 FROM apps WHERE bundle_identifier = 'net.whatsapp.WhatsApp';
    description: Policy triggers automatic install of WhatsApp on each host that's missing this software.
    platform: darwin
    install_software:
      fleet_maintained_app_slug: whatsapp/darwin
reports:
- name: soc_heartbeat
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT hostname, uuid FROM system_info;
  interval: 60
  observer_can_run: true
  automations_enabled: true
  logging: snapshot
  platform: windows
- name: soc_listening_ports
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT l.address,l.port,l.protocol,p.name,p.path FROM listening_ports l LEFT
    JOIN processes p ON p.pid=l.pid WHERE l.port > 0;
  interval: 120
  observer_can_run: true
  automations_enabled: true
  logging: differential
  platform: windows
- name: soc_local_users
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT uid,gid,username,directory,shell FROM users;
  interval: 300
  observer_can_run: true
  automations_enabled: true
  logging: differential
  platform: windows
- name: soc_services
  description: SOC endpoint telemetry; evidence is forwarded to Loki. Differential
    first results are baseline, not automatically an incident.
  query: SELECT name,display_name,path,start_type,status,user_account FROM services;
  interval: 300
  observer_can_run: true
  automations_enabled: true
  logging: differential
  platform: windows
software:
  # Unpinned Fleet-maintained apps track Fleet's catalog; the nightly
  # CronJob picks up new versions.
  fleet_maintained_apps:
    - slug: 1password/windows
      self_service: true
    - slug: 1password/darwin
    - slug: brave-browser/windows
    - slug: signal/darwin
    - slug: signal/windows
    - slug: whatsapp/darwin
