apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet

generators:
  - 25-ksops.yaml

resources:
  - 00-namespace.yaml
  - 10-mysql-statefulset.yaml
  - 11-mysql-service.yaml
  - 12-mysql-pdb.yaml
  - 20-valkey-statefulset.yaml
  - 21-valkey-service.yaml
  - 40-cronjob-mysqldump.yaml
  - 70-smtp-config-job.yaml
  - 50-httproute-public.yaml
  - 51-httproute-internal.yaml
  - 60-fleet-pdb.yaml

patches:
  - path: 80-patch-fleet-env.yaml
    target:
      kind: Deployment
      name: fleet
  - path: 81-patch-fleet-migration-env.yaml
    target:
      kind: Job
      name: fleet-migration
  - path: 82-patch-fleet-migration-strip-hooks.yaml
    target:
      kind: Job
      name: fleet-migration
  - path: 83-patch-fleet-sa-strip-hooks.yaml
    target:
      kind: ServiceAccount
      name: fleet
  - path: 84-patch-fleet-self-hosted-image.yaml
    target:
      kind: Deployment
      name: fleet
  - path: 85-patch-fleet-migration-image.yaml
    target:
      kind: Job
      name: fleet-migration
  - path: 86-patch-fleet-avoid-unready-node.yaml
    target:
      kind: Deployment
      name: fleet

images:
  - name: mysql
    newTag: "8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d"
  - name: valkey/valkey
    newTag: "9.2-alpine"
  - name: prom/mysqld-exporter
    newTag: "v0.20.0"
  - name: busybox
    newTag: "1.38"
  - name: fleetdm/fleet
    newName: ghcr.io/robertdwhite/fleet-self-hosted
    newTag: 5c7976e5e1-amd64

helmCharts:
  - name: fleet
    releaseName: fleet
    version: v7.0.20
    repo: https://fleetdm.github.io/fleet/charts
    valuesFile: values.yaml
    includeCRDs: true
    namespace: fleet
