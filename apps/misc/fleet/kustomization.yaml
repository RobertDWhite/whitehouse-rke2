apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet

generators:
  - 25-ksops.yaml

resources:
  - 00-namespace.yaml
  - 10-mysql-statefulset.yaml
  - 11-mysql-service.yaml
  - 12-mysql-pdb.yaml
  - 20-valkey-statefulset.yaml
  - 21-valkey-service.yaml
  - 40-cronjob-mysqldump.yaml
  - 45-cronjob-vpp-latest-versions.yaml
  - 45-cronjob-gitops.yaml
  - 46-job-gitops-apply.yaml
  - 70-smtp-config-job.yaml
  - 50-httproute-public.yaml
  - 51-httproute-internal.yaml
  - 60-fleet-pdb.yaml
  - 61-networkpolicy.yaml

configMapGenerator:
  - name: fleet-gitops-fleets
    files:
      - gitops/fleets/servers-rke2-nodes.yml
      - gitops/fleets/servers-linux.yml
      - gitops/fleets/windows-fixed-purpose.yml
      - gitops/fleets/family-macos.yml
      - gitops/fleets/family-iphones.yml
      - gitops/fleets/family-ipads.yml
      - gitops/fleets/family-apple-tvs.yml
      - gitops/fleets/family-watches.yml
  - name: fleet-gitops-apple-profiles
    files:
      - gitops/lib/apple/profiles/managed-wi-fi.mobileconfig
      - gitops/lib/apple/profiles/stamper-wifi.mobileconfig
      - gitops/lib/apple/profiles/the-old-whitehouse.mobileconfig
      - gitops/lib/apple/profiles/encrypted-dns.mobileconfig
      - gitops/lib/apple/profiles/lock-screen-message.mobileconfig
  - name: fleet-gitops-apple-declarations
    files:
      - gitops/lib/apple/declarations/watchos-enrollment.json

patches:
  - path: 80-patch-fleet-env.yaml
    target:
      kind: Deployment
      name: fleet
  - path: 81-patch-fleet-migration-env.yaml
    target:
      kind: Job
      name: fleet-migration
  - path: 82-patch-fleet-migration-strip-hooks.yaml
    target:
      kind: Job
      name: fleet-migration
  - path: 83-patch-fleet-sa-strip-hooks.yaml
    target:
      kind: ServiceAccount
      name: fleet
  - path: 84-patch-fleet-self-hosted-image.yaml
    target:
      kind: Deployment
      name: fleet
  - path: 85-patch-fleet-migration-image.yaml
    target:
      kind: Job
      name: fleet-migration
  - path: 86-patch-fleet-avoid-unready-node.yaml
    target:
      kind: Deployment
      name: fleet

images:
  - name: mysql
    newTag: "8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7"
  - name: valkey/valkey
    newTag: "9.2-alpine"
  - name: prom/mysqld-exporter
    newTag: "v0.21.0"
  - name: busybox
    newTag: "1.38"
  - name: registry.internal.white.fm/fleetctl-self-hosted
    newTag: "ae83040f"
    digest: sha256:06afab051887d4ba7e5267948c2417a30bdb8c5a074b95d2c76d060ef082df2f
  - name: fleetdm/fleet
    newName: ghcr.io/robertdwhite/fleet-self-hosted
    newTag: 5c7976e5e1-amd64

helmCharts:
  - name: fleet
    releaseName: fleet
    version: v7.0.31
    repo: https://fleetdm.github.io/fleet/charts
    valuesFile: values.yaml
    includeCRDs: true
    namespace: fleet
