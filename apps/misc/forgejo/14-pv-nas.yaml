# Nightly `forgejo dump` archives land on the Synology under
# Personal/Forgejo/dumps (same export Gramps and Riffado use). The NAS copy is
# the consistent one - Velero's kopia copy of the Longhorn volume is only
# crash-consistent for the SQLite database.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-forgejo-nas
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.100.1.20
    path: /volume1/Personal
  claimRef:
    name: forgejo-nas
    namespace: forgejo
