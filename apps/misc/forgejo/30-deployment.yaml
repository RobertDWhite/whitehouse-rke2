apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      # Rootless image: runs as uid/gid 1000, app.ini is generated from the
      # FORGEJO__section__KEY env vars below on every start.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      enableServiceLinks: false
      initContainers:
        # Declarative-ish OAuth2 auth source: create the "authentik" source on
        # first start, and re-apply client id/secret/discovery URL on every
        # start (update-oauth) so the DB always matches the forgejo-oidc Secret.
        # Runs before the web container, so nothing else holds the SQLite DB.
        - name: oauth-source
          image: codeberg.org/forgejo/forgejo
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              CONF=/var/lib/gitea/custom/conf/app.ini
              if [ ! -f "$CONF" ]; then
                echo "app.ini not generated yet (first boot); skipping"
                exit 0
              fi
              set -- --name authentik --provider openidConnect \
                --key "$OIDC_CLIENT_ID" --secret "$OIDC_CLIENT_SECRET" \
                --auto-discover-url "$OIDC_DISCOVERY_URL" \
                --scopes openid --scopes email --scopes profile \
                --skip-local-2fa
              ID=$(forgejo admin auth list --config "$CONF" | awk '$2 == "authentik" {print $1}')
              if [ -z "$ID" ]; then
                echo "creating auth source authentik"
                forgejo admin auth add-oauth --config "$CONF" "$@"
              else
                echo "updating auth source authentik (id $ID)"
                forgejo admin auth update-oauth --config "$CONF" --id "$ID" "$@"
              fi
          env:
            - name: OIDC_DISCOVERY_URL
              value: https://auth.white.fm/application/o/forgejo/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc
                  key: client-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
              subPath: data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: FORGEJO__server__DOMAIN
              value: git.internal.white.fm
            - name: FORGEJO__server__ROOT_URL
              value: https://git.internal.white.fm/
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # Git over HTTPS with per-user/per-agent access tokens only.
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__server__LFS_START_SERVER
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__database__SQLITE_JOURNAL_MODE
              value: WAL
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            # Accounts come from Authentik (OIDC auth source "authentik",
            # managed by the oauth-source init container). No local sign-up;
            # local password sign-in stays enabled as break-glass.
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "false"
            - name: FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION
              value: "true"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE
              value: "true"
            - name: FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION
              value: "true"
            - name: FORGEJO__oauth2_client__USERNAME
              value: nickname
            # auto: an Authentik login whose username (nickname claim) or
            # email matches an existing local user is linked to it directly.
            # Safe because the Authentik app is bound to "authentik Admins".
            - name: FORGEJO__oauth2_client__ACCOUNT_LINKING
              value: auto
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNIN
              value: "false"
            - name: FORGEJO__repository__DEFAULT_PRIVATE
              value: private
            - name: FORGEJO__repository__FORCE_PRIVATE
              value: "true"
            - name: FORGEJO__actions__ENABLED
              value: "false"
            # Webhooks may only reach external hosts plus these in-cluster
            # receivers (Hookshot posts brain repo pushes to the Brain room).
            - name: FORGEJO__webhook__ALLOWED_HOST_LIST
              value: external,matrix-hookshot.matrix.svc.cluster.local
            - name: FORGEJO__mailer__ENABLED
              value: "true"
            - name: FORGEJO__mailer__PROTOCOL
              value: smtp
            - name: FORGEJO__mailer__SMTP_ADDR
              value: postfix.postfix.svc.cluster.local
            - name: FORGEJO__mailer__SMTP_PORT
              value: "25"
            - name: FORGEJO__mailer__FROM
              value: forgejo@whitematter.tech
            - name: FORGEJO__log__LEVEL
              value: Info
            - name: FORGEJO__time__DEFAULT_UI_LOCATION
              value: America/New_York
          volumeMounts:
            # Config lives on the volume too so the dump CronJob, which mounts
            # the same PVC, reads the same app.ini.
            - name: data
              mountPath: /var/lib/gitea
              subPath: data
            - name: data
              mountPath: /etc/gitea
              subPath: config
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
