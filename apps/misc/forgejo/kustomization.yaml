apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo

# The data PVC (forgejo-data) lives in platform/storage/storage/forgejo.
resources:
  - 00-namespace.yaml
  - 14-pv-nas.yaml
  - 15-pvc-nas.yaml
  - 30-deployment.yaml
  - 35-dump-cronjob.yaml
  - 40-service.yaml
  - 53-httproute-internal.yaml

# forgejo-oidc Secret (Authentik client id/secret for the "authentik" auth source).
generators:
  - ksops.yaml

images:
  - name: data.forgejo.org/forgejo/forgejo
    newTag: "17.0.1-rootless@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3"
