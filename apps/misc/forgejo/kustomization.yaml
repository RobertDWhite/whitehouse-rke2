apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo

# The data PVC (forgejo-data) lives in platform/storage/storage/forgejo.
resources:
  - 00-namespace.yaml
  - 14-pv-nas.yaml
  - 15-pvc-nas.yaml
  - 30-deployment.yaml
  - 35-dump-cronjob.yaml
  - 40-service.yaml
  - 53-httproute-internal.yaml

# forgejo-oidc Secret (Authentik client id/secret for the "authentik" auth source).
generators:
  - ksops.yaml

images:
  - name: data.forgejo.org/forgejo/forgejo
    newTag: "17.0.2-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04"
