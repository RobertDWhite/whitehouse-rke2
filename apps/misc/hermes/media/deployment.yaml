apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-media
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-media-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-media
    spec:
      serviceAccountName: hermes-media
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: registry.internal.white.fm/hermes-agent:v2026.7.7.2-sec1@sha256:4085f4d860f22c1a66ec3c70e03d2e79b3c594c9d051240fb3cdc53d3e9cd7b0
          command: ["/opt/hermes/.venv/bin/python3", "-B", "/profile/matrix_gateway.py"]
          args: ["gateway", "run"]
          workingDir: /opt/hermes
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_MEDIA_CONTEXT_TOKEN
              valueFrom:
                secretKeyRef: {name: hermes-media-context-auth, key: token}
            - name: MATRIX_HOMESERVER
              value: http://synapse.matrix.svc.cluster.local:8008
            - name: MATRIX_USER_ID
              value: "@hermes-media:white.fm"
            - name: MATRIX_ALLOWED_USERS
              value: "@robert:white.fm"
            - name: MATRIX_REQUIRE_MENTION
              value: "false"
            - name: MATRIX_E2EE_MODE
              value: required
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: {name: hermes-media-matrix, key: MATRIX_ACCESS_TOKEN}
            - name: MATRIX_DEVICE_ID
              valueFrom:
                secretKeyRef: {name: hermes-media-matrix, key: MATRIX_DEVICE_ID}
            - name: MATRIX_ALLOWED_ROOMS
              valueFrom:
                secretKeyRef: {name: hermes-media-matrix, key: MATRIX_ALLOWED_ROOMS}
          readinessProbe:
            exec:
              command: ["/opt/hermes/.venv/bin/python3", "-B", "/profile/matrix_gateway.py", "--ready"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /opt/data
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: profile
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: profile
              mountPath: /opt/data/SOUL.md
              subPath: SOUL.md
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: hermes-media-state
        - name: profile
          configMap:
            name: hermes-media-profile
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
