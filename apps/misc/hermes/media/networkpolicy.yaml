apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-media
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix
          podSelector:
            matchLabels:
              app: synapse
      ports:
        - {protocol: TCP, port: 8008}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qwen-flash
          podSelector:
            matchLabels:
              app: qwen-flash
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media-mcp
          podSelector:
            matchLabels:
              app: hermes-media-context
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
