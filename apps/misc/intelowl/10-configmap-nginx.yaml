apiVersion: v1
kind: ConfigMap
metadata:
  name: intelowl-nginx-conf
data:
  http.conf: |
    upstream django {
      server 127.0.0.1:8001 fail_timeout=0;
    }
    upstream daphne {
      server intelowl-daphne:8011 fail_timeout=0;
    }
    server {
      listen 80;
      server_name _;
      server_tokens off;
      client_max_body_size 100M;

      include locations.conf;
      include websocket.conf;
      include errors.conf;
    }
  locations.conf: |
    # The release HTML requests this optional file, but the release image omits it.
    # This deployment uses the frontend's compiled settings, with no runtime overrides.
    location = /static/reactapp/env.js {
      default_type application/javascript;
      return 200 "/* No runtime frontend overrides configured. */\n";
    }
    location /static/ {
      alias /var/www/static/;
    }
    location / {
      include /etc/nginx/uwsgi_params;
      uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
      uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
      uwsgi_param HTTP_HOST $http_host;
      uwsgi_pass django;
      uwsgi_connect_timeout 300;
      uwsgi_send_timeout 300;
      uwsgi_read_timeout 300;
    }
  websocket.conf: |
    location /ws {
      proxy_pass http://daphne;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }
  errors.conf: |
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
