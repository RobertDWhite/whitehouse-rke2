apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intelowl

generators:
  - ksops.yaml

generatorOptions:
  disableNameSuffixHash: true

resources:
  - 00-namespace.yaml
  - 10-configmap-env.yaml
  - 10-configmap-nginx.yaml
  - 10-configmap-uwsgi.yaml
  - 20-postgres-statefulset.yaml
  - 21-redis-deployment.yaml
  - 22-rabbitmq-deployment.yaml
  - 30-deployment-web.yaml
  - 31-deployment-daphne.yaml
  - 33-deployment-celery.yaml
  - 40-services.yaml

images:
  - name: intelowlproject/intelowl
    newTag: "v6.8.0"
  - name: intelowlproject/intelowl_nginx
    # Nginx 1.31.8 with Alpine package fixes; built from IntelOwl e878489.
    newName: ghcr.io/robertdwhite/intelowl-nginx
    newTag: "security-e878489b8f683a5e021f1266072aa52be27880a1"
    digest: sha256:84fa45c8e730548ab7bd3459e20e2024256b2476ce1d021a589cbc4dd0f680bc
  - name: postgres
    newTag: "16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139"
  - name: redis
    newTag: "8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80"
  - name: rabbitmq
    newTag: "4.4-alpine"
  - name: busybox
    newTag: "1.38"
