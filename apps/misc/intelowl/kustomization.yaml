apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intelowl

generators:
  - ksops.yaml

generatorOptions:
  disableNameSuffixHash: true

resources:
  - 00-namespace.yaml
  - 10-configmap-env.yaml
  - 10-configmap-nginx.yaml
  - 10-configmap-uwsgi.yaml
  - 20-postgres-statefulset.yaml
  - 21-redis-deployment.yaml
  - 22-rabbitmq-deployment.yaml
  - 30-deployment-web.yaml
  - 31-deployment-daphne.yaml
  - 33-deployment-celery.yaml
  - 40-services.yaml

images:
  - name: intelowlproject/intelowl
    newTag: "v6.8.0"
  - name: intelowlproject/intelowl_nginx
    newTag: "v6.8.0"
  - name: postgres
    newTag: "16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815"
  - name: redis
    newTag: "8.10.2-alpine@sha256:615b4cedaff0c1437a1548acae4222572df8c021eeb7382d64cb8b5e3a13ac7a"
  - name: rabbitmq
    newTag: "4.4-alpine"
  - name: busybox
    newTag: "1.38"
