apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      enableServiceLinks: false
      securityContext:
        # We want imported files to be owned by www-data group
        fsGroup: 101
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
      containers:
        - name: nginx
          image: ghcr.io/misp/misp-docker/misp-nginx
          imagePullPolicy: IfNotPresent
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
            successThreshold: 1
          env:
            - name: BASE_URL
              value: https://misp.internal.white.fm
            - name: FASTCGI_LISTEN
              value: misp-php:9002
            - name: FASTCGI_LISTEN_STATUS
              value: misp-php:9002
          ports:
            - name: misp-https
              containerPort: 8443
              protocol: TCP
          resources:
            limits:
              memory: 2048Mi
            requests:
              memory: 512Mi
              cpu: 50m


          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: misp-nginx-tls
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: key.pem
