apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wallabag

resources:
  - 00-namespace.yaml
  - 10-pvc.yaml
  - 20-deployment.yaml
  - 30-service.yaml
  - 31-authentik-service.yaml
  - 40-networkpolicy.yaml
  - 52-httproute-public.yaml
  - 53-httproute-internal.yaml

configMapGenerator:
  - name: wallabag-php-security
    literals:
      # Global startup configuration; .user.ini is too late for this setting.
      - "99-security.ini=session.upload_progress.enabled=0"

images:
  - name: wallabag/wallabag
    newTag: "2.6.14"
    digest: sha256:4a527e027e0d59e87c14225ef11e005af3d4890374202ad319ce5e63dfc66709
