apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wallabag

resources:
  - 00-namespace.yaml
  - 10-pvc.yaml
  - 20-deployment.yaml
  - 30-service.yaml
  - 31-authentik-service.yaml
  - 40-networkpolicy.yaml
  - 52-httproute-public.yaml
  - 53-httproute-internal.yaml

configMapGenerator:
  - name: wallabag-php-security
    literals:
      # Global startup configuration; .user.ini is too late for this setting.
      - "99-security.ini=session.upload_progress.enabled=0"

images:
  - name: wallabag/wallabag
    newName: ghcr.io/robertdwhite/wallabag-security
    newTag: sha-bd64d94503c2e07a5c2476e43a15cff504c8d257
    digest: sha256:f535a72be2667a35593838358ba7a136acec4df48c86523e024bb185c9544e35
