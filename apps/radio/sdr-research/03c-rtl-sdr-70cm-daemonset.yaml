# Second RTL-SDR dongle for 70cm (432 MHz band)
# Requires a second USB RTL-SDR dongle with serial "00000002" on rke2-node-15.
# To set the serial on the dongle: rtl_eeprom -d <index> -s 00000002
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rtl-sdr-tcp-70cm
  namespace: sdr-research
spec:
  selector:
    matchLabels:
      app: rtl-sdr-tcp-70cm
  template:
    metadata:
      labels:
        app: rtl-sdr-tcp-70cm
    spec:
      nodeSelector:
        kubernetes.io/hostname: rke2-node-15
      containers:
        - name: rtl-tcp-70cm
          image: legacycode/rtlsdr
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 1235
              name: rtl-tcp-70cm
          env:
            - name: RTL_DEVICE_SERIAL
              value: "00000002"
            - name: RTL_SAMPLE_RATE
              value: "2400000"
            - name: RTL_GAIN
              value: "auto"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "for f in /proc/[0-9]*/comm; do [ \"$(cat \"$f\")\" = \"rtl_tcp\" ] && exit 0; done; exit 1"
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "for f in /proc/[0-9]*/comm; do [ \"$(cat \"$f\")\" = \"rtl_tcp\" ] && exit 0; done; exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: usb
              mountPath: /dev/bus/usb
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # All device actions are scoped to the configured serial. Never bind ADS-B.
              [ "${RTL_DEVICE_SERIAL}" != "1090" ] || exit 64
              while true; do
                DVB_DRV=/sys/bus/usb/drivers/dvb_usb_rtl28xxu
                for usb in /sys/bus/usb/devices/*; do
                  [ -f "$usb/serial" ] || continue
                  [ "$(cat "$usb/serial")" = "${RTL_DEVICE_SERIAL}" ] || continue
                  for interface in "$usb":*; do
                    [ -L "$interface/driver" ] || continue
                    [ "$(readlink -f "$interface/driver")" = "$DVB_DRV" ] || continue
                    devid=$(basename "$interface")
                    printf '%s' "$devid" > "$DVB_DRV/unbind"
                    echo "Unbound target serial ${RTL_DEVICE_SERIAL}: $devid"
                  done
                done
                # Invalid-index enumeration reads USB descriptors without opening a receiver.
                ENUM=$(timeout 5 rtl_tcp -d 99 2>&1 || true)
                DEV_INDEX=$(printf '%s\n' "$ENUM" | awk -v serial="$RTL_DEVICE_SERIAL" '
                  /^[[:space:]]*[0-9]+:/ {
                    n=$1; sub(/:$/, "", n); sub(/^.*SN:[[:space:]]*/, "")
                    if ($0 == serial) print n
                  }')
                case "$DEV_INDEX" in
                  ''|*[!0-9]*) echo "Target serial ${RTL_DEVICE_SERIAL} absent or ambiguous; retrying"; sleep 5; continue ;;
                esac
                echo "Using serial ${RTL_DEVICE_SERIAL} at index ${DEV_INDEX}"
                # Small bounded IQ queue limits old samples remaining across a retune.
                rtl_tcp -d "$DEV_INDEX" -a 0.0.0.0 -p 1235 -s "$RTL_SAMPLE_RATE" -n 8 || true
                echo "Target server exited; re-resolving serial before reopening"
                sleep 2
              done
      volumes:
        - name: usb
          hostPath:
            path: /dev/bus/usb
