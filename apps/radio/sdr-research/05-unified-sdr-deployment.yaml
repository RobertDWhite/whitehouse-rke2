apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-sdr
  namespace: sdr-research
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unified-sdr
  template:
    metadata:
      labels:
        app: unified-sdr
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-02-26T04:00:00Z"
    spec:
      # node-10 is tainted dedicated=llm:NoSchedule (reserved for the vLLM
      # server); this workload is pinned there on purpose.
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: rke2-node-10
      containers:
        - name: unified-sdr
          image: librespace/gnuradio
          securityContext:
            privileged: true
          command: ["/bin/bash", "-c", "python3 -u /scripts/unified_sdr.py"]
          env:
            # Airspy Mini via direct local USB access on node-10.
            # SoapyRemote control connected successfully but delivered empty sample
            # buffers; using the native osmosdr airspy source removes that layer.
            - name: OSMOSDR_ARGS
              value: "airspy=0"
            - name: CAPTURE_ID
              value: "2m"
            - name: FIXED_MONITOR_HZ
              # 144.390 MHz — North American APRS primary; permanent demodulator
              # ensures short APRS bursts are captured even when energy detector misses them
              value: "144390000"
            - name: SAMPLE_RATE
              # Airspy Mini supports 3 MSPS or 6 MSPS; 6 MSPS covers full 2m band
              # (143–149 MHz) including APRS, repeaters, and simplex.
              value: "6000000"
            - name: DWELL_CENTER_HZ
              # Center of 2m amateur band; 6 MHz BW covers 143–149 MHz
              value: "146000000"
            - name: SCAN_CENTERS
              # Hops between 2m dwells (6 MHz each): 10m FM (25.9-31.9),
              # 6m (49.5-55.5), marine + NOAA WX (156.6-162.6). The old
              # double-free was in SoapyRemote; this uses native airspy.
              value: "[28900000, 52500000, 159600000]"
            - name: DWELL_SEC
              # Longer dwell: 6 MHz BW captures all 2m activity simultaneously
              value: "60"
            - name: SCAN_SEC
              value: "8"
            - name: NUM_DYN_FM
              # 12 slots for 6 MHz BW — captures concurrent 2m activity
              value: "12"
            - name: NUM_DYN_CW
              value: "4"
            - name: NUM_DYN_ACARS
              # ACARS not in 2m band — keep minimal
              value: "0"
            - name: SLOT_RECYCLE_SEC
              value: "300"
            - name: CLEAR_SLOTS_ON_RETUNE
              # Slots hold offsets from the center they were assigned at;
              # clear them on every retune so recordings keep correct labels.
              value: "true"
            - name: SQUELCH_OPEN_DB
              value: "-50"
            - name: SQUELCH_CLOSE_DB
              value: "-55"
            - name: RF_SQUELCH_DB
              # Initial threshold + floor prior only: AUTO_SQUELCH measures each
              # channel's real noise floor and holds the squelch
              # AUTO_SQUELCH_MARGIN_DB above it. Static values failed both ways
              # here (-50 recorded noise 24/7; -40 recorded nothing for hours).
              # The floor prior (this minus the margin) must sit at or above the
              # real floor (~-43 dB on 2m): the floor follows drops instantly but
              # can't rise while recording, so a low prior opens every channel at
              # startup and holds them open.
              value: "-35"
            - name: AUTO_SQUELCH_MARGIN_DB
              # Raise if noise blips open the gate; lower if weak stations are missed.
              # Watch the [SQL] lvl/floor/thr telemetry lines to tune from data.
              value: "8"
            - name: AUTO_SQUELCH_MIN_DB
              # Lowest allowed threshold (script default -70). At RF_GAIN 8 the
              # 2m floor is ~-79 dB, so -70 pinned the gate 9+ dB above noise
              # and nothing opened in 4.5 h; -85 lets floor+margin apply.
              value: "-85"
            - name: NOISE_DISCARD_RMS_DB
              # Measured over ACTIVE (non-squelch-gated) samples: noise bursts
              # ~-7 dB, real voice ~-15 dB. Anything at/above this is discarded
              # on close — deterministic noise backstop.
              value: "-9"
            - name: FM_RECORD_BANDS_HZ
              # Bandplan-true 2m FM voice only: APRS slice + repeater outputs
              # + simplex/repeaters. The Airspy's spur forest lives at
              # 144.4-145.1 and 145.5-146.0 where no US FM voice exists.
              # Scan hops add 10m FM, 6m, and marine + NOAA WX.
              value: "144380000-144400000,145100000-145500000,146000000-148000000,29500000-29700000,51000000-54000000,156000000-162600000"
            - name: NOISE_GUARD_ROLLOVERS
              # Deactivate + blocklist a channel after this many consecutive
              # max-duration rollovers (spur signature: squelch never drops).
              value: "3"
            - name: NOISE_GUARD_COOLDOWN_SEC
              value: "1800"
            - name: TAIL_SEC
              value: "1.5"
            - name: MIN_REC_SEC
              value: "0.5"
            - name: MAX_REC_SEC
              value: "120"
            - name: FFT_SIZE
              value: "4096"
            - name: FFT_INTERVAL
              value: "1.0"
            - name: ENERGY_THRESH_DB
              value: "10"
            - name: RF_GAIN
              # Airspy Mini gain index (0–21). Overload-limited by local FM
              # broadcast: at 18 the 88–108 MHz band hit -11 dBFS and the 2m
              # floor rose ~1 dB per dB of gain. Measured 2026-10-27, NOAA WX
              # carrier SNR was 24 dB at 8 vs 18 dB at 18. Auto-squelch
              # re-learns the lower floor on its own.
              value: "8"
            - name: PPM_CORRECTION
              # Airspy Mini has factory-calibrated TCXO; PPM correction not needed
              value: "0"
          resources:
            requests:
              cpu: 750m
              memory: 1Gi
            limits:
              # 6 MS/s pipeline used the full 3-core limit and dropped samples
              # (airspy overflows); node-10 has 20 cores.
              cpu: 6000m
              memory: 4Gi
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - >-
                  python3 -c "import json,os,time,sys; p=f'/data/detections/sdr_heartbeat_{os.getenv(\"CAPTURE_ID\",\"default\")}.json'; ts=float(json.load(open(p)).get('timestamp', 0)); sys.exit(0 if time.time()-ts < 90 else 1)"
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - >-
                  python3 -c "import json,os,time,sys; p=f'/data/detections/sdr_heartbeat_{os.getenv(\"CAPTURE_ID\",\"default\")}.json'; ts=float(json.load(open(p)).get('timestamp', 0)); sys.exit(0 if time.time()-ts < 90 else 1)"
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: artifacts
              mountPath: /data
            - name: scripts
              mountPath: /scripts
            - name: dshm
              mountPath: /dev/shm
            - name: usb
              mountPath: /dev/bus/usb
      terminationGracePeriodSeconds: 20
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: sdr-artifacts-rwx
        - name: scripts
          configMap:
            name: unified-sdr-scripts
            defaultMode: 0755
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: usb
          hostPath:
            path: /dev/bus/usb
