# General-purpose RTL on node-13: UHF ham, 1.25m, and VHF emergency scans.
# The separate serial 1090 receiver belongs to ADS-B and is excluded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-sdr-70cm
  namespace: sdr-research
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unified-sdr-70cm
  template:
    metadata:
      labels:
        app: unified-sdr-70cm
    spec:
      # Keep DSP on the Spark, using capacity freed by the old pager consumer.
      # USB remains on node-13; this client reaches it over RTL TCP.
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: rke2-node-10
      initContainers:
        - name: wait-for-rtl-tcp
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["/bin/sh", "-c",
            "until nc -z rtl-tcp.sdr-research.svc.cluster.local 1234; do echo 'waiting for rtl_tcp...'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: unified-sdr-70cm
          image: librespace/gnuradio
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/bin/bash", "-c", "python3 -u /scripts/unified_sdr.py"]
          env:
            - name: CAPTURE_DEVICE_SERIAL
              value: "00000001"
            - name: AUTO_SQUELCH_MIN_DB
              value: "-85"
            - name: CW_RECORD_BANDS_HZ
              value: "432000000-432100000"
            - name: FM_RECORD_BANDS_HZ
              # FM ham and the VHF emergency window; no weather scan.
              value: "433000000-450000000,222000000-225000000,153800000-156100000"
            - name: CAPTURE_SOURCE
              # Generic R820T serial 00000001 on node-13; never serial 1090.
              value: "rtl-70cm"
            - name: RTL_TCP_HOST
              value: "rtl-tcp.sdr-research.svc.cluster.local"
            - name: RTL_TCP_PORT
              value: "1234"
            - name: CAPTURE_ID
              value: "70cm"
            - name: FIXED_MONITOR_HZ
              # K8DV Owensville 443.450 (analog FM, ~18 km)
              value: "443450000"
            - name: SAMPLE_RATE
              value: "2400000"
            - name: DWELL_CENTER_HZ
              # 443.5 MHz covers ~442.3-444.7: most local 70cm repeater outputs
              # (RepeaterBook: 10 within 40 km, all 442-445). 432 had none.
              value: "443500000"
            - name: SCAN_CENTERS
              # Cover remaining 70cm outputs/simplex, weak-signal CW, 1.25m, and VHF emergency.
              value: "[441250000, 445500000, 447500000, 449000000, 432500000, 224000000, 155000000]"
            - name: DWELL_SEC
              value: "60"
            - name: RF_SETTLE_SEC
              value: "2.0"
            - name: SCAN_SEC
              value: "12"
            - name: NUM_DYN_FM
              value: "8"
            - name: NUM_DYN_CW
              value: "4"
            - name: SLOT_RECYCLE_SEC
              value: "300"
            - name: CLEAR_SLOTS_ON_RETUNE
              value: "true"
            - name: SQUELCH_OPEN_DB
              value: "-55"
            - name: SQUELCH_CLOSE_DB
              value: "-60"
            - name: RF_SQUELCH_DB
              value: "-55"
            - name: NOISE_GUARD_ROLLOVERS
              # Deactivate + blocklist a channel after this many consecutive
              # max-duration rollovers (spur signature: squelch never drops).
              value: "3"
            - name: NOISE_GUARD_COOLDOWN_SEC
              value: "1800"
            - name: NOISE_DISCARD_RMS_DB
              # Demodulated FM noise is full-scale audio; real voice averages
              # far below. Discard-on-close backstop (also forces this pod to
              # roll onto the AutoSquelch configmap script).
              value: "-9"
            - name: TAIL_SEC
              value: "1.5"
            - name: MIN_REC_SEC
              value: "0.5"
            - name: MAX_REC_SEC
              value: "120"
            - name: FFT_SIZE
              # 146 Hz bins resolve CW within its 200 Hz channel filter.
              value: "16384"
            - name: FFT_INTERVAL
              value: "1.0"
            - name: ENERGY_THRESH_DB
              value: "10"
            - name: RF_GAIN
              # 40 dB for 70cm: compensates for RTL-SDR's ~4 dB worse noise figure at 432 vs 145 MHz
              value: "40"
            - name: PPM_CORRECTION
              # Use this receiver's setting, not the former Blog V4 calibration.
              value: "0"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - >-
                  python3 -c "import json,os,time,sys; p=f'/data/detections/sdr_heartbeat_{os.getenv(\"CAPTURE_ID\",\"default\")}.json'; ts=float(json.load(open(p)).get('timestamp', 0)); sys.exit(0 if time.time()-ts < 90 else 1)"
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - >-
                  python3 -c "import json,os,time,sys; p=f'/data/detections/sdr_heartbeat_{os.getenv(\"CAPTURE_ID\",\"default\")}.json'; ts=float(json.load(open(p)).get('timestamp', 0)); sys.exit(0 if time.time()-ts < 90 else 1)"
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: artifacts
              mountPath: /data
            - name: scripts
              mountPath: /scripts
            - name: dshm
              mountPath: /dev/shm
      terminationGracePeriodSeconds: 20
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: sdr-artifacts-rwx
        - name: scripts
          configMap:
            name: unified-sdr-scripts
            defaultMode: 0755
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
