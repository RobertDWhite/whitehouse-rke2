# Third unified-sdr instance on the otherwise idle RTL-SDR serial 00000001
# (rtl-tcp service, port 1234, dongle on rke2-node-13). Dwells on 1.25m and
# hops to NOAA WX/marine and VHF public safety. Runs on node-10 (nodes 11/13
# are full on CPU requests); it only needs the network to reach rtl_tcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-sdr-pager
  namespace: sdr-research
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unified-sdr-pager
  template:
    metadata:
      labels:
        app: unified-sdr-pager
    spec:
      # node-10 is tainted dedicated=llm:NoSchedule; unified-sdr runs there too.
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: rke2-node-10
      containers:
        - name: unified-sdr-pager
          image: librespace/gnuradio
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/bin/bash", "-c", "python3 -u /scripts/unified_sdr.py"]
          env:
            - name: RTL_TCP_HOST
              value: "rtl-tcp.sdr-research.svc.cluster.local"
            - name: RTL_TCP_PORT
              value: "1234"
            - name: CAPTURE_ID
              value: "pager"
            - name: FIXED_MONITOR_HZ
              # K8YOJ Batavia 224.000 (~11 km)
              value: "224000000"
            - name: SAMPLE_RATE
              value: "2400000"
            - name: DWELL_CENTER_HZ
              # 223.6 MHz covers ~222.4-224.8: 1.25m repeaters (5 within 55 km)
              value: "223600000"
            - name: SCAN_CENTERS
              # 162.0 (160.8-163.2: NOAA WX + marine) and 155.0 (153.8-156.2:
              # VHF public safety + pager)
              value: "[162000000, 155000000]"
            - name: FM_RECORD_BANDS_HZ
              # Default stops at 162.0 MHz and would miss NOAA WX (162.40-162.55).
              value: "150000000-162600000,222000000-225000000"
            - name: DWELL_SEC
              value: "60"
            - name: SCAN_SEC
              value: "8"
            - name: NUM_DYN_FM
              value: "8"
            - name: NUM_DYN_CW
              value: "2"
            - name: SLOT_RECYCLE_SEC
              value: "300"
            - name: CLEAR_SLOTS_ON_RETUNE
              value: "true"
            - name: SQUELCH_OPEN_DB
              # Raised from -55: public safety channels have constant carrier;
              # need higher threshold to only trigger on voice modulation
              value: "-35"
            - name: SQUELCH_CLOSE_DB
              value: "-40"
            - name: RF_SQUELCH_DB
              value: "-35"
            - name: TAIL_SEC
              value: "1.5"
            - name: MIN_REC_SEC
              value: "0.5"
            - name: MAX_REC_SEC
              value: "120"
            - name: FFT_SIZE
              value: "4096"
            - name: FFT_INTERVAL
              value: "1.0"
            - name: ENERGY_THRESH_DB
              value: "10"
            - name: RF_GAIN
              value: "40"
            - name: PPM_CORRECTION
              value: "0"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - >-
                  python3 -c "import json,os,time,sys; p=f'/data/detections/sdr_heartbeat_{os.getenv(\"CAPTURE_ID\",\"default\")}.json'; ts=float(json.load(open(p)).get('timestamp', 0)); sys.exit(0 if time.time()-ts < 90 else 1)"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - >-
                  python3 -c "import json,os,time,sys; p=f'/data/detections/sdr_heartbeat_{os.getenv(\"CAPTURE_ID\",\"default\")}.json'; ts=float(json.load(open(p)).get('timestamp', 0)); sys.exit(0 if time.time()-ts < 90 else 1)"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: artifacts
              mountPath: /data
            - name: scripts
              mountPath: /scripts
            - name: dshm
              mountPath: /dev/shm
      terminationGracePeriodSeconds: 20
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: sdr-artifacts-rwx
        - name: scripts
          configMap:
            name: unified-sdr-scripts
            defaultMode: 0755
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
