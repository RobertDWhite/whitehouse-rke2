apiVersion: apps/v1
kind: Deployment
metadata:
  name: cw-decoder
  namespace: sdr-research
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cw-decoder
  template:
    metadata:
      annotations:
        sdr-research/cw-timing: "dot-dash-clusters-v2"
      labels:
        app: cw-decoder
    spec:
      # This decoder reads recordings from the shared RWX volume; it has no
      # USB dependency and must remain schedulable during node maintenance.
      restartPolicy: Always
      containers:
        - name: cw-decoder
          image: python:3.13-slim-trixie@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: MIN_FILE_AGE_SEC
              value: "15"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "tr '\\000' ' ' </proc/1/cmdline | grep -q cw_decode.py"
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "tr '\\000' ' ' </proc/1/cmdline | grep -q cw_decode.py"
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: artifacts
              mountPath: /data
            - name: scripts
              mountPath: /scripts
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting Python CW decoder"
              exec python3 /scripts/cw_decode.py
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: sdr-artifacts-rwx
        - name: scripts
          configMap:
            name: cw-decoder-scripts
            defaultMode: 0755
