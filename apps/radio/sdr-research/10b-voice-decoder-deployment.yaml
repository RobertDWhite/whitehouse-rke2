apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-decoder
  namespace: sdr-research
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: voice-decoder
  template:
    metadata:
      labels:
        app: voice-decoder
    spec:
      # Retain the ARM64 worker placement; inference runs remotely on the 5090.
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: rke2-node-10
      containers:
        - name: voice-decoder
          image: registry.internal.white.fm/sdr-whisper-cuda:0.1.1
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TZ
              value: UTC
            - name: TRANSCRIPTION_BASE_URL
              value: "http://nemotron-transcribe.riffado.svc.cluster.local/v1"
            - name: TRANSCRIPTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sdr-viewer-secrets
                  key: nemotron-api-key
            - name: TRANSCRIPTION_TIMEOUT_SEC
              value: "3600"
            - name: MIN_FILE_AGE_SEC
              value: "120"
            - name: MIN_STABLE_SEC
              value: "30"
            - name: RETRY_EMPTY_TRANSCRIPTS
              value: "true"
          volumeMounts:
            - name: artifacts
              mountPath: /data
            - name: scripts
              mountPath: /scripts
          command:
            - python3
            - /scripts/transcribe.py
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: sdr-artifacts-rwx
        - name: scripts
          configMap:
            name: voice-decoder-scripts
            defaultMode: 0755
