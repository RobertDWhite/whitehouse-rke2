apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mastodon

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 03-pvc.yaml
  - 04-deployment-web.yaml
  - 05-deployment-streaming.yaml
  - 06-deployment-sidekiq.yaml
  - 07-service-web.yaml
  - 08-service-streaming.yaml
  - 09-postgres.yaml
  - 10-redis.yaml
  - 11-elasticsearch.yaml
  - 09b-postgres-exporter.yaml
  - 10b-redis-exporter.yaml

generators:
  - ksops.yaml

images:
  - name: ghcr.io/mastodon/mastodon
    newTag: "v4.7.6"
  - name: ghcr.io/mastodon/mastodon-streaming
    newTag: "v4.7.6"
  - name: postgres
    newTag: "15@sha256:868b5ee219026c0f34c99d696d4494ccb3705cf1a18bed1e0b9de64d9c011ccd"
  - name: redis
    newTag: "8@sha256:56a1737794e36c3ebe8a4544a8ab421af3ab1a6488fb2238aec228c404933fed"
  - name: quay.io/prometheuscommunity/postgres-exporter
    newTag: "v0.21.1"
  - name: oliver006/redis_exporter
    newTag: "v1.99.0"
