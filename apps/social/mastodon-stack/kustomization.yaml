apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mastodon

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 03-pvc.yaml
  - 04-deployment-web.yaml
  - 05-deployment-streaming.yaml
  - 06-deployment-sidekiq.yaml
  - 07-service-web.yaml
  - 08-service-streaming.yaml
  - 09-postgres.yaml
  - 10-redis.yaml
  - 11-elasticsearch.yaml
  - 09b-postgres-exporter.yaml
  - 10b-redis-exporter.yaml

generators:
  - ksops.yaml

images:
  - name: ghcr.io/mastodon/mastodon
    newTag: "v4.7.6"
  - name: ghcr.io/mastodon/mastodon-streaming
    newTag: "v4.7.6"
  - name: postgres
    newTag: "15@sha256:91b9edc40277faf94bc1e3d7ae621b185fa70f3099b94309c4731a8296114870"
  - name: redis
    newTag: "8@sha256:ca1cb6df9313d0186b68f19b60fc2802e0c76e8542b2c05650b560e7bbb3cc8f"
  - name: quay.io/prometheuscommunity/postgres-exporter
    newTag: "v0.21.1"
  - name: oliver006/redis_exporter
    newTag: "v1.99.0"
