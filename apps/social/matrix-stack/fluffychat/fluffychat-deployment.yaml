apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluffychat
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluffychat
  template:
    metadata:
      labels:
        app: fluffychat
    spec:
      initContainers:
        - name: fetch-web-bundle
          image: busybox:1.38
          command:
            - sh
            - -ec
            - |
              wget -q --no-check-certificate -O /tmp/fluffychat-web.tar.gz https://github.com/krille-chan/fluffychat/releases/download/v2.9.1/fluffychat-web.tar.gz
              echo '6c9f5e4512e1f5d7dc33ea97dae9e583423ff9caa66cadbf2cf8a0729f85021c  /tmp/fluffychat-web.tar.gz' | sha256sum -c -
              tar -xzf /tmp/fluffychat-web.tar.gz --strip-components=2 -C /web
              sed -i 's|<base href="/web/">|<base href="/">|' /web/index.html
              cp /config/config.json /web/config.json
          volumeMounts:
            - name: web
              mountPath: /web
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: fluffychat
          image: nginx:1.31-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web
          emptyDir: {}
        - name: config
          configMap:
            name: fluffychat-config
