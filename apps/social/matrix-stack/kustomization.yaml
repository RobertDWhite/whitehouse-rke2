apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:

  # Element
  - element/element-configmap.yaml
  - element/element-deployment.yaml
  - element/element-service.yaml

  # Alternative Matrix clients
  - cinny/cinny-configmap.yaml
  - cinny/cinny-deployment.yaml
  - cinny/cinny-service.yaml
  - fluffychat/fluffychat-configmap.yaml
  - fluffychat/fluffychat-deployment.yaml
  - fluffychat/fluffychat-service.yaml

  # Namespace
  - ingress/ns.yaml

  # Maubot
  - maubot/maubot-watchdog-configmap.yaml
  - maubot/maubot-deployment.yaml
#  - maubot/maubot-pvc.yaml
  - maubot/maubot-service.yaml

  # Postgres
#  - postgres/postgres-pvc.yaml
  - postgres/postgres-service.yaml
  - postgres/postgres-statefulset.yaml
  - postgres/postgres-exporter.yaml

  # Projects - Postfix
  - projects/postfix/postfix-service.yaml
  - projects/postfix/postfix.yaml

  # Redis
#  - redis/redis-pvc.yaml
  - redis/redis-service.yaml
  - redis/redis-statefulset.yaml
  - redis/redis-exporter.yaml

  # Synapse
  - synapse/synapse-configmap.yaml
  - synapse/synapse-deployment.yaml
#  - synapse/synapse-pvc.yaml
  - synapse/synapse-service.yaml

  # Hookshot (replaces matrix-encrypted-webhooks)
  - hookshot/hookshot-configmap.yaml
  - hookshot/hookshot-deployment.yaml
  - hookshot/hookshot-pvc.yaml
  - hookshot/hookshot-service.yaml
  
  # Well-known
  - well-known/configmap.yaml
  - well-known/deployment.yaml
  - well-known/service.yaml

generators:
  - ksops-secret.yaml

images:
  # Maubot
  - name: dock.mau.dev/maubot/maubot
    newTag: "v0.6.0"

  # Element Web
  - name: vectorim/element-web
    newTag: "v1.12.35"

  # Redis
  - name: redis
    newTag: "8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53"

  # Postgres
  - name: postgres
    newTag: "15@sha256:5a407822929c3789ff5154d3d35bd7e2090318149344c8a3d4ca942b035822ed"

  # Synapse
  # v1.164.1 (2026-11-04): the v1.160.0 hold is lifted. Hookshot 7.5.0+ ships
  # matrix-org/matrix-hookshot#1398 (bot-sdk sends the stable device_id), so it
  # works with Synapse >= 1.161. Deploy together with the hookshot 7.6.0 bump.
  # Rollback to v1.160.0 is only safe while the DB schema version is unchanged;
  # check synapse's schema_version table before downgrading.
  - name: matrixdotorg/synapse
    newTag: "v1.165.0@sha256:673b4223c81a7634fd07d832b939a58f97081cfdaae7cdd2d1664cdcf7611b62"

  # NGINX
  - name: nginx
    newTag: "1.31-alpine"

  # Init containers / utilities
  - name: busybox
    newTag: "1.38"
  - name: bitnami/kubectl
    # Upstream only moves :latest; pinned to the digest already running.
    newTag: "latest@sha256:8919c149c2e3d6860e0143c117900e64d71395172aaef0e01e604bb98c8e7ce0"
  # Upstream stopped publishing halfshot/matrix-hookshot on Docker Hub at 7.3.3;
  # releases are versioned on ghcr.io/matrix-org/matrix-hookshot. Pin version+digest.
  - name: ghcr.io/matrix-org/matrix-hookshot
    newTag: "7.6.2@sha256:808f75ffb2782a7b8ecb993ea1aaaf2b355c3ea7797b1f6a73f4a917d8de98e9"
  - name: juanluisbaptiste/postfix
    newTag: "alpine"
  - name: quay.io/prometheuscommunity/postgres-exporter
    newTag: "v0.20.1"
  - name: oliver006/redis_exporter
    newTag: "v1.97.0"
