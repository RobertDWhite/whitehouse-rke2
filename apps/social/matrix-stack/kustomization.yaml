apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:

  # Element
  - element/element-configmap.yaml
  - element/element-deployment.yaml
  - element/element-service.yaml

  # Alternative Matrix clients
  - cinny/cinny-configmap.yaml
  - cinny/cinny-deployment.yaml
  - cinny/cinny-service.yaml
  - fluffychat/fluffychat-configmap.yaml
  - fluffychat/fluffychat-deployment.yaml
  - fluffychat/fluffychat-service.yaml

  # Namespace
  - ingress/ns.yaml

  # Maubot
  - maubot/maubot-deployment.yaml
#  - maubot/maubot-pvc.yaml
  - maubot/maubot-service.yaml

  # Postgres
#  - postgres/postgres-pvc.yaml
  - postgres/postgres-service.yaml
  - postgres/postgres-statefulset.yaml
  - postgres/postgres-exporter.yaml

  # Projects - Postfix
  - projects/postfix/postfix-service.yaml
  - projects/postfix/postfix.yaml

  # Redis
#  - redis/redis-pvc.yaml
  - redis/redis-service.yaml
  - redis/redis-statefulset.yaml
  - redis/redis-exporter.yaml

  # Synapse
  - synapse/synapse-configmap.yaml
  - synapse/synapse-deployment.yaml
#  - synapse/synapse-pvc.yaml
  - synapse/synapse-service.yaml

  # Hookshot (replaces matrix-encrypted-webhooks)
  - hookshot/hookshot-configmap.yaml
  - hookshot/hookshot-deployment.yaml
  - hookshot/hookshot-pvc.yaml
  - hookshot/hookshot-service.yaml
  
  # Well-known
  - well-known/configmap.yaml
  - well-known/deployment.yaml
  - well-known/service.yaml

generators:
  - ksops-secret.yaml

images:
  # Maubot
  - name: dock.mau.dev/maubot/maubot
    newTag: "v0.6.0"

  # Element Web
  - name: vectorim/element-web
    newTag: "v1.12.29"

  # Redis
  - name: redis
    newTag: "8@sha256:718f745deb7dfefeac6eed7041fc7ec9476b50e61b247932682457c41adafa0e"

  # Postgres
  - name: postgres
    newTag: "15@sha256:724292da1f2e50bdccfc3302ce75bbba7f4a6076701b588cc795fcac65683550"

  # Synapse
  # HOLD at v1.160.0 (2026-09-20): v1.161.0 removed the unstable
  # org.matrix.msc3202.device_id appservice masquerading parameter, and hookshot
  # (bot-sdk 0.8.0-element.3) still sends only that -> crash loop
  # "Encryption not possible: server not revealing device ID".
  # Unpin once https://github.com/matrix-org/matrix-hookshot/issues/1398 ships.
  # Schema version is 94 on both releases, so the rollback is safe.
  - name: matrixdotorg/synapse
    newTag: "v1.160.0@sha256:78de1d10bef02e375f861d1cc99f8bedd9381d4f9083ea8b2c22a053477b205f"

  # NGINX
  - name: nginx
    newTag: "1.31-alpine"

  # Init containers / utilities
  - name: busybox
    newTag: "1.38"
  - name: bitnami/kubectl
    newTag: "latest"
  # Pinned by digest (2026-09-20): the upstream only publishes rolling tags and a
  # silent :latest change is what surfaced the missing E2EE homeserver flags.
  - name: halfshot/matrix-hookshot
    newTag: "latest@sha256:8e6c1f9d2a949bb1025f01bf175ab9dde7e6650d39aa8781f3837d40af5b3484"
  - name: juanluisbaptiste/postfix
    newTag: "alpine"
  - name: quay.io/prometheuscommunity/postgres-exporter
    newTag: "v0.20.1"
  - name: oliver006/redis_exporter
    newTag: "v1.92.0"
