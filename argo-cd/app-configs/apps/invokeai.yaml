name: invokeai
namespace: invokeai
srcPath: apps/ai/invokeai
kustomize: {}
syncOptions:
- CreateNamespace=true
# invokeai is scaled up by hand when wanted; keep Argo off its replicas.
- RespectIgnoreDifferences=true
ignoreDifferences:
- group: apps
  kind: Deployment
  name: invokeai
  namespace: invokeai
  jsonPointers:
  - /spec/replicas
