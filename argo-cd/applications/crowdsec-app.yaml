apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
spec:
  project: security
  sources:
    - repoURL: git@github.com:RobertDWhite/whitehouse-rke2.git
      targetRevision: main
      path: security/crowdsec
      kustomize: {}
    - chart: crowdsec
      repoURL: https://crowdsecurity.github.io/helm-charts
      targetRevision: 0.24.2
      helm:
        values: |
          agent:
            acquisition:
            - namespace: kube-system
              podName: rke2-ingress-nginx-controller-*
              program: nginx
            - namespace: envoy-gateway-system
              podName: envoy-envoy-gateway-system-main-*
              program: envoy
            env:
            - name: COLLECTIONS
              value: crowdsecurity/linux crowdsecurity/nginx crowdsecurity/base-http-scenarios
                crowdsecurity/http-cve
            - name: PARSERS
              value: crowdsecurity/cri-logs crowdsecurity/dateparse-enrich crowdsecurity/docker-logs
                crowdsecurity/geoip-enrich crowdsecurity/http-logs crowdsecurity/nginx-logs
                crowdsecurity/sshd-logs crowdsecurity/syslog-logs crowdsecurity/whitelists
            tolerations:
            - effect: NoSchedule
              key: dedicated
              operator: Exists
          config:
            config.yaml.local: |
              api:
                server:
                  auto_registration:
                    enabled: true
                    token: $CS_LAPI_REGISTRATION_TOKEN
                    allowed_ranges:
                      - 10.42.0.0/16
                      - 10.43.0.0/16
                      - 10.99.5.0/24
            profiles.yaml: |
              name: default_ip_remediation
              filters:
                - Alert.Remediation == true && Alert.GetScope() == "Ip"
              decisions:
                - type: ban
                  duration: 4h
              notifications:
                - http_default
              on_success: break
            notifications:
              http.yaml: |
                type: http
                name: http_default
                log_level: info
                format: |
                  {{- range $Alert := . -}}
                  {{- range .Decisions -}}
                  {"streams":[{"stream":{"job":"crowdsec_decisions","source":"rke2-whitehouse"},"values":[[  "{{ now | unixEpoch }}000000000","country={{ $Alert.Source.Cn }} asname={{ $Alert.Source.AsName }} asnumber={{ $Alert.Source.AsNumber }} lat={{ $Alert.Source.Latitude }} lon={{ $Alert.Source.Longitude }} iprange={{ $Alert.Source.Range }} scenario={{ .Scenario }} type={{ .Type }} duration={{ .Duration }} scope={{ .Scope }} ip={{ .Value }}"]]}]}
                  {{ end -}}
                  {{- end -}}
                url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
                method: POST
                headers:
                  Content-Type: application/json
            parsers:
              s01-parse:
                envoy-json.yaml: |
                  filter: evt.Parsed.program == 'envoy'
                  onsuccess: next_stage
                  name: local/envoy-json
                  description: Envoy Gateway JSON logs; source address only, never client-supplied XFF
                  nodes:
                  - filter: TrimSpace(evt.Parsed.message) startsWith "{" && UnmarshalJSON(evt.Parsed.message,
                      evt.Unmarshaled, "envoy") in ["", nil]
                    statics:
                    - parsed: time
                      expression: evt.Unmarshaled.envoy.start_time
                    - parsed: raw_remote_addr
                      expression: evt.Unmarshaled.envoy.downstream_remote_address
                    - parsed: remote_addr
                      expression: |
                        let address = evt.Unmarshaled.envoy.downstream_remote_address ?? '';
                        let last_colon = lastIndexOf(address, ':');
                        let addr = last_colon >= 0 ? address[:last_colon] : address;
                        TrimPrefix(TrimSuffix(addr, "]"), "[")
                    - parsed: request
                      expression: evt.Unmarshaled.envoy["x-envoy-origin-path"]
                    - parsed: verb
                      expression: evt.Unmarshaled.envoy.method
                    - parsed: status
                      expression: 'evt.Unmarshaled.envoy.response_code != nil ? int(evt.Unmarshaled.envoy.response_code)
                        : nil'
                    - parsed: http_user_agent
                      expression: evt.Unmarshaled.envoy["user-agent"]
                    - parsed: target_fqdn
                      expression: evt.Unmarshaled.envoy[":authority"]
                  statics:
                  - target: evt.StrTime
                    expression: evt.Parsed.time
                  - meta: service
                    value: http
                  - meta: log_type
                    value: http_access-log
                  - meta: source_ip
                    expression: evt.Parsed.remote_addr
                  - meta: http_path
                    expression: evt.Parsed.request
                  - meta: http_verb
                    expression: evt.Parsed.verb
                  - meta: http_status
                    expression: evt.Parsed.status
                  - meta: http_user_agent
                    expression: evt.Parsed.http_user_agent
                  - meta: target_fqdn
                    expression: evt.Parsed.target_fqdn
          container_runtime: containerd
          image:
            tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
          lapi:
            dashboard:
              enabled: false
            env:
            - name: COLLECTIONS
              value: crowdsecurity/linux crowdsecurity/sshd
            - name: POSTOVERFLOWS
              value: crowdsecurity/cdn-whitelist crowdsecurity/rdns crowdsecurity/seo-bots-whitelist
            - name: ENROLL_KEY
              valueFrom:
                secretKeyRef:
                  key: ENROLL_KEY
                  name: crowdsec-enroll
            - name: ENROLL_INSTANCE_NAME
              valueFrom:
                secretKeyRef:
                  key: ENROLL_INSTANCE_NAME
                  name: crowdsec-enroll
            - name: CS_LAPI_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  key: registrationToken
                  name: crowdsec-lapi-credentials
            metrics:
              enabled: true
              serviceMonitor:
                enabled: false
            persistentVolume:
              config:
                enabled: true
                size: 100Mi
                storageClassName: longhorn
              data:
                enabled: true
                size: 2Gi
                storageClassName: longhorn
          secrets:
            externalSecret:
              name: crowdsec-lapi-credentials
              csLapiSecretKey: csLapiSecret
              registrationTokenKey: registrationToken
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
