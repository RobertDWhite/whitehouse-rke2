apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: git@github.com:RobertDWhite/whitehouse-rke2.git
    targetRevision: main
    path: apps/misc/fleet
    kustomize:
      commonAnnotations:
        argocd.argoproj.io/sync-wave: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ServerSideApply without ServerSideDiff makes Argo diff the live object
      # (which the API server has defaulted and which Envoy Gateway's webhook
      # annotates) against the bare manifest, so both fleet HTTPRoutes report a
      # permanent spurious diff. ServerSideDiff runs the diff through the API
      # server's dry-run apply so defaulted fields are not counted as drift.
      - ServerSideDiff=true
