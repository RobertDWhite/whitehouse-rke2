apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeschool
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: git@github.com:RobertDWhite/homeschool-app.git
    targetRevision: main
    path: deploy/rke2
  destination:
    server: https://kubernetes.default.svc
    namespace: homeschool
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
