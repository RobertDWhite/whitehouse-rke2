apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: invokeai
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: git@github.com:RobertDWhite/whitehouse-rke2.git
    targetRevision: main
    path: apps/ai/invokeai
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: invokeai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # invokeai is scaled up by hand when wanted; keep Argo off its replicas.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: invokeai
      namespace: invokeai
      jsonPointers:
        - /spec/replicas
