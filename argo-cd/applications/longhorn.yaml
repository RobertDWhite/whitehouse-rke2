apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    # Pinned to the running version: Longhorn cannot skip minor versions, so
    # 1.10 -> 1.13 failed its pre-upgrade hook. Upgrade one minor at a time.
    targetRevision: 1.10.1
    helm:
      values: |
        preUpgradeChecker:
          job:
            enabled: false
        csi:
          attacherReplicaCount: 1
          provisionerReplicaCount: 1
          resizerReplicaCount: 1
          snapshotter:
            enabled: true
        defaultSettings:
          # nfsOptions is required: the NAS serves NFSv4.1 only (nfs_minor_ver_enable=1),
          # while Longhorn defaults to nfsvers=4.0 and the mount fails. The backup store is
          # also mounted from the instance-manager POD netns (not hostNetwork), so
          # /volume1/longhorn-backups must be exported to the 10.42.0.0/16 pod CIDR on the
          # NAS as well -- without both, every backup and restore fails.
          backupTarget: nfs://10.100.1.20:/volume1/longhorn-backups?nfsOptions=nfsvers=4.1,soft,timeo=300,retry=2
          # Applies to Longhorn's system-managed components (CSI node plugin,
          # engine images, instance managers). node-10 is tainted
          # dedicated=llm:NoSchedule (reserved for the vLLM server) but keeps
          # Longhorn replicas and the PVCs of the pods still pinned there, so
          # every component must tolerate it. Changing this restarts the CSI
          # plugin and engine images; instance managers pick it up once idle.
          # (node-14's old kube-vip=disabled taint was removed 2026-10-13.)
          taintToleration: dedicated:NoSchedule
          # The Immich disk (/mnt/longhorn-immich-20tb on node-14, tagged immich-media
          # and immich-photos) is Immich-only. node-11's Immich disk was evicted and
          # disabled 2026-10-14. Longhorn's default lets a
          # volume with no disk selector use any disk, tagged or not, so general
          # volumes (small databases included) ended up on those HDDs and every write
          # waited on them. false = untagged volumes only use untagged disks.
          allowEmptyDiskSelectorVolume: false
          # Rebuild missing replicas of detached volumes too, instead of waiting for
          # their next attach (used when moving replicas off the Immich disks).
          offlineReplicaRebuilding: '{"v1":"true","v2":"false"}'
          # Thin provisioning: Longhorn schedules by provisioned size, and Immich's
          # two 10 TiB volumes (1.9 + 4.4 TiB actually used) would not otherwise fit
          # on node-14's 17 TiB disk. Real usage is still guarded by
          # storage-minimal-available-percentage (25% free).
          storageOverProvisioningPercentage: 200
        # The manager DaemonSet is user-deployed, so it needs the toleration
        # in its own spec as well.
        longhornManager:
          tolerations:
            - key: dedicated
              operator: Exists
              effect: NoSchedule
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipHooks=true
