apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ombi-security
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: git@github.com:RobertDWhite/whitehouse-rke2.git
    targetRevision: main
    path: apps/misc/ombi-security
  destination:
    server: https://kubernetes.default.svc
    namespace: ombi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
