apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riffado
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: git@github.com:RobertDWhite/whitehouse-rke2.git
    targetRevision: main
    path: apps/ai/riffado
  destination:
    server: https://kubernetes.default.svc
    namespace: riffado
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # vibevoice is scaled up by hand for a transcription; keep Argo off its replicas.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: vibevoice
      namespace: riffado
      jsonPointers:
        - /spec/replicas
