apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-archive
  namespace: argocd
spec:
  project: security
  source:
    repoURL: git@github.com:RobertDWhite/whitehouse-rke2.git
    targetRevision: main
    path: security/trivy-archive
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
