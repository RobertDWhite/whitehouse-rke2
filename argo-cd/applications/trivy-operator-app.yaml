apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: security
  source:
    chart: trivy-operator
    repoURL: https://aquasecurity.github.io/helm-charts/
    targetRevision: 0.37.0
    helm:
      values: |
        # Reserved for isolated operator acceptance; contains no production workloads.
        excludeNamespaces: trivy-upgrade-canary
        image:
          registry: ghcr.io
          repository: robertdwhite/trivy-operator-security
          tag: sha-725e0fe4137ae85084a49595aa692e9d612bdc7e@sha256:9de32e7e34a5129d3a5fde7bbb5d1b92a6a5f4229faa910ee85b3a22031cbfe1

        # Only verified workers receive this label after the tracked kubelet drop-in.
        trivyOperator:
          scanJobNodeSelector:
            security.white.fm/scan-log-retention: 64Mi

        # Reload cached scanJob configuration when placement changes.
        podAnnotations:
          security.white.fm/scan-config-revision: "20261026-retention-pool-v1"

        operator:
          # Keep new SBOM generation separate from the compatibility rollout.
          sbomGenerationEnabled: false
          scanJobsConcurrentLimit: 5
          scanJobTimeout: 10m
          vulnerabilityScannerEnabled: true
          configAuditScannerEnabled: true
          rbacAssessmentScannerEnabled: true
          exposedSecretScannerEnabled: true
          infraAssessmentScannerEnabled: true
          clusterComplianceEnabled: true
          metricsFindingsEnabled: true
          # Duplicate per-CVE label sets in 0.28.0 break the entire scrape (500).
          # Full findings remain in reports/archives; retain aggregate metrics.
          metricsVulnIdEnabled: false

        # Explicit pod env overrides the chart's ConfigMap default and triggers
        # a rollout when changed; envFrom alone left the old process unchanged.
        # Retained completed jobs count toward scanJobsConcurrentLimit, so the
        # TTL caps throughput. Keep it short: trivy-archive polls every 30s.
        extraEnv:
          - name: OPERATOR_SCAN_JOB_TTL
            value: "2m"
          - name: OPERATOR_METRICS_VULN_ID_ENABLED
            value: "false"

        trivy:
          # Scan containers share the downloaded DB but must not share a BoltDB lock.
          configFile:
            cache:
              backend: memory
          image:
            registry: mirror.gcr.io
            repository: aquasec/trivy
            tag: 0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          # Retain all findings; full raw reports are archived privately.
          # A string is required: chart `with` omits boolean false, retaining stale data.
          ignoreUnfixed: "false"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          slow: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        compliance:
          cron: "0 */6 * * *"
          reportType: summary

        # Prometheus uses the existing static scrape; no ServiceMonitor CRD.
        serviceMonitor:
          enabled: false

        nodeSelector:
          kubernetes.io/arch: amd64
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
