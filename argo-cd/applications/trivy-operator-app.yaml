apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: security
  source:
    chart: trivy-operator
    repoURL: https://aquasecurity.github.io/helm-charts/
    targetRevision: 0.30.0
    helm:
      values: |
        # Keep the upgrade canary exclusively owned by its candidate operator.
        excludeNamespaces: "trivy-upgrade-canary"

        operator:
          scanJobsConcurrentLimit: 5
          scanJobTimeout: 10m
          vulnerabilityScannerEnabled: true
          configAuditScannerEnabled: true
          rbacAssessmentScannerEnabled: true
          exposedSecretScannerEnabled: true
          infraAssessmentScannerEnabled: true
          clusterComplianceEnabled: true
          metricsFindingsEnabled: true
          # Duplicate per-CVE label sets in 0.28.0 break the entire scrape (500).
          # Full findings remain in reports/archives; retain aggregate metrics.
          metricsVulnIdEnabled: false

        # Explicit pod env overrides the chart's ConfigMap default and triggers
        # a rollout when changed; envFrom alone left the old process unchanged.
        # Retained completed jobs count toward scanJobsConcurrentLimit, so the
        # TTL caps throughput. Keep it short: trivy-archive polls every 30s.
        extraEnv:
          - name: OPERATOR_SCAN_JOB_TTL
            value: "2m"
          - name: OPERATOR_METRICS_VULN_ID_ENABLED
            value: "false"

        trivy:
          ignoreUnfixed: true
          severity: "MEDIUM,HIGH,CRITICAL"
          slow: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        compliance:
          cron: "0 */6 * * *"
          reportType: summary

        serviceMonitor:
          enabled: true

        nodeSelector:
          kubernetes.io/arch: amd64
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
