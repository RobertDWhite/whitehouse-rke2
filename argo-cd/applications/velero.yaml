apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  sources:
    # Secrets (SOPS / ksops)
    - repoURL: git@github.com:RobertDWhite/whitehouse-rke2.git
      targetRevision: main
      path: platform/storage/velero-secrets
    # Velero Helm chart
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.2.1
      helm:
        releaseName: velero
        values: |
          upgradeCRDs: false

          credentials:
            existingSecret: cloud-credentials

          configuration:
            uploaderType: kopia
            defaultVolumesToFsBackup: true
            backupStorageLocation:
              # The old MinIO location ("default") was removed on 2026-10-09:
              # MinIO on the NAS has refused connections since 2026-09-23 and
              # every backup it still listed was past its ttl or Failed. All
              # backups now live in Garage below.
              # Garage (dxflrs/garage) running as a Docker container on the NAS
              # at /volume1/docker/garage. Replaces MinIO, whose community
              # edition stopped shipping images in Oct 2025 and is now in
              # maintenance mode - the image on the NAS, RELEASE.2025-09-07, is
              # the last one that will ever exist. Added as a second location on
              # 2026-08-03 but left non-default, so every backup kept landing on
              # MinIO (39 of 40) until the flip below on 2026-08-20.
              - name: garage
                provider: aws
                bucket: velero-backup
                # THE default backup target as of 2026-08-20. Schedules do not
                # set storageLocation, so they inherit whichever location is
                # marked default here - which is what actually moves new
                # backups off MinIO.
                default: true
                config:
                  # Garage has no built-in TLS of its own, so an nginx sidecar on
                  # the NAS terminates TLS on :3900 with a Let's Encrypt cert for
                  # garage.internal.white.fm (DNS-01 via Cloudflare; the name is
                  # not public, which DNS-01 does not require). Because the cert
                  # name matches the name we connect to, this verifies for real -
                  # note the absence of insecureSkipTLSVerify, unlike the MinIO
                  # location above. garage.internal.white.fm resolves to the NAS
                  # via the Technitium zone secret (35-zones-secret.sops.yaml).
                  s3Url: https://garage.internal.white.fm:3900
                  s3ForcePathStyle: "true"
                  # Must match s3_region in the NAS garage.toml.
                  region: garage
                  # Selects the [garage] block in the cloud-credentials secret.
                  profile: garage
                  # velero-plugin-for-aws >=1.9.1 defaults to CRC32, which makes
                  # the AWS SDK v2 use STREAMING-...-TRAILER signing. Garage (like
                  # most non-AWS S3 implementations) rejects trailing checksums,
                  # so disable it. See velero-io/velero#8742.
                  checksumAlgorithm: ""
            # No volumeSnapshotLocation. `features: EnableCSI` is unset, so a VSL
            # with provider velero.io/csi resolves to nothing and every backup
            # logged "unable to get valid VolumeSnapshotter for velero.io/csi"
            # once per PVC (7 errors in the 2026-08-16 weekly run). Volume data
            # is protected by kopia file-system backup via
            # defaultVolumesToFsBackup above. To move to real CSI snapshots, set
            # features: EnableCSI (the CSI plugin is built into velero since
            # v1.14 -- do NOT add the old velero-plugin-for-csi initContainer,
            # it double-registers), then restore this block and flip
            # snapshotVolumes back on in the schedules.
            # Must be an explicit empty list: omitting the key falls back to the
            # chart default of one VSL with an empty provider, which the API
            # rejects ("spec.provider: Required value") and fails every sync.
            volumeSnapshotLocation: []

            # Since v1.14 kopia repository maintenance runs as one Job per
            # BackupRepository (~57) instead of inside the server, and those
            # Jobs have no resource limits by default. See the server
            # resources comment below for why maintenance memory matters.
            repositoryMaintenanceJob:
              repositoryConfigData:
                global:
                  podResources:
                    cpuRequest: 100m
                    cpuLimit: "1"
                    memoryRequest: 256Mi
                    memoryLimit: 2Gi

          deployNodeAgent: true

          # Since v1.17 fs-backup no longer runs inside node-agent: every
          # PodVolumeBackup gets its own data-mover pod, pinned (via nodeName)
          # to the node of the pod being backed up. Velero creates them all at
          # once by default, and on nodes near the 110 max-pods cap the kubelet
          # rejects the burst ("Node didn't have enough resource: pods") - on
          # 2026-10-08 only 5 of 62 daily-critical volumes made it. Cap how
          # many are prepared at a time, and allow 2 transfers per node so the
          # run finishes before pods churn ("error getting client pod ... not
          # found") or the itemOperationTimeout hits.
          # The chart names this ConfigMap velero-<key>.
          configMaps:
            node-agent-config:
              data:
                node-agent-config.json: |
                  {
                    "loadConcurrency": {
                      "globalConfig": 2
                    },
                    "prepareQueueLength": 6
                  }

          # Up to velero v1.13 kopia repository maintenance ran inside the
          # server process (it moved to the Jobs configured above in v1.14,
          # so this 4Gi limit can likely come down once that is proven). With ~40
          # BackupRepositories, maintenance loads large index sets into memory.
          # On 2026-08-03 every repo went overdue at once after the object store
          # had been unreachable for 16 days; the resulting concurrent
          # maintenance blew through the old 2Gi limit and the server was
          # OOMKilled (exit 137) three times in ~15 minutes. Backups running at
          # that moment fail with "Items backed up: 0" and NO entry in
          # status.errors, so the only tell is restartCount incrementing.
          # Requests stay at 1Gi so scheduling behaviour is unchanged.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi

          nodeAgent:
            extraArgs:
              - --node-agent-configmap=velero-node-agent-config
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 2Gi

          initContainers:
            - name: velero-plugin-for-aws
              image: velero/velero-plugin-for-aws:v1.14.4
              volumeMounts:
                - mountPath: /target
                  name: plugins

          metrics:
            enabled: true

            serviceMonitor:
              enabled: true
              autodetect: true
              additionalLabels:
                release: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
