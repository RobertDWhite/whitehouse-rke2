apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - image-updater-role.yaml
  - image-updater-rolebinding.yaml

generators:
  - ksops.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    # renovate: datasource=helm registryUrl=https://argoproj.github.io/argo-helm depName=argo-cd
    version: 10.11.6
    releaseName: argocd
    valuesFile: values/argocd-values.yaml
    namespace: argocd



patches:
  - path: server-networkpolicy-patch.yaml

# Argo v3.5.6 with patched application dependencies and bundled tools.
images:
  - name: quay.io/argoproj/argocd
    newName: ghcr.io/robertdwhite/argocd-security-runtime
    newTag: sha-2a20e755ec6e9005e85de9c0ec4431b851893eb9
    digest: sha256:9d07d6eb5fb796354a83cbd03868ba445910e347bbda91c261994d220dcdc3fb
