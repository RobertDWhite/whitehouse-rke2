apiVersion: apps/v1
kind: Deployment
metadata:
  name: myspeed
  namespace: myspeed
spec:
  replicas: 1
  # The data PVC is ReadWriteOnce; release it before starting a replacement.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: myspeed
  template:
    metadata:
      labels:
        app: myspeed
    spec:
      containers:
        - name: myspeed
          image: registry.internal.white.fm/myspeed:1.0.9-prebuilt@sha256:a928c9a77c9b8a5893621c469ae736d60cbc201f3270a9d011975e75ce999450
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5216
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 5216
            # SQLite schema migration on replicated storage can exceed 100s.
            # Do not kill it midway and leave migration backup tables behind.
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5216
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 5216
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: myspeed-data
              mountPath: /myspeed/data
      volumes:
        - name: myspeed-data
          persistentVolumeClaim:
            claimName: myspeed-data