regexReplaceAll "^(/myspeed/bin/speedtest)$" .soc_exe "") "") (ne .soc_parent "") (eq (regexReplaceAll "^(node)$" .soc_parent "") "") }}myspeed-ookla{{ else if and (eq .rule "Drop and execute new binary in container") (lt (unixEpoch (__timestamp__)) "1796947200") (ne .k8s_ns_name "") (eq (regexReplaceAll "^(sdr-research)$" .k8s_ns_name "") "") (ne .k8s_pod_name "") (eq (regexReplaceAll "^(cw-decoder-[a-z0-9]+-[a-z0-9]+)$" .k8s_pod_name "") "") (ne .soc_container "") (eq (regexReplaceAll "^(cw-decoder)$" .soc_container "") "") (ne .soc_image "") (eq (regexReplaceAll "^(docker\\.io/library/debian)$" .soc_image "") "") (ne .soc_image_tag "") (eq (regexReplaceAll "^(stable-slim)$" .soc_image_tag "") "") (ne .soc_process "") (eq (regexReplaceAll "^(python3|python3\\.13|py3compile)$" .soc_process "") "") (ne .soc_exe "") (eq (regexReplaceAll "^(/usr/bin/python3\\.13)$" .soc_exe "") "") (ne .soc_parent "") (eq (regexReplaceAll "^(py3compile|containerd-shim|python3\\.postins|python3\\.13\\.post|python3\\.13-mini|python3-minimal)$" .soc_parent "") "") }}cw-python{{ else if and (eq .rule "Drop and execute new binary in container") (lt (unixEpoch (__timestamp__)) "1796947200") (ne .k8s_ns_name "") (eq (regexReplaceAll "^(glacier)$" .k8s_ns_name "") "") (ne .k8s_pod_name "") (eq (regexReplaceAll "^(tor-onion-[a-z0-9]+-[a-z0-9]+)$" .k8s_pod_name "") "") (ne .soc_container "") (eq (regexReplaceAll "^(mirror)$" .soc_container "") "") (ne .soc_image "") (eq (regexReplaceAll "^(docker\\.io/library/alpine)$" .soc_image "") "") (ne .soc_image_tag "") (eq (regexReplaceAll "^(3\\.21)$" .soc_image_tag "") "") (ne .soc_process "") (eq (regexReplaceAll "^(wget)$" .soc_process "") "") (ne .soc_exe "") (eq (regexReplaceAll "^(/usr/bin/wget)$" .soc_exe "") "") (ne .soc_parent "") (eq (regexReplaceAll "^(sh)$" .soc_parent "") "") }}glacier-mirror{{ else if and (eq .rule "Clear Log Activities") (lt (unixEpoch (__timestamp__)) "1796947200") (ne .soc_container "") (eq (regexReplaceAll "^(host)$" 