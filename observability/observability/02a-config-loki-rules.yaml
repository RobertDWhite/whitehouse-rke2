          summary: Missing Kubernetes audit source rke2-node-10
          description: Check apiserver audit flags, log file and collector mounts. Quiet
            alerts are not evidence of coverage.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
