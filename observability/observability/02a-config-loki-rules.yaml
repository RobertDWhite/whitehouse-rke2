ranscribe{{ else if and (eq .rule "Read sensitive file untrusted") (lt (unixEpoch (__timestamp__)) "1796947200") (ne .k8s_ns_name "") (eq (regexReplaceAll "^(immich)$" .k8s_ns_name "") "") (ne .k8s_pod_name "") (eq (regexReplaceAll "^(immich-postgres-0)$" .k8s_pod_name "") "") (ne .soc_container "") (eq (regexReplaceAll "^(postgres)$" .soc_container "") "") (ne .soc_image "") (eq (regexReplaceAll "^(ghcr\\.io/immich-app/postgres)$" .soc_image "") "") (ne .soc_process "") (eq (regexReplaceAll "^(pg_isready)$" .soc_process "") "") (ne .soc_exe "") (eq (regexReplaceAll "^(/usr/bin/perl)$" .soc_exe "") "") (ne .soc_parent "") (eq (regexReplaceAll "^(sh)$" .soc_parent "") "") (ne .soc_file "") (eq (regexReplaceAll "^(/etc/shadow)$" .soc_file "") "") }}postgres-probe-immich{{ else if and (eq .rule "Read sensitive file untrusted") (lt (unixEpoch (__timestamp__)) "1796947200") (ne .k8s_ns_name "") (eq (regexReplaceAll "^(sdr-research)$" .k8s_ns_name "") "") (ne .k8s_pod_name "") (eq (regexReplaceAll "^(postgres-0)$" .k8s_pod_name "") "") (ne .soc_container "") (eq (regexReplaceAll "^(postgres)$" .soc_container "") "") (ne .soc_image "") (eq (regexReplaceAll "^(docker\\.io/library/postgres)$" .soc_image "") "") (ne .soc_process "") (eq (regexReplaceAll "^(pg_isready)$" .soc_process "") "") (ne .soc_exe "") (eq (regexReplaceAll "^(/usr/bin/perl)$" .soc_exe "") "") (ne .soc_parent "") (eq (regexReplaceAll "^(containerd-shim)$" .soc_parent "") "") (ne .soc_file "") (eq (regexReplaceAll "^(/etc/shadow)$" .soc_file "") "") }}postgres-probe-sdr-research{{ else if and (eq .rule "Read sensitive file untrusted") (lt (unixEpoch (__timestamp__)) "1796947200") (ne .k8s_ns_name "") (eq (regexReplaceAll "^(matrix)$" .k8s_ns_name "") "") (ne .k8s_pod_name "") (eq (regexReplaceAll "^(matrix-postgresql-0)$" .k8s_pod_name "") "") (ne .soc_container "") (eq (regexReplaceAll "^(postgres)$" .soc_container "") "") (ne .soc_image "") (eq (regexReplaceAll "^(docker\\.io/library/postgres)$" .soc_image "") "") (ne .soc_process "") (eq (regexReplaceAll "^(pg_isready)$" .soc_process "") "") (ne .soc_exe "") (eq (regexReplaceAll "^(/usr/bin/perl)$" .soc_exe "") "") (ne .soc_parent "") (eq (regexReplaceAll "^(containerd-shim)$" .soc_parent "") "") (ne .soc_file "") (eq (regexReplaceAll "^(/etc/shadow)$" .soc_file "") "") }}postgres-probe-matrix{{ else if and (eq .rule "Read sensitive file untrusted") (lt (unixEpoch (__timestamp__)) "1796947200") (ne .k8s_ns_name "") (eq (regexReplaceAll "^(condo)$" .k8s_ns_name "") "") (ne .k8s_pod_name "") (eq (regexReplaceAll "^(postgres-0)$" .k8s_pod_name "") "") (ne .soc_container "") (eq (regexReplaceAll "^(postgres)$" .soc_container "") "") (ne .soc_image "") (eq (regexReplaceAll "^((docker\\.io/library/)?postgres)$" .soc_image "") "") (ne .soc_process "") (eq (regexReplaceAll "^(pg_isready)$" .soc_process "") "") (ne .soc_exe "") (eq (regexReplaceAll "^(/usr/bin/perl)$" .soc_exe "") "") (ne .soc_parent "") (eq (regexReplaceAll "^(containerd-shim)$" .soc_parent "") "") (ne .soc_file "") (eq (regexReplaceAll "^(/etc/shadow)$" .soc_file "") "") }}postgres-probe-condo{{ else if and (eq .rule "Read sensitive file untrusted") (lt (unixEpoch (__timestamp__)) "1796947200") (ne .k8s_ns_name "") (eq (regexReplaceAll "^(congress-trades)$" .k8s_ns_name "") "") (ne .k8s_pod_name "") (eq (regexReplaceAll "^(postgres-0)$" .k8s_pod_name "") "") (ne .soc_container "") (eq (regexReplaceAll "^(postgres)$" .soc_container "") "") (ne .soc_image "") (eq (regexReplaceAll "^(docker\\.io/library/postgres)$" .soc_image "") "") (ne .soc_process "") (eq (regexReplaceAll "^(pg_isready)$" .soc_process "") "") (ne .soc_exe "") (eq (regexReplaceAll "^(/usr/bin/perl)$" .soc_exe "") "") (ne .soc_parent "") (eq (regexReplaceAll "^(containerd-shim)$" .soc_parent "") "") (ne .soc_file "") (eq (regexReplaceAll "^(/etc/shadow)$" .soc_file "") "") }}postgres-probe-congress-trades{{ else if and (eq .rule "Read sensitive file untrusted") (lt (unixEpoch (__timestamp_