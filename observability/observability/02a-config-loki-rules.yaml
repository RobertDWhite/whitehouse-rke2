          runbook_url: https://github.com/RobertDWhite/whitehouse-rke2/blob/main/observability/observability/security/README.md
      - alert: SecurityFleetTelemetryMissing
        expr: absent_over_time({source_type="endpoint"} |= "soc_heartbeat" [15m])
        for: 2m
        labels:
          severity: warning
          category: telemetry_health
          security: 'true'
          source: loki
        annotations:
          summary: No Fleet endpoint telemetry
          description: Check Fleet scheduled reports, stdout result logging, enrolled
            hosts and Promtail classification.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
          runbook_url: https://github.com/RobertDWhite/whitehouse-rke2/blob/main/observability/observability/security/README.md
      - alert: SecurityKubeTokenBurst
        expr: sum by (node,user) (count_over_time({job="kube-audit",verb="create",resource="serviceaccounts"}
          | json user="user.username",subresource="objectRef.subresource",code="responseStatus.code"
          | subresource="token" | code=~"2.." | __error__="" [5m])) > 50
        for: 15m
        labels:
          severity: warning
          category: credential_access
          security: 'true'
          source: loki
        annotations:
          summary: Elevated service-account token issuance by {{ $labels.user }}
          description: More than 50 successful TokenRequests in five minutes, sustained
            for fifteen minutes. Compare with controller activity.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
      - alert: SecurityFleetNodeMissing10
        expr: absent_over_time({source_type="endpoint",report="pack/team-1/soc_heartbeat"}
          | json endpoint="decorations.hostname" | endpoint="spark-5a67" | __error__=""
          [15m])
        for: 2m
        labels:
          severity: warning
          category: telemetry_health
          security: 'true'
          source: fleet
          host: rke2-node-10
        annotations:
          summary: Fleet heartbeat missing from rke2-node-10
          description: Expected endpoint spark-5a67 has not reported its scheduled heartbeat
            for 15 minutes. Check orbit, enrollment, Fleet reports and collector delivery.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
