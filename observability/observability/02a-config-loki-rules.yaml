apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: observability
data:
  security.yml: |
    groups:
    - name: security-soc
      interval: 30s
      rules:
      - alert: SecuritySSHBruteForce
        expr: sum by (host) (count_over_time({job="syslog",app=~"sshd|sshd-session"} |~
          "Failed password|Invalid user|authentication failure" [5m])) >= 8
        for: 0m
        labels:
          severity: warning
          category: authentication
          security: 'true'
          source: loki
          mitre_attack: T1110
        annotations:
          summary: Repeated SSH failures on {{ $labels.host }}
          description: At least eight failed SSH events in five minutes. Inspect source
            IP and user in syslog; check for subsequent successful authentication.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
          runbook_url: https://github.com/RobertDWhite/whitehouse-rke2/blob/main/observability/observability/security/README.md
      - alert: SecuritySSHRootLogin
        expr: sum by (host) (count_over_time({job="syslog",app=~"sshd|sshd-session"} |~
          "Accepted (password|publickey|keyboard-interactive/pam) for root " [2m])) >
          0
        for: 0m
        labels:
          severity: critical
          category: privilege
          security: 'true'
          source: loki
          mitre_attack: T1078
        annotations:
          summary: Remote root login on {{ $labels.host }}
          description: Verify the source and authorization for this root session. Revoke
            access and investigate if unexpected.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
          runbook_url: https://github.com/RobertDWhite/whitehouse-rke2/blob/main/observability/observability/security/README.md
      - alert: SecuritySudoDenied
        expr: sum by (host) (count_over_time({job="syslog",app="sudo"} |~ "NOT in sudoers|not
          in the sudoers|authentication failure|incorrect password" [5m])) >= 3
        for: 0m
        labels:
          severity: warning
          category: privilege
          security: 'true'
          source: loki
          mitre_attack: T1548.003
        annotations:
          summary: Repeated sudo failures on {{ $labels.host }}
          description: Inspect user, command and source session before taking action.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
          runbook_url: https://github.com/RobertDWhite/whitehouse-rke2/blob/main/observability/observability/security/README.md
      - alert: SecurityAccountChange
        expr: sum by (host) (count_over_time({job="syslog",app=~"useradd|usermod|userdel|groupadd|groupmod|groupdel"}
          [2m])) > 0
        for: 0m
        labels:
          severity: warning
          category: account_change
          security: 'true'
          source: loki
          mitre_attack: T1136.001
        annotations:
          summary: Local account or group changed on {{ $labels.host }}
          description: Check account-management logs and match the change to intended
            provisioning.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
          runbook_url: https://github.com/RobertDWhite/whitehouse-rke2/blob/main/observability/observability/security/README.md
      - alert: SecurityLogTampering
        expr: sum by (host) (count_over_time({job="syslog"} |~ "(?i)(rsyslogd.*(exiting|action.*suspended)|imjournal.*(lost|discarded)|Suppressed
          [1-9][0-9]* messages)" [5m])) > 0
        for: 0m
        labels:
          severity: warning
          category: telemetry_health
          security: 'true'
          source: loki
        annotations:
          summary: Log delivery loss or interruption on {{ $labels.host }}
          description: Check rsyslog service, queue, disk capacity and collector availability.
            This is a telemetry fault, not proof of an attack.
          dashboard_url: https://grafana.internal.white.fm/d/security-soc/security-soc
          runbook_url: https://github.com/RobertDWhite/whitehouse-rke2/blob/main/observability/observability/security/README.md
      - alert: SecurityFalcoHighPriority
