apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /var/lib/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
    - job_name: syslog
      syslog:
        listen_address: 0.0.0.0:1514
        idle_timeout: 60s
        labels:
          job: syslog
          source_type: host
    
      relabel_configs:
        - source_labels: ['__syslog_message_hostname']
          target_label: host
        - source_labels: ['__syslog_message_app_name']
          target_label: container
        - source_labels: ['__syslog_message_app_name']
          target_label: app
        - source_labels: ['__syslog_message_severity']
          target_label: syslog_severity
        - source_labels: ['__syslog_message_facility']
          target_label: facility
    
      pipeline_stages:
        - static_labels:
            category: system
        - match:
            selector: '{job="syslog", app=~"sshd|sshd-session|login|sudo|su|su-l"}'
            stages:
              - static_labels:
                  category: authentication
        - match:
            selector: '{job="syslog"} |~ "(?i)(useradd|userdel|usermod|groupadd|groupdel|groupmod)"'
            stages:
              - static_labels:
                  category: account_change
        - match:
            selector: '{job="syslog"} |= "SIEM_HEARTBEAT"'
            stages:
              - static_labels:
                  category: telemetry_health

    # UniFi remote device logging uses RFC3164 over UDP. The TCP listener
    # above remains RFC5424 for Ubuntu rsyslog forwarding.
    - job_name: unifi-syslog
      syslog:
        listen_address: 0.0.0.0:1514
        listen_protocol: udp
        syslog_format: rfc3164
        max_message_length: 65536
        labels:
          job: syslog
          source_type: network
          source: unifi
      relabel_configs:
        - source_labels: ['__syslog_message_hostname']
          target_label: host
        - source_labels: ['__syslog_message_app_name']
          target_label: app
        - source_labels: ['__syslog_message_app_name']
          target_label: container
        - source_labels: ['__syslog_message_severity']
          target_label: syslog_severity
        - source_labels: ['__syslog_message_facility']
          target_label: facility
      pipeline_stages:
        - static_labels:
            category: network
        - match:
            selector: '{source="unifi", app=~"sshd|dropbear|login|sudo|su"}'
            stages:
              - static_labels:
                  category: authentication

    - job_name: kubernetes-pods
      static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes-pods
          __path__: /var/log/pods/*/*/*.log

      pipeline_stages:
        - cri: {}
        - regex:
            source: filename
            expression: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/\d+\.log$'
        - labels:
            namespace:
            pod:
            container:
        - static_labels:
            node: ${NODE_NAME}

        - match:
            selector: '{namespace="fleet", container="fleet"} |= "soc_"'
            stages:
              - json:
                  expressions:
                    report: name
                    endpoint: hostIdentifier
              - labels:
                  report:
              - match:
                  selector: '{report=~".*soc_.*"}'
                  stages:
                    - static_labels:
                        source_type: endpoint
                        category: endpoint_activity
              - match:
                  selector: '{report=~".*soc_(local_users|uid_zero)"}'
                  stages:
                    - static_labels:
                        category: account_change
              - match:
                  selector: '{report=~".*soc_listening_ports"}'
                  stages:
                    - static_labels:
                        category: network
              - match:
                  selector: '{report=~".*soc_(cron|launchd|services)"}'
                  stages:
                    - static_labels:
                        category: persistence
              - match:
                  selector: '{report=~".*soc_heartbeat"}'
                  stages:
                    - static_labels:
                        category: telemetry_health

    # =========================================================
    # RKE2 kube-apiserver audit log.
    #
    # Server nodes only — agent nodes don't run kube-apiserver
    # and the file won't exist. Promtail's file target tails by
    # glob and just stays empty on agents (no error).
    #
    # Audit log volume is enormous (~5–50 MB/min on a busy
    # cluster). Cardinality rule of thumb: every label
    # multiplies series. Labels we promote:
    #   - job=kube-audit    (constant)
    #   - node              (one per server, ~3–5 values)
    #   - verb              (low cardinality: get/list/watch/
    #                        create/update/patch/delete/...)
    #   - resource          (~50–100 distinct values cluster-wide)
    # Labels we DO NOT promote (kept inside the log line for
    # LogQL-time filtering instead):
    #   - user.username     (high cardinality: every SA token,
    #                        kubeconfig user, OIDC subject —
    #                        could be 100s+ in a real attack
    #                        surface; would blow up the index)
    #   - namespace         (already exploded across the
    #                        kubernetes-pods stream; not worth
    #                        doubling)
    # =========================================================
    - job_name: kube-audit
      static_configs:
        - targets:
            - localhost
          labels:
            job: kube-audit
            __path__: /var/lib/rancher/rke2/server/logs/audit.log

      pipeline_stages:
        # Parse the JSON audit event.
        - json:
            expressions:
              verb: verb
              level: level
              user: 'user.username'
              resource: 'objectRef.resource'
              namespace: 'objectRef.namespace'
              stage: stage
              responseCode: 'responseStatus.code'
              audit_time: stageTimestamp

        - timestamp:
            source: audit_time
            format: RFC3339Nano
            action_on_failure: skip

        # Only keep the final stage of each event (ResponseComplete /
        # ResponseStarted / Panic). Drops the duplicate RequestReceived
        # entry — halves log volume.
        - match:
            selector: '{job="kube-audit"}'
            stages:
              - drop:
                  source: stage
                  expression: '^RequestReceived$'

        # Promote only low-cardinality fields to labels. `user` and
        # `namespace` stay in the log body, queryable via `| json` in
        # LogQL.
        - labels:
            verb:
            resource:
            level:

        # Per-node label, matching the kubernetes-pods convention above.
        - static_labels:
            node: ${NODE_NAME}
