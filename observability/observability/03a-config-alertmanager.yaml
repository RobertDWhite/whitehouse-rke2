apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: all
      group_by:
      - alertname
      - namespace
      - pod
      group_wait: 1m
      group_interval: 30m
      repeat_interval: 12h
      routes:
      - receiver: security
        matchers:
        - security="true"
        group_by:
        - alertname
        - host
        - hostname
        - node
        - user
        - rule
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 4h
        routes:
        - receiver: security
          matchers:
          - severity="critical"
          group_wait: 0s
          repeat_interval: 1h
      - receiver: all
        matchers:
        - severity=~"critical|warning"
    receivers:
    - name: all
      webhook_configs:
      - url_file: /etc/alertmanager-secrets/matrix-webhook-url
        send_resolved: false
        http_config:
          tls_config:
            insecure_skip_verify: false
      - url: http://127.0.0.1:8000/hook
        send_resolved: false
    - name: security
      webhook_configs:
      - url_file: /etc/security-webhook/url
        send_resolved: true
    inhibit_rules:
    - source_matchers:
      - severity="critical"
      target_matchers:
      - severity="warning"
      equal:
      - alertname
      - namespace
    - source_matchers:
      - alertname="PodCrashLooping"
      - namespace="observability"
      target_matchers:
      - alertname="PodCrashLooping"
      - namespace="observability"
      equal:
      - pod
    templates: []
