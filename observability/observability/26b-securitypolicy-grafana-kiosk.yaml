apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: grafana-kiosk-source-cidrs
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-kiosk-internal
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-kiosk-host
        action: Allow
        principal:
          clientCIDRs:
            # kiosk display
            - 10.100.0.43/32
            # Home Assistant VM - the System dashboard embeds the kiosk Grafana boards,
            # which carry the injected authentik headers so they render without a login.
            - 10.100.1.30/32
