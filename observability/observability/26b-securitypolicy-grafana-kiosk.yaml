apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: grafana-kiosk-source-cidrs
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-kiosk-internal
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-kiosk-host
        action: Allow
        principal:
          clientCIDRs:
            # kiosk display
            - 10.100.0.43/32
            # Home Assistant VM. It reaches the gateway over its second NIC (enp2s3),
            # so the address Envoy sees is 10.99.5.232 and NOT its 10.100.1.30 LAN address
            # (`ip route get 10.99.5.110` -> "dev enp2s3 src 10.99.5.232").
            # Note this only covers requests HA makes server-side; the dashboard's Grafana
            # cards are iframes, which the viewing browser fetches under its own IP.
            - 10.99.5.232/32
