apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: grafana-kiosk-source-cidrs
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-kiosk-internal
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-kiosk-host
        action: Allow
        principal:
          clientCIDRs:
            - 10.100.0.43/32
