apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  replicas: 1
  # RWO Longhorn volume: a rolling update deadlocks on Multi-Attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # 2026-09-19: was hard-pinned with nodeName to rke2-node-11. That bypasses the
      # scheduler (every retry while node-11 is at its pod cap dies as OutOfpods) and
      # node-11 is the overcommitted node that flaps NotReady. The data volume is
      # Longhorn, so let the scheduler place it anywhere stable.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rke2-node-11
                      - rke2-node-50
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Probe timeouts were the 1s default; Kuma's first byte on a busy node is
          # slower than that, so kubelet killed a healthy container every few minutes.
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: kuma-data
              mountPath: /app/data
      volumes:
        - name: kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
