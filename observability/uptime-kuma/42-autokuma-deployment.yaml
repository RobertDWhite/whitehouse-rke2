apiVersion: apps/v1
kind: Deployment
metadata:
  name: autokuma
  namespace: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autokuma
  template:
    metadata:
      labels:
        app: autokuma
    spec:
      # Pin to a node that holds a Longhorn replica of autokuma-pvc so the RWO
      # volume attaches locally and fast (cross-node attach to a replica-less
      # node times out and churns). Mirrors the uptime-kuma pod's node pin.
      nodeName: rke2-node-10
      containers:
        - name: autokuma
          image: ghcr.io/bigboot/autokuma
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: AUTOKUMA__KUMA__URL
              value: http://uptime-kuma.uptime-kuma.svc.cluster.local:80
            - name: AUTOKUMA__KUMA__USERNAME
              valueFrom:
                secretKeyRef:
                  name: autokuma-auth
                  key: username
            - name: AUTOKUMA__KUMA__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autokuma-auth
                  key: password
            - name: AUTOKUMA__STATIC_MONITORS
              value: /config/monitors
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            - name: AUTOKUMA__FILES__ENABLED
              value: "true"
            - name: AUTOKUMA__FILES__FOLLOW_SYMLINKS
              value: "true"
            # Down fires only after ~10 min of sustained failure
            # (interval + 10 retries x 60s). Measured over 30 days of
            # heartbeat history: 447 of Whisper's 477 down episodes were
            # <=10 min (median 60s), as were most of Weather API's and
            # Flexget's, while every genuine outage lasted 13-53 HOURS.
            # A 10 min threshold therefore drops ~95% of the notification
            # volume without hiding a single real outage. Any successful
            # check resets the retry counter, so a service that oscillates
            # (fail ~5 min / recover ~1 min, as sdr-viewer-api does) never
            # reaches the threshold at all.
            # Previous values (8 x 30s, ~4.5-5 min) still tripped on those.
            - name: AUTOKUMA__DEFAULT_SETTINGS
              value: |-
                *.interval: 60
                *.max_retries: 10
                *.retry_interval: 60
          volumeMounts:
            - name: autokuma-data
              mountPath: /data
            - name: static-monitors
              mountPath: /config/monitors
              readOnly: true
      volumes:
        - name: autokuma-data
          persistentVolumeClaim:
            claimName: autokuma-pvc
        - name: static-monitors
          configMap:
            name: autokuma-static-monitors
