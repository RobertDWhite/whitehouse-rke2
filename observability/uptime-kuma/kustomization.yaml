apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
#  - 10-pvc.yaml
  - 11-autokuma-pvc.yaml
  - 20-kuma-deployment.yaml
  - 30-kuma-svc.yaml
  - 42-autokuma-deployment.yaml
#  - 55-network-policy.yaml

generators:
  - ksops.yaml

images:
  - name: louislam/uptime-kuma
    newTag: "2.5.6@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329"
    # 2.5.5 as of 2026-09-19 (digest satisfies the require-image-digest policy).
  # Must be >= 2.1.0-rc.1: the on-disk AutoKuma state DB is already migrated
  # to version 3, and 2.0.0 (which the old digest pin actually resolved to)
  # only knows version 2 and refuses to start. Plain tags are the Uptime Kuma
  # v2 flavor (server runs 2.4.0); uptime-kuma-v1-* variants are for Kuma 1.x.
  - name: ghcr.io/bigboot/autokuma
    newTag: "2.1.0-rc.2"
