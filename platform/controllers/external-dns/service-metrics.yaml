apiVersion: v1
kind: Service
metadata:
  name: external-dns-metrics
  namespace: external-dns
  labels:
    app: external-dns
spec:
  selector:
    app: external-dns
  ports:
    - name: metrics
      port: 7979
      targetPort: 7979
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns-records-metrics
  namespace: external-dns
  labels:
    app: external-dns-records
spec:
  selector:
    app: external-dns-records
  ports:
    - name: metrics
      port: 7979
      targetPort: 7979
