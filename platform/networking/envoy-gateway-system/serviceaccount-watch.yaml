# The installed infra-manager role allows list but omits watch. The controller
# retries its ServiceAccount informer with 403s, creating an audit alert storm.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envoy-gateway-serviceaccount-watch
  namespace: envoy-gateway-system
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envoy-gateway-serviceaccount-watch
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envoy-gateway-serviceaccount-watch
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: envoy-gateway-system
