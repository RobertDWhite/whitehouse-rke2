# The installed infra-manager role allows list but omits watch for these
# managed resources. Informer retries otherwise create an audit alert storm.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envoy-gateway-serviceaccount-watch
  namespace: envoy-gateway-system
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envoy-gateway-serviceaccount-watch
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envoy-gateway-serviceaccount-watch
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: envoy-gateway-system
