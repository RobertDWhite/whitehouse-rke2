apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cinny-internal
  namespace: matrix
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - cinny.internal.white.fm
  rules:
    - backendRefs:
        - name: cinny
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fluffychat-internal
  namespace: matrix
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https-internal-white-fm
  hostnames:
    - fluffychat.internal.white.fm
  rules:
    - backendRefs:
        - name: fluffychat
          port: 80
