# EndpointSlice for the headless garage-s3 Service in this namespace.
# The IP is the on-prem NAS host, where Garage runs as a Docker container
# (/volume1/docker/garage). Garage serves the S3 API on :3900 over plain
# HTTP - it has no built-in TLS - so the BSL uses an http:// s3Url.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: garage-s3
  namespace: external-services
  labels:
    kubernetes.io/service-name: garage-s3
addressType: IPv4
ports:
  - name: http
    port: 3900
    protocol: TCP
endpoints:
  - addresses:
      - 10.100.1.20
    conditions:
      ready: true
