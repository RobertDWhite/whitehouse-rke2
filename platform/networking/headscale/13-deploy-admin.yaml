apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale-admin
  namespace: headscale
  labels:
    app: headscale-admin
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: headscale-admin
  template:
    metadata:
      labels:
        app: headscale-admin
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rke2-node-14
                      - rke2-node-50
      # 0.28.0 switched the image from nginx-unprivileged to caddy:latest, which
      # has no USER and wants writable /data + /config. Run it as the nonroot
      # uid on 8080 instead of relying on the image (2026-09-20; the 0.28.0 pod
      # had sat in CreateContainerConfigError for a week behind the old RS).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: admin
          image: goodieshq/headscale-admin
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
              # The caddy binary carries a cap_net_bind_service file capability;
              # without it in the bounding set exec fails with "operation not permitted".
              add: ["NET_BIND_SERVICE"]
