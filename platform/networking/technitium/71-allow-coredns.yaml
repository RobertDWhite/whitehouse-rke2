# CoreDNS forwards external queries to dnscrypt-proxy. Default-deny ingress
# otherwise drops that path even while Technitium itself remains healthy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-dnscrypt-from-coredns
  namespace: technitium
spec:
  podSelector:
    matchLabels:
      app: dnscrypt-proxy
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
