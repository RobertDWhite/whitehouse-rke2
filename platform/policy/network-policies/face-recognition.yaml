# ======================== FACE-RECOGNITION ========================
# Simple-web-app pattern (default-deny + open egress + gateway ingress) plus
# intra-namespace ingress so Double Take can reach CompreFace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: face-recognition}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-all-egress, namespace: face-recognition}
spec: {podSelector: {}, policyTypes: [Egress], egress: [{}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress, namespace: face-recognition}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: authentik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: uptime-kuma}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
