# IntelOwl: narrow ingress by application role, gateway and monitor.
# Egress remains unrestricted for analyzer integrations pending a flow review.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: intelowl
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: intelowl
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: intelowl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intelowl-web
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy
          gateway.envoyproxy.io/owning-gateway-name: main
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
      podSelector:
        matchLabels:
          app: uptime-kuma
    ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-bootstrap
  namespace: intelowl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intelowl-web
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - intelowl-web
          - intelowl-daphne
          - intelowl-celery-worker
          - intelowl-celery-beat
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
      podSelector:
        matchLabels:
          app: uptime-kuma
    ports:
    - protocol: TCP
      port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-daphne
  namespace: intelowl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intelowl-daphne
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: intelowl-web
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uptime-kuma
      podSelector:
        matchLabels:
          app: uptime-kuma
    ports:
    - protocol: TCP
      port: 8011
---
