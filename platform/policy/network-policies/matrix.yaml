# =============================================================
# matrix namespace — Synapse, Element, Hookshot, Maubot, Postgres, Redis
# =============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]

---
# ingress-nginx → synapse, element, hookshot, well-known
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik

---
# Prometheus scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - {protocol: TCP, port: 8008}
        - {protocol: TCP, port: 9187}
        - {protocol: TCP, port: 9121}

---
# freshrss daily-digest → hookshot (webhook)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-freshrss-hookshot
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app: matrix-hookshot
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: freshrss
      ports:
        - {protocol: TCP, port: 9000}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uptime-kuma
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma

---
# clean-audio-mcp job notifications → Hookshot (Media room webhook)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clean-audio-mcp-hookshot
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app: matrix-hookshot
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clean-audio-mcp
      ports:
        - {protocol: TCP, port: 9000}

---
# Politics daily digest → Hookshot encrypted-room webhook
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-politics-digest-to-hookshot
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app: matrix-hookshot
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: politics
          podSelector:
            matchLabels:
              app: politics-matrix-digest
      ports:
        - protocol: TCP
          port: 9000

---
# Brain room (encrypted): Forgejo push webhook on the brain repo and the daily
# brain-briefing → Hookshot
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-brain-to-hookshot
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app: matrix-hookshot
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: brain
          podSelector:
            matchLabels:
              app: brain-briefing
      ports:
        - {protocol: TCP, port: 9000}
