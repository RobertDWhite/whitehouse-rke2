# =============================================================
# qwen-flash namespace: Qwen3.8-Flash-Next vLLM server on node-10
# =============================================================
# OpenAI-compatible API on :8000 for in-cluster consumers (hermes, ...) and the
# LAN. Egress stays open: the fetch-weights init container downloads the
# checkpoint from Hugging Face.
# =============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: qwen-flash
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: qwen-flash
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: qwen-flash
spec:
  podSelector:
    matchLabels:
      app: qwen-flash
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - {protocol: TCP, port: 8000}
