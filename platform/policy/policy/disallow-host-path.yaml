apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath Volumes
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods must not mount host filesystem paths. Workloads that
      legitimately need hostPath (log tailers, CIS scanners, kernel
      routing, hardware passthrough) are listed in the exclude block.
spec:
  # Enforced; see failureActionOverrides for the namespaces still in Audit.
  # `kubectl debug node/...` mounts the host root, so run it with
  # `-n kube-system` (exempt) rather than in `default`.
  background: true
  failurePolicy: Ignore
  rules:
    - name: hostpath-not-allowed
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          # Same platform exception set as disallow-privileged-containers.
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - metallb-system
                - falco
                - crowdsec
                - calico-system
                - calico-apiserver
                - tigera-operator
                - nvidia-device-plugin
                - kyverno
          # promtail tails /var/log/pods + /var/lib/rancher/rke2/server/logs
          # (added when the H12 audit log pipeline landed).
          - resources:
              namespaces:
                - observability
              names:
                - promtail-*
          # kube-bench reads /etc, /var/lib/kubelet, etc. to validate CIS.
          - resources:
              namespaces:
                - kube-bench
          # Hardware passthrough + sysctl writers from the privileged list.
          - resources:
              namespaces:
                - sdr-research
              names:
                - soapy-sysctl-*
                - rtl-sdr-*
                - rx888-soapy-*
                - airspy-soapy-*
                - unified-sdr-*
                - ft8-wspr-decoder-*
                - hf-combined-*
          - resources:
              namespaces:
                - headscale
              names:
                - tailscale-router-*
          - resources:
              namespaces:
                - node-init
          # Node exporter and other DaemonSets shipped with kube-state /
          # observability that walk host /proc, /sys.
          - resources:
              namespaces:
                - observability
              names:
                - node-exporter-*
      validate:
        # Enforced cluster-wide since 2026-11-11. The namespaces below still run
        # workloads that violate this rule (or create short-lived
        # helper pods that do: local-path-storage, trivy-system), so
        # they stay in Audit until those workloads are fixed or given a named
        # entry in the exclude block above. Every other namespace had zero
        # violations (running pods and all workload templates) at the switch.
        failureAction: Enforce
        failureActionOverrides:
          - action: Audit
            namespaces:
              - adsb
              - headscale
              - local-path-storage
              - media
              - observability
              - scrypted
              - sdr-research
              - synology-csi
              - trivy-system
              - velero
        message: >-
          hostPath volumes are not allowed. If this workload needs host
          filesystem access, add the namespace/name pattern to the policy
          `exclude` block rather than weakening the rule.
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"
