apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: php-containment-host-access
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
    - name: block-host-access
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [freshrss, wallabag, misp]
      validate:
        message: PHP workloads must not use privileged containers, host namespaces, or hostPath volumes.
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
            =(volumes):
              - X(hostPath): "null"
            containers:
              - =(securityContext):
                  =(privileged): false
            =(initContainers):
              - =(securityContext):
                  =(privileged): false
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): false
