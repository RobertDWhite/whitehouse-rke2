# The bundled `longhorn` StorageClass (default class). StorageClass parameters are
# immutable, so this must match the live object's parameters exactly or every
# longhorn-mods sync fails here. It used to add recurringJobSelector, which the
# live class never had; that is unnecessary because Longhorn applies the
# `default` recurring-job group (nightly NFS backup + hourly snapshot, see
# recurringjobs.yaml) to any volume without recurring-job labels.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: disabled
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
