apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-immich-photos
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    # Parameters are immutable; Argo recreates the object (existing PVs untouched).
    argocd.argoproj.io/sync-options: Force=true,Replace=true
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  # Immich lives only on the 20 TB HDDs (2026-10-23): node-11 and node-14 each
  # carry one `immich-20tb` disk tagged `immich-photos` and `immich-media`. Two
  # replicas, one per disk; the originals are also synced to the Synology by
  # immich-photos-bidirectional-sync.
  diskSelector: immich-photos
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  dataLocality: disabled
  fsType: ext4
  # Only the weekly trim. Longhorn puts a volume with no recurring-job labels
  # into the `default` group, and hourly snapshots of a multi-TB bulk load
  # wedge replica rebuilds behind snapshot purges (seen 2026-10-14 and
  # 2026-10-23), so the group has to be named explicitly.
  recurringJobSelector: '[{"name":"immich-photos","isGroup":true}]'
