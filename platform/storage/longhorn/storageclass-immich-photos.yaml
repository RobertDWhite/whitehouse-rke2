apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-immich-photos
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  # Immich lives on node-14's 18 TB HDD only (2026-10-14): node-14's disk carries
  # both the `immich-photos` and `immich-media` tags. node-11's Immich disk was
  # evicted; sharing it with general volumes had node-11 (a control-plane node)
  # I/O-starved. Single replica: the originals are also synced to the Synology
  # by immich-photos-bidirectional-sync.
  diskSelector: immich-photos
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  dataLocality: disabled
  fsType: ext4
  # Deliberately NO recurringJobSelector. Attaching the default group to a
  # multi-TB bulk load produced 1.27 TB of hourly snapshots on the media
  # volume and wedged its replica rebuild behind a snapshot purge.
