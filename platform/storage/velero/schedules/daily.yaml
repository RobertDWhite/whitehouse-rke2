apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-critical
  namespace: velero
spec:
  schedule: "0 3 * * *"
  template:
    # Catch-all: every namespace that is not cluster plumbing or on another
    # schedule. This used to be an allowlist, and by 2026-10-09 it had
    # silently missed 18 namespaces with real data (technitium, media's *arr
    # configs, opencti, ntfy, riffado, gramps, kavita, wallabag, ...). New
    # apps are now covered without anyone remembering to add them here.
    includedNamespaces:
      - "*"
    excludedNamespaces:
      # Cluster plumbing - rebuilt from git, never restored from Velero.
      - kube-system
      - kube-public
      - kube-node-lease
      - velero
      - argocd
      - longhorn-system
      - local-path-storage
      - synology-csi
      - metallb-system
      - envoy-gateway-system
      - cert-manager
      - external-dns
      - external-secrets
      - kyverno
      - trivy-system
      - kube-bench
      # Own schedules (weekly.yaml). tautulli is deliberately in both daily
      # and weekly. glacier is covered here: its own glacier-daily Schedule
      # was removed because Argo's apps project cannot create in velero.
      - homepage
      - homarr
      - myspeed
      - cyberchef
      - observability
      - postfix
      - adsb
      - cloudflare
      - crowdsec
      - falco
      - immich
      - openhamclock
      - portainer
    # CronJob pod templates carry velero.io/exclude-from-backup: "true". A job
    # pod that is running when the backup starts and exits mid-run failed the
    # whole backup ("error getting client pod ... not found"). Their volumes
    # are either shared with a long-running pod that is backed up through it,
    # or hold dumps that only got backed up when a run happened to overlap.
    # Skips NFS (NAS shares - copying them back onto the same NAS only burns
    # hours) and emptyDir scratch volumes. See volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy
    # Longhorn volumes <=100Gi take the volume policy's snapshot action:
    # CSI snapshot, then kopia moves the data to Garage (snapshotMoveData), so
    # the backup does not depend on in-cluster Longhorn snapshots. Requires
    # features: EnableCSI on the velero chart. Other volumes stay fs-backup.
    snapshotVolumes: true
    snapshotMoveData: true
    ttl: 168h # 7 days
