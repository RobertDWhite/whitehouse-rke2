apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-critical
  namespace: velero
spec:
  schedule: "0 3 * * *"
  template:
    # Catch-all: every namespace that is not cluster plumbing or on another
    # schedule. This used to be an allowlist, and by 2026-10-09 it had
    # silently missed 18 namespaces with real data (technitium, media's *arr
    # configs, opencti, ntfy, riffado, gramps, kavita, wallabag, ...). New
    # apps are now covered without anyone remembering to add them here.
    includedNamespaces:
      - "*"
    excludedNamespaces:
      # Cluster plumbing - rebuilt from git, never restored from Velero.
      - kube-system
      - kube-public
      - kube-node-lease
      - velero
      - argocd
      - longhorn-system
      - local-path-storage
      - synology-csi
      - metallb-system
      - envoy-gateway-system
      - cert-manager
      - external-dns
      - external-secrets
      - kyverno
      - trivy-system
      - kube-bench
      # Own schedules (glacier-daily lives in the glacier app; weekly.yaml).
      # tautulli is deliberately in both daily and weekly.
      - glacier
      - homepage
      - homarr
      - myspeed
      - cyberchef
      - observability
      - postfix
      - adsb
      - cybether
      - cloudflare
      - crowdsec
      - falco
      - immich
      - openhamclock
      - portainer
    # Skips NFS (NAS shares - copying them back onto the same NAS only burns
    # hours) and emptyDir scratch volumes. See volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy
    # Velero here is v1.13.2 with ONLY velero-plugin-for-aws loaded and no
    # `features: EnableCSI`, so there is no CSI plugin and no VolumeSnapshotter:
    # snapshotVolumes/snapshotMoveData could never do anything except log
    # "unable to get valid VolumeSnapshotter for velero.io/csi" once per PVC.
    # Volume data is protected by file-system backup (kopia) via the chart-wide
    # defaultVolumesToFsBackup: true, which is what has actually been running.
    # Re-enable these only together with the CSI plugin + EnableCSI feature flag.
    snapshotVolumes: false
    ttl: 168h # 7 days
