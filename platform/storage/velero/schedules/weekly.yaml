apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-secondary
  namespace: velero
spec:
  schedule: "0 2 * * 0"
  template:
    includedNamespaces:
      - homepage
      - homarr
      - tautulli
      - jellystat
      - myspeed
      - cyberchef
      - observability
      - postfix
      - adsb
      - cloudflare
      - crowdsec
      - falco
      - immich
      - openhamclock
      - portainer
    # Longhorn volumes <=100Gi take the volume policy's snapshot action:
    # CSI snapshot, then kopia moves the data to Garage (snapshotMoveData), so
    # the backup does not depend on in-cluster Longhorn snapshots. Requires
    # features: EnableCSI on the velero chart. Other volumes stay fs-backup.
    # Skips NFS and emptyDir volumes - see volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy
    snapshotVolumes: true
    snapshotMoveData: true
    ttl: 1176h # 49 days
    # The 2026-08-16 run hit the 4h default itemOperationTimeout exactly
    # (22:00 -> 02:00) and failed with "timed out waiting for all
    # PodVolumeBackups to complete" -- immich's NFS-backed volumes dominate
    # this set and kopia needs longer than the default allows.
    itemOperationTimeout: 8h
