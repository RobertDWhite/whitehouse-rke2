# Velero resource policy referenced by the schedules' resourcePolicy.
#
# - NFS volumes are shares on the Synology itself (20Ti media library, books,
#   photos, downloads). Backing them up writes them back onto the same NAS,
#   protects against nothing the NAS's own snapshots don't, and turned the
#   nightly run into a multi-hour crawl that hit itemOperationTimeout.
# - emptyDir volumes (dshm, tmp, caches) are scratch space by definition.
# - Immich's Longhorn media copies (uploads ~2 TB, photo library ~8 TB) are
#   copies of NAS data. Uploads sync to the Synology hourly
#   (immich-upload-to-synology-sync), and the photo library is filled from the
#   NAS. Copying them through kopia never finished: the weekly run sat on 2 TB
#   for hours, blocked every later backup, and loaded node-14's disks. Immich's
#   Postgres (longhorn-immich-db) is still backed up.
#
# - Longhorn volumes up to 100Gi are backed up from a CSI snapshot (class
#   longhorn-velero-snap) and the data moved to Garage with kopia
#   (snapshotMoveData in the schedules). File-system backup of live volumes
#   failed whenever a file vanished mid-copy: kopia treats that as fatal and
#   cancels the upload (hermes kanban.db-wal, technitium, sdr-artifacts-hf,
#   2026-10-22..24). A snapshot is a crash-consistent point in time. v1-engine
#   clones are full copies, so the >100Gi artifact volumes (sdr-artifacts,
#   sdr-artifacts-rwx, prometheus) stay on file-system backup to keep the run
#   inside itemOperationTimeout. Detached Longhorn volumes, which fs-backup
#   could never reach (no pod), are now included as well.
#   storageClass is listed explicitly: velero-node-agent-config maps each of
#   these to the one-replica longhorn-velero-backup class for the clone.
#
# Everything else (Synology CSI, local-path, the class-less
# tautulli-restore-tmp PV, large Longhorn volumes) is file-system backed up
# via defaultVolumesToFsBackup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-volume-policy
  namespace: velero
data:
  policy.yaml: |
    version: v1
    volumePolicies:
      - conditions:
          nfs: {}
        action:
          type: skip
      - conditions:
          volumeTypes:
            - emptyDir
        action:
          type: skip
      - conditions:
          storageClass:
            - longhorn-immich-media
            - longhorn-immich-photos
        action:
          type: skip
      - conditions:
          capacity: "0,100Gi"
          csi:
            driver: driver.longhorn.io
          storageClass:
            - longhorn
            - longhorn-2
            - longhorn-single
            - longhorn-retain
            - longhorn-static
            - longhorn-immich-db
        action:
          type: snapshot
