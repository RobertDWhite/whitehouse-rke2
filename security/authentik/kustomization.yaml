apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik

generators:
  - ksops.yaml

resources:
  - 20-service-alias-authentik.yaml
  - 21-postgres-exporter.yaml
  - 22-redis.yaml
  - 31-referencegrant-cyberchef.yaml
  - 32-backend-tls-policy.yaml
  - 32-referencegrant-backoffice.yaml
  - 33-referencegrant-phase3-batch.yaml
  - 34-referencegrant-kavita.yaml
  - 35-referencegrant-wallabag.yaml
  - 35-referencegrant-appstore.yaml
  - 36-referencegrant-comfyui.yaml
  - 37-referencegrant-invokeai.yaml

patches:
  - path: 30-server-tls-mount-patch.yaml

images:
  - name: quay.io/prometheuscommunity/postgres-exporter
    newTag: "v0.20.1"
  - name: redis
    newTag: "8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0"

helmCharts:
  - name: authentik
    releaseName: authentik
    version: 2026.8.3
    repo: https://charts.goauthentik.io
    valuesFile: values.yaml
    includeCRDs: true
    namespace: authentik
