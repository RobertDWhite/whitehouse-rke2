# Matrix (Hookshot) webhook URL for falcosidekick.
# A Hookshot webhook URL is a bearer credential — anyone holding it can post
# into the room. Wired in via falcosidekick.config.existingSecret in
# argo-cd/applications/falco-app.yaml, which appends this Secret to the
# container's envFrom after the chart-generated one, so WEBHOOK_ADDRESS here
# overrides the chart's empty value.
